name: EAS Preview Update

on:
  push:
    branches: [ dev ]

jobs:
  update:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Verify EAS auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not available to this workflow. Add it under repository Settings > Secrets and variables > Actions, or under the preview environment if using environment secrets."
            exit 1
          fi
          eas whoami --non-interactive

      - name: Publish preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: 1
        run: eas update --channel preview --environment preview --message "auto preview update from dev" --non-interactive

// 从形如"约25-35g"或"约750 kcal"的字符串解析数值中点
function parseNutritionMidpoint(rangeStr){
  if(!rangeStr || typeof rangeStr!=='string') return null;
  const nums=rangeStr.match(/\d+(?:\.\d+)?/g);
  if(!nums||!nums.length) return null;
  if(nums.length===1) return Number(nums[0]);
  return Math.round((Number(nums[0])+Number(nums[nums.length-1]))/2);
}

// 营养结构卡（进度条版）
function renderSummaryNutritionCard(m){
  const a=m.analysis||{};
  const n=normalizeNutritionEstimate(a.nutritionEstimate,a.foodType);
  const ai=m.actualIntakeAnalysis;
  const fb=m.fb||{};

  // 确定实际摄入比例
  let intakeRatio=1.0;
  if(ai&&typeof ai.intakeRatio==='number') intakeRatio=ai.intakeRatio;
  else if(typeof fb.actualIntakeValue==='number') intakeRatio=fb.actualIntakeValue;
  else if(fb.actualIntake) intakeRatio=intakeRatioInfo(fb.actualIntake).ratio;

  const calMid=parseNutritionMidpoint(n.calories.range);
  const protMid=parseNutritionMidpoint(n.protein.range);
  const carbMid=parseNutritionMidpoint(n.carbs.range);
  const fatMid=parseNutritionMidpoint(n.fat.range);

  const actualCal=calMid?Math.round(calMid*intakeRatio):null;
  const actualProt=protMid?Math.round(protMid*intakeRatio):null;
  const actualCarb=carbMid?Math.round(carbMid*intakeRatio):null;
  const actualFat=fatMid?Math.round(fatMid*intakeRatio):null;

  function makeBar(label,value,max,level,color){
    if(!value) return '';
    const filled=Math.min(8,Math.round(value/max*8));
    const bar='▮'.repeat(filled)+'░'.repeat(8-filled);
    const lvl=(level&&level!=='待确认')?level:'';
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.05)">
        <span style="font-size:12px;color:var(--ink60);width:28px;flex-shrink:0">${label}</span>
        <span style="font-family:monospace;font-size:13px;color:${color};flex:1;letter-spacing:.05em">${bar}</span>
        <span style="font-size:13px;font-weight:700;color:var(--ink)">${value}g</span>
        ${lvl?`<span style="font-size:11px;color:var(--ink60);background:rgba(0,0,0,.06);border-radius:999px;padding:2px 8px;flex-shrink:0">${lvl}</span>`:''}
      </div>`;
  }

  const protLevel=actualProt!==null?metricLevel('protein',actualProt):n.protein.level;
  const carbLevel=actualCarb!==null?metricLevel('carbs',actualCarb):n.carbs.level;
  const fatLevel=actualFat!==null?metricLevel('fat',actualFat):n.fat.level;
  const calText=actualCal?`约 ${actualCal} 千卡`:(n.calories.range||'');

  return `<div class="card fade" style="background:var(--cream);border:none;padding:14px;margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <span style="font-size:13px;font-weight:700;color:var(--ink)">实际摄入</span>
      <span style="font-family:var(--serif);font-size:17px;font-weight:700;color:var(--accent)">${calText}</span>
    </div>
    ${makeBar('蛋白',actualProt,70,protLevel,'#1F8A70')}
    ${makeBar('碳水',actualCarb,140,carbLevel,'#2F80ED')}
    ${makeBar('脂肪',actualFat,70,fatLevel,'var(--amber)')}
  </div>`;
}

// 判断一条洞察是否与本餐相关
function isRelevantToMeal(ins,meal){
  const mealTags=(meal.analysis&&meal.analysis.tags)||[];
  const mealCuisine=meal.cuisine||(meal.analysis&&meal.analysis.cuisine)||'';
  const mealDish=meal.dish||'';
  if(!ins.triggers||!ins.triggers.length) return false;
  if(ins.triggers.some(t=>mealTags.some(tag=>tag.includes(t)))) return true;
  if(ins.target&&ins.target===mealCuisine) return true;
  if(ins.triggers.some(t=>t===mealCuisine)) return true;
  if(ins.target&&mealDish.includes(ins.target)) return true;
  return false;
}

// 本餐相关洞察模块（消费 deriveInsights 引擎）
// 档位 A：基于本餐 tags 的常识建议（冷启动，拼图未解锁时使用）
function buildGenericMealAdvice(meal){
  const tags = meal.analysis?.tags || [];
  const type = meal.type || '';
  const rules = [
    { test: t => t.includes('高碳水') || t.includes('主食偏多'),
      text: '高碳水的餐可能让你下午犯困，吃完走几分钟有帮助。' },
    { test: t => t.includes('油炸') || t.includes('高脂肪'),
      text: '油炸食物消化负担相对重，饭后不要立刻剧烈运动。' },
    { test: t => t.includes('辛辣'),
      text: '辛辣食物可能刺激肠胃，如果饭后有不舒服记录下来。' },
    { test: t => t.includes('高蛋白'),
      text: '蛋白质充足，有助于保持饱腹感和下午的精力。' },
    { test: t => t.includes('蔬菜丰富') || t.includes('清淡'),
      text: '清淡蔬菜为主的餐，肠胃感受通常比较好。' },
  ];
  for(const { test, text } of rules){
    if(tags.some(test)) return { text };
  }
  if(type === '午饭' || type === '午餐') return { text: '午饭后稍微动一动，有助于保持下午的精力。' };
  return { text: '记录这餐的饭后感受，慢慢发现属于你的饮食规律。' };
}

// 总结页"本餐反应预测"模块（3 档降级）
// 档位 A：拼图未解锁 → 通用建议 + "还在了解你" + "再记 N 餐"
// 档位 B：拼图已解锁，血糖未解锁 → 方向性预测，不给具体时间点
// 档位 C：拼图+血糖均解锁 → 占位 stub（Phase 4 才实现）
function renderMealReactionPrediction(meal){
  const puzzleUnlocked = isBodyPuzzleUnlocked(meals);
  const glucoseUnlocked = isGlucoseUnlocked(profile);
  const grade = !puzzleUnlocked ? 'A' : glucoseUnlocked ? 'C' : 'B';

  if(grade === 'A'){
    const advice = buildGenericMealAdvice(meal);
    const mealsNeeded = Math.max(0, 7 - meals.length);
    return `<div class="card fade" style="background:linear-gradient(135deg,#f8f4f0,#f0eae4);border:none;padding:14px;margin-bottom:16px">
      <p style="font-size:11px;font-weight:700;color:var(--ink60);margin-bottom:8px">🔮 本餐反应预测</p>
      <p style="font-size:14px;color:var(--ink);font-weight:600;line-height:1.5;margin-bottom:6px">${advice.text}</p>
      <p style="font-size:11px;color:var(--ink40);font-style:italic;margin-bottom:${mealsNeeded>0?4:0}px">这是通用提示，还在了解你</p>
      ${mealsNeeded > 0 ? `<p style="font-size:12px;color:var(--ink60)">再记 ${mealsNeeded} 餐解锁身体拼图</p>` : ''}
    </div>`;
  }

  if(grade === 'B'){
    const allInsights = deriveInsights(meals);
    const reactionInsights = allInsights.filter(ins =>
      ins.category === 'reaction' && ins.maturity === 'mature' && isRelevantToMeal(ins, meal)
    );
    if(reactionInsights.length){
      const top = reactionInsights.sort((a,b) => b.confidence - a.confidence)[0];
      const dirHint = top.outcome === '困倦'
        ? '饭后容易犯困，建议饭后稍微走走，避免久坐'
        : top.outcome === '胀气'
          ? '饭后可能有些胀气，避免马上躺下，吃慢一点'
          : '注意饭后身体感受，记录下来积累规律';
      return `<div class="card fade" style="background:linear-gradient(135deg,#f0f4f9,#e8eef4);border:none;padding:14px;margin-bottom:16px">
        <p style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:8px">🔮 本餐反应预测</p>
        <p style="font-size:14px;color:var(--ink);font-weight:600;line-height:1.5;margin-bottom:6px">${dirHint}</p>
        <p style="font-size:12px;color:var(--ink60)">基于你 ${top.evidence.sampleSize} 次类似餐的记录推断</p>
      </div>`;
    }
    // 无相关 mature reaction 洞察 → 回退通用建议
    const advice = buildGenericMealAdvice(meal);
    return `<div class="card fade" style="background:linear-gradient(135deg,#f0f4f9,#e8eef4);border:none;padding:14px;margin-bottom:16px">
      <p style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:8px">🔮 本餐反应预测</p>
      <p style="font-size:14px;color:var(--ink);font-weight:600;line-height:1.5;margin-bottom:6px">${advice.text}</p>
      <p style="font-size:12px;color:var(--ink60)">继续积累反应类记录，预测会越来越精准</p>
    </div>`;
  }

  // Grade C：Phase 4 精确预测，当前 stub，不显示
  return '';
}

  window._wasFasting = false;

  const newBlock = detectNewlyUnlockedPuzzleBlock(meals, prevMeals);
  let blockPopupShown = false;
  if(newBlock){
    const celebKey = 'puzzle_celebrated_' + newBlock;
    if(!localStorage.getItem(celebKey)){
      localStorage.setItem(celebKey, '1');
      setTimeout(()=>showPuzzleUnlockCelebration(newBlock), 350);
      blockPopupShown = true;
    }
  }

  // ── 洞察首次成熟弹窗（"我发现了一个规律"，按 insight.id 一次性去重）──

  try {
    const prevInsights = (typeof deriveInsights === 'function') ? deriveInsights(prevMeals, 1) : [];
    const currInsights = (typeof deriveInsights === 'function') ? deriveInsights(meals, 1) : [];
    const prevMatureIds = new Set(prevInsights.filter(i => i.maturity === 'mature').map(i => i.id));
    const newlyMature = currInsights.find(i => i.maturity === 'mature' && !prevMatureIds.has(i.id));
    if(newlyMature){
      const insKey = 'insight_celebrated_' + newlyMature.id;
      if(!localStorage.getItem(insKey)){
        localStorage.setItem(insKey, '1');

          const delay = blockPopupShown ? 1800 : 350;
          setTimeout(()=>showBodyMirrorIfReady(mirror), delay);

      }
    }
  } catch(e){ console.warn('insight maturation popup check failed', e); }
}

// ── Layer 2 洞察引擎（蓝图契约实现）────────────────────────────────────────────
// idempotent：永远从 Layer 1 重算，不持久化中间洞察
// 第 3 个参数 options 支持扩展输入：profile / dailyCheckins / cardActions
//   - profile: 用户档案，触发 goal_alignment 类洞察（修 1）
//   - dailyCheckins: 每日回访数组，触发 reaction.next_day 类洞察（修 3）
//   - cardActions: 抽卡选择记录，强化 preference 类洞察（修 4）
// 为向后兼容，options 为空时引擎按原行为运行
function deriveInsights(meals, currentPhase, options){
  if(currentPhase===undefined) currentPhase=1;
  const opts = options || {};
  // 自动从全局取（若调用者未显式传入）
  const _profile = opts.profile || (typeof profile !== 'undefined' ? profile : null);
  const _checkins = opts.dailyCheckins || (typeof dailyCheckins !== 'undefined' ? dailyCheckins : []);
  const _cardActions = opts.cardActions || (typeof cardActions !== 'undefined' ? cardActions : []);
  const withFb = meals.filter(m=>m.fb);
  const now = new Date().toISOString();
  const results = [];

  function stableId(angle){ return 'ins_'+angle.replace(/[^a-z0-9一-鿿]/gi,'_'); }
  function comfortIncludes(fb){
    const vals=[].slice.call(arguments,1);
    const c=fb&&fb.comfort;
    if(!c) return false;
    return Array.isArray(c)?vals.some(v=>c.includes(v)):vals.includes(c);
  }
  function maturityLevel(n,hitRate){
    if(n>=5&&hitRate>=0.6) return 'mature';
    if(n>=3&&hitRate>=0.5) return 'forming';
    return 'sparse';
  }
  function cuisineOf(m){ return m.cuisine||m.analysis&&m.analysis.cuisine||null; }
  function satisfiedV(m){
    if(typeof m.fb.satisfactionValue==='number') return m.fb.satisfactionValue>0;
    if(m.fb.satisfaction) return m.fb.satisfaction==='还不错'||m.fb.satisfaction==='很开心';
    return m.fb.mood==='满足'; // 兼容旧数据 mood 字段
  }
  function regretV(m){
    if(typeof m.fb.satisfactionValue==='number') return m.fb.satisfactionValue<0;
    if(m.fb.satisfaction) return m.fb.satisfaction==='有点后悔';
    return m.fb.mood==='后悔'; // 兼容旧数据 mood 字段
  }

  // ── preference: 高满意度菜系 ──
  const satisfiedMeals=withFb.filter(satisfiedV);
  const cuisFreq={};
  satisfiedMeals.forEach(m=>{const c=cuisineOf(m);if(c&&c!=='家常菜'&&c!=='全国'&&c!=='未知')cuisFreq[c]=(cuisFreq[c]||0)+1;});
  Object.entries(cuisFreq).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(function(entry){
    const cuisine=entry[0],count=entry[1];
    const total=withFb.filter(m=>cuisineOf(m)===cuisine).length;
    if(!total) return;
    const hitRate=count/total;
    const mat=maturityLevel(count,hitRate);
    const refs=satisfiedMeals.filter(m=>cuisineOf(m)===cuisine).map(m=>String(m.id));
    const last=satisfiedMeals.filter(m=>cuisineOf(m)===cuisine).sort(function(a,b){return b.ts-a.ts;})[0];
    results.push({id:stableId('偏好-'+cuisine),category:'preference',angle:'偏好-'+cuisine,triggers:[cuisine],target:cuisine,
      evidence:{sampleSize:count,hitRate:hitRate,lastObservedAt:last&&last.ts?new Date(last.ts).toISOString():now,sourceRefs:refs},
      maturity:mat,confidence:Math.min(0.5+hitRate*0.5,1),requires:[1],computedAt:now});
  });

  // ── avoid: 低满意度 + 后悔 ──
  const regretMeals=withFb.filter(regretV);
  const avoidFreq={};
  regretMeals.forEach(m=>{const c=cuisineOf(m);if(c&&c!=='家常菜'&&c!=='全国'&&c!=='未知')avoidFreq[c]=(avoidFreq[c]||0)+1;});
  Object.entries(avoidFreq).sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(function(entry){
    const cuisine=entry[0],count=entry[1];
    if(count<2) return;
    const total=withFb.filter(m=>cuisineOf(m)===cuisine).length;
    const hitRate=count/Math.max(total,count);
    const mat=maturityLevel(count,hitRate);
    const refs=regretMeals.filter(m=>cuisineOf(m)===cuisine).map(m=>String(m.id));
    const last=regretMeals.filter(m=>cuisineOf(m)===cuisine).sort(function(a,b){return b.ts-a.ts;})[0];
    results.push({id:stableId('回避-'+cuisine),category:'avoid',angle:'回避-'+cuisine,triggers:[cuisine],target:cuisine,
      evidence:{sampleSize:count,hitRate:hitRate,lastObservedAt:last&&last.ts?new Date(last.ts).toISOString():now,sourceRefs:refs},
      maturity:mat,confidence:Math.min(0.4+hitRate*0.6,1),requires:[1],computedAt:now});
  });

  // ── reaction.bloated: tags 含油炸/主食偏多 && comfort 含胀气 ──
  const bloatedAll=withFb.filter(m=>comfortIncludes(m.fb,'胀气'));
  const bloatedOil=bloatedAll.filter(m=>(m.analysis&&m.analysis.tags||[]).some(t=>t.includes('油炸')||t.includes('主食偏多')));
  if(bloatedAll.length>0){
    const hitRate=bloatedOil.length/bloatedAll.length;
    const refs=bloatedOil.map(m=>String(m.id));
    const last=bloatedOil.slice().sort(function(a,b){return b.ts-a.ts;})[0];
    results.push({id:stableId('reaction-bloated-oil'),category:'reaction',angle:'油炸/主食偏多→胀气',triggers:['油炸','主食偏多'],outcome:'胀气',
      evidence:{sampleSize:bloatedOil.length,hitRate:hitRate,lastObservedAt:last&&last.ts?new Date(last.ts).toISOString():now,sourceRefs:refs},
      maturity:maturityLevel(bloatedOil.length,hitRate),confidence:Math.min(0.3+hitRate*0.7,1),requires:[1],computedAt:now});
  }

  // ── reaction.drowsy: 午饭 && tags 含高碳水 && comfort 含困倦 ──
  const lunchHighCarb=withFb.filter(m=>m.type==='午饭'&&(m.analysis&&m.analysis.tags||[]).some(t=>t.includes('高碳')||t.includes('主食偏多')||t.includes('碳水')));
  const drowsyLunch=lunchHighCarb.filter(m=>comfortIncludes(m.fb,'困倦'));
  if(lunchHighCarb.length>0){
    const hitRate=drowsyLunch.length/lunchHighCarb.length;
    const refs=drowsyLunch.map(m=>String(m.id));
    const last=drowsyLunch.slice().sort(function(a,b){return b.ts-a.ts;})[0];
    results.push({id:stableId('reaction-drowsy-highcarb-lunch'),category:'reaction',angle:'午饭高碳水→困倦',triggers:['午饭','高碳水'],outcome:'困倦',
      evidence:{sampleSize:drowsyLunch.length,hitRate:hitRate,lastObservedAt:last&&last.ts?new Date(last.ts).toISOString():now,sourceRefs:refs},
      maturity:maturityLevel(drowsyLunch.length,hitRate),confidence:Math.min(0.3+hitRate*0.7,1),requires:[1],computedAt:now});
  }

  // ── reaction: 深夜进食→不适（late_night_eating_reaction）──
  const lateNightMeals = withFb.filter(function(m){
    const h=new Date(m.ts||0).getHours();
    return (h>=21||h<5)&&m.type&&(['加餐','晚饭','晚餐'].some(function(t){return m.type.includes(t);}));
  });
  if(lateNightMeals.length>0){
    const badLate=lateNightMeals.filter(function(m){return comfortIncludes(m.fb,'困倦','胀气');});
    const hitRate=badLate.length/lateNightMeals.length;
    const mat=maturityLevel(lateNightMeals.length,hitRate);
    const refs=badLate.map(function(m){return String(m.id);});
    const lastLate=lateNightMeals.slice().sort(function(a,b){return b.ts-a.ts;})[0];
    results.push({id:'late_night_eating_reaction',category:'reaction',angle:'深夜进食→不适',triggers:['深夜','加餐','晚饭'],outcome:'late_night_discomfort',
      evidence:{sampleSize:lateNightMeals.length,hitRate:hitRate,lastObservedAt:lastLate&&lastLate.ts?new Date(lastLate.ts).toISOString():now,sourceRefs:refs},
      maturity:mat,confidence:hitRate,requires:['phase_1'],computedAt:now});
  }

  // ── 修 1：goal_alignment（声明 vs 行为差异）──
  // 当用户声明了 goal，但行为洞察显示该 goal 未达成时，触发"声明与行为偏离"提示
  if(_profile && _profile.goal){
    const goal = _profile.goal;
    // 例：goal='下午不困' 但 reaction.drowsy 已 mature
    if(goal.includes('困') || goal.includes('精神') || goal.includes('能量')){
      const drowsyIns = results.find(i=>i.category==='reaction' && i.outcome==='困倦' && (i.maturity==='mature'||i.maturity==='forming'));
      if(drowsyIns){
        results.push({id:stableId('goal-misalign-drowsy'),category:'goal_alignment',angle:'声明"'+goal+'"，但午饭高碳水→困倦规律已识别',triggers:[goal],target:goal,outcome:'goal_misalignment',
          evidence:{sampleSize:drowsyIns.evidence.sampleSize,hitRate:drowsyIns.evidence.hitRate,lastObservedAt:drowsyIns.evidence.lastObservedAt,sourceRefs:drowsyIns.evidence.sourceRefs.slice()},
          maturity:drowsyIns.maturity,confidence:drowsyIns.confidence,requires:[1],computedAt:now});
      }
    }
    // 例：goal='消化更好' 但 reaction.bloated 已 mature
    if(goal.includes('消化') || goal.includes('胀气')){
      const bloatIns = results.find(i=>i.category==='reaction' && i.outcome==='胀气' && (i.maturity==='mature'||i.maturity==='forming'));
      if(bloatIns){
        results.push({id:stableId('goal-misalign-bloated'),category:'goal_alignment',angle:'声明"'+goal+'"，但油炸/主食偏多→胀气规律已识别',triggers:[goal],target:goal,outcome:'goal_misalignment',
          evidence:{sampleSize:bloatIns.evidence.sampleSize,hitRate:bloatIns.evidence.hitRate,lastObservedAt:bloatIns.evidence.lastObservedAt,sourceRefs:bloatIns.evidence.sourceRefs.slice()},
          maturity:bloatIns.maturity,confidence:bloatIns.confidence,requires:[1],computedAt:now});
      }
    }
  }

  // ── 修 3：daily_checkins → next_day_reaction（次日延迟反应）──
  // 把昨日晚饭/晚餐的特征与今日 checkin 的 energy='low' 关联
  if(_checkins && _checkins.length > 0){
    const lowEnergyCheckins = _checkins.filter(c=>c.energy==='low' && c.date);
    const heavyDinners = withFb.filter(m=>{
      if(!m.ts) return false;
      const h = new Date(m.ts).getHours();
      const isDinner = m.type && (m.type.includes('晚饭')||m.type.includes('晚餐'));
      const heavy = (m.analysis?.tags||[]).some(t=>t.includes('高碳')||t.includes('主食偏多')||t.includes('油炸')||t.includes('重油'));
      return isDinner && heavy && h >= 17;
    });
    // 匹配：晚饭次日的 checkin
    const matched = heavyDinners.filter(m=>{
      const mealDate = new Date(m.ts);
      const nextDay = new Date(mealDate.getFullYear(), mealDate.getMonth(), mealDate.getDate()+1);
      const nextDateStr = nextDay.toISOString().split('T')[0];
      return lowEnergyCheckins.some(c=>c.date===nextDateStr);
    });
    if(heavyDinners.length >= 2){
      const hitRate = matched.length / heavyDinners.length;
      const mat = maturityLevel(heavyDinners.length, hitRate);
      if(mat !== 'sparse' || matched.length > 0){
        const refs = matched.map(m=>String(m.id));
        const last = matched.slice().sort((a,b)=>b.ts-a.ts)[0];
        results.push({id:stableId('reaction-next-day-low-energy'),category:'reaction',angle:'重晚饭→次日能量低',triggers:['晚饭','高碳水/油炸'],outcome:'next_day_low_energy',
          evidence:{sampleSize:heavyDinners.length,hitRate:hitRate,lastObservedAt:last&&last.ts?new Date(last.ts).toISOString():now,sourceRefs:refs},
          maturity:mat,confidence:Math.min(0.3+hitRate*0.7,1),requires:[1],computedAt:now});
      }
    }
  }

  // ── 修 4：card_actions → preference 强化信号 ──
  // 用户翻卡选择 picked vs skipped 是强偏好信号（"用脚投票"）
  if(_cardActions && _cardActions.length > 0){
    const picked = _cardActions.filter(a=>a.action==='picked' && a.cuisine);
    const cuisinePickFreq = {};
    picked.forEach(a=>{
      if(a.cuisine && a.cuisine!=='家常菜' && a.cuisine!=='全国'){
        cuisinePickFreq[a.cuisine] = (cuisinePickFreq[a.cuisine]||0) + 1;
      }
    });
    Object.entries(cuisinePickFreq).forEach(entry=>{
      const cuisine = entry[0], pickCount = entry[1];
      if(pickCount < 2) return;
      // 找出已有 preference insight，强化（标注 cardActionsBoost）；若无则新增弱 preference
      const existing = results.find(i=>i.category==='preference' && i.target===cuisine);
      const refs = picked.filter(a=>a.cuisine===cuisine).map(a=>String(a.mealId||a.id||cuisine));
      if(existing){
        existing.evidence.cardPickedCount = pickCount;
        existing.confidence = Math.min(existing.confidence + 0.1, 1);
        existing.angle = existing.angle + '（含 '+pickCount+' 次主动选择）';
      } else {
        const mat = maturityLevel(pickCount, 1.0);
        results.push({id:stableId('preference-cardpick-'+cuisine),category:'preference',angle:'抽卡偏好-'+cuisine+'（'+pickCount+' 次主动选择）',triggers:[cuisine],target:cuisine,
          evidence:{sampleSize:pickCount,hitRate:1.0,lastObservedAt:now,sourceRefs:refs,cardPickedCount:pickCount},
          maturity:mat,confidence:Math.min(0.5+pickCount*0.1,0.9),requires:[1],computedAt:now});
      }
    });
  }

  // ── diet_structure_type: 干饭风格归纳（L2 → 档案页 L3 消费）──
  // 基于近期餐次营养结构分布，归纳用户饮食风格；冷启动 <5 餐不输出
  const analyzedMeals = meals.filter(function(m){ return m.analysis; });
  if(analyzedMeals.length >= 5){
    const an = analyzedMeals.length;
    function lvCount(field, val){ return analyzedMeals.filter(function(m){ return m.analysis[field]===val; }).length; }
    const proteinHigh  = lvCount('proteinLevel','high') / an;
    const proteinLow   = lvCount('proteinLevel','low')  / an;
    const veggieHigh   = lvCount('vegetableFiberLevel','high') / an;
    const veggieLow    = lvCount('vegetableFiberLevel','low')  / an;
    const stapleHigh   = lvCount('stapleLevel','high') / an;
    const oilHeavy     = (lvCount('oilLevel','heavy') + lvCount('oilLevel','medium')) / an;
    const oilLight     = lvCount('oilLevel','light') / an;
    let styleTarget = '均衡派'; let styleEmoji = '⚖️';
    if(proteinHigh >= 0.5 && veggieLow >= 0.3)          { styleTarget='肉食星人'; styleEmoji='🥩'; }
    else if(veggieHigh >= 0.5 && proteinLow >= 0.3)     { styleTarget='素食星人'; styleEmoji='🥦'; }
    else if(stapleHigh >= 0.55)                          { styleTarget='碳水星人'; styleEmoji='🍚'; }
    else if(oilHeavy >= 0.6)                             { styleTarget='重口派';   styleEmoji='🌶️'; }
    else if(oilLight >= 0.6 && veggieHigh >= 0.3)       { styleTarget='清爽派';   styleEmoji='🥗'; }
    const dsMat = an >= 10 ? 'mature' : 'forming';
    const dsRefs = analyzedMeals.slice(-10).map(function(m){ return String(m.id); });
    const dsLast = analyzedMeals.slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); })[0];
    results.push({id:stableId('diet_structure_type'),category:'preference',angle:'diet_structure_type',
      triggers:['饮食结构'],target:styleTarget,emoji:styleEmoji,
      evidence:{sampleSize:an,hitRate:1.0,lastObservedAt:dsLast&&dsLast.ts?new Date(dsLast.ts).toISOString():now,sourceRefs:dsRefs},
      maturity:dsMat,confidence:Math.min(0.4+an*0.04,0.9),requires:[1],computedAt:now});
  }

  return results;
}

// 把 Insight 结构转换为 findBodyMirrorInsight 所需的展示对象
function insightToBodyMirror(insight, allMeals){
  if(!insight) return null;
  const n=insight.evidence.sampleSize;
  const last=(allMeals||[]).filter(m=>insight.evidence.sourceRefs.includes(String(m.id))).sort((a,b)=>b.ts-a.ts)[0];
  if(insight.category==='reaction'&&insight.outcome==='困倦'){
    const tag=insight.triggers.find(t=>t!=='午饭')||insight.triggers[0]||'高碳水';
    return {type:'pattern_sleepy',emoji:'😴',color:'var(--amber)',colorSoft:'var(--amber-s)',
      headline:`你${insight.triggers.includes('午饭')?'午饭吃高碳水，':'每次吃「'+tag+'」的东西，'}下午都会困`,
      body:`${last&&last.dish||'这类食物'}之后你感觉困倦，已经出现 ${n} 次了。不是意志力的问题，是你的身体就是这样反应的。`,
      action:`下次试试${tag.includes('高碳')||tag.includes('主食')?'主食减半':'蛋白质更足的'}版本，看看下午会不会不一样。`};
  }
  if(insight.category==='reaction'&&insight.outcome==='胀气'){
    const tag=insight.triggers[0]||'油炸食物';
    return {type:'pattern_bloated',emoji:'😮‍💨',color:'var(--amber)',colorSoft:'var(--amber-s)',
      headline:`「${tag}」容易让你胀气`,
      body:`你吃完${tag}相关的餐后感觉胀气，已经出现 ${n} 次了。这是你身体在给你反馈。`,
      action:`下次试试换成蒸或煮的，看看胀气会不会减少。`};
  }
  if(insight.category==='preference'){
    const cuisine=insight.target||insight.triggers[0]||'这类菜';
    return {type:'pattern_great',emoji:'⚡',color:'var(--green)',colorSoft:'var(--green-s)',
      headline:`「${cuisine}」的餐，每次都让你状态很好`,
      body:`${last&&last.dish||cuisine}之后你总是满足，共出现了 ${n} 次。这是你身体喜欢的方向。`,
      action:`把这个菜系作为你的基准线——不知道吃什么的时候，往这个方向选就对了。`};
  }
  if(insight.category==='avoid'){
    const cuisine=insight.target||insight.triggers[0]||'这类菜';
    return {type:'pattern_avoid',emoji:'⚠️',color:'var(--amber)',colorSoft:'var(--amber-s)',
      headline:`「${cuisine}」对你来说不太合适`,
      body:`你吃完${cuisine}后多次感觉不满意，已出现 ${n} 次。`,
      action:`考虑减少${cuisine}的频率，换换其他你更满意的选择。`};
  }
  return null;
}

// ── 身体镜子引擎 ──────────────────────────────────────────────────────────────
// 核心：从用户数据里找第一个真实规律，用一句话说出来

function findBodyMirrorInsight(){
  if(meals.length < 2) return null;
  // 读 deriveInsights 引擎，优先取 mature，其次 forming，按 confidence 排序
  const insights = deriveInsights(meals, 1);
  const candidates = insights
    .filter(i=>i.maturity==='mature'||i.maturity==='forming')
    .sort((a,b)=>b.confidence-a.confidence);
  if(!candidates.length) return null;
  return insightToBodyMirror(candidates[0], meals);
}

// ── 拼图块解锁检测 ───────────────────────────────────────────────────────────
// 返回给定 meals 数组中已解锁的拼图块 key 集合（用于比对前后状态）
function getUnlockedPuzzleBlockKeys(mealsArr){
  const result = new Set();
  // ── 修 2：块 0 / 块 1 改走 deriveInsights（消除孤立算法）──
  // 引擎幂等，从 mealsArr 重算 insights[]
  const _ins = (typeof deriveInsights === 'function') ? deriveInsights(mealsArr, 1) : [];
  // 块0：喜欢吃这个 — 至少 1 条 preference 类洞察（forming 或 mature）
  if(_ins.some(i => i.category === 'preference' && (i.maturity === 'forming' || i.maturity === 'mature'))) {
    result.add('block_0');
  } else {
    // 降级：洞察未形成时，按原"至少 1 次好评"判定（不破坏冷启动用户体验）
    const good = mealsArr.filter(m => m.fb && comfortHas(m.fb.comfort, '舒服', '有精神'));
    if(good.length >= 1) result.add('block_0');
  }
  // 块1：我的吃法 — 至少 1 条 reaction 类洞察（forming 或 mature）
  if(_ins.some(i => i.category === 'reaction' && (i.maturity === 'forming' || i.maturity === 'mature'))) {
    result.add('block_1');
  } else {
    // 降级：洞察未形成时，按原"好评餐含 tags"判定
    const good = mealsArr.filter(m => m.fb && comfortHas(m.fb.comfort, '舒服', '有精神'));
    if(good.some(m => (m.analysis?.tags||[]).length > 0)) result.add('block_1');
  }
  // 块2：口味探索 — 至少 2 种菜系（事实统计，性质与洞察不同，保留原算法）
  const cuisines = new Set(mealsArr.filter(m => m.fb && m.cuisine && m.cuisine !== '家常菜' && m.cuisine !== '全国').map(m => m.cuisine));
  if(cuisines.size >= 2) result.add('block_2');
  // 块3：越来越舒服 — 达到 10 餐（时序趋势，性质与洞察不同，保留原算法）
  if(mealsArr.length >= 10) result.add('block_3');
  return result;
}

// 对比提交前后解锁状态，返回第一个新解锁的 block key；无则返回 null
function detectNewlyUnlockedPuzzleBlock(currentMeals, prevMeals){
  const prevKeys = getUnlockedPuzzleBlockKeys(prevMeals || []);
  const currentKeys = getUnlockedPuzzleBlockKeys(currentMeals);
  for(const key of currentKeys){
    if(!prevKeys.has(key)) return key;
  }
  return null;
}

// 身体拼图首次解锁庆祝弹窗（一次性，由 localStorage 控制去重）
function showPuzzleUnlockCelebration(blockKey){
  const INFO = {
    block_0: { label:'喜欢吃这个', emoji:'😋', color:'var(--green)', desc:'第一块拼图解锁了！你开始发现自己真正喜欢什么。' },
    block_1: { label:'我的吃法',   emoji:'🥢', color:'var(--accent)', desc:'你的吃法拼图解锁了！最适合你的饮食方式正在浮现。' },
    block_2: { label:'口味探索',   emoji:'🗺️', color:'var(--amber)',  desc:'口味探索拼图解锁了！你已经踏上了新菜系的旅程。' },
    block_3: { label:'越来越舒服', emoji:'✨', color:'var(--green)', desc:'趋势拼图解锁了！你的身体正在告诉你方向。' },
  };
  const info = INFO[blockKey] || { label:'新拼图', emoji:'🧩', color:'var(--green)', desc:'新的身体拼图解锁了！' };

        <p style="font-size:14px;color:var(--ink60);line-height:1.6">${info.desc}</p>
      </div>
      <div style="display:flex;gap:10px">
        <button onclick="this.closest('[style*=fixed]').remove()" style="flex:1;padding:13px;border:1.5px solid var(--border);border-radius:100px;background:transparent;color:var(--ink60);font-family:var(--sans);font-size:14px;cursor:pointer">稍后看</button>

      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

const CHINA_MAP_VIEWBOX = {w:400,h:340,pad:18};
let cachedChinaMap = null;

function decodeChinaGeoJson(source){
  const geo=JSON.parse(JSON.stringify(source||{type:'FeatureCollection',features:[]}));
  if(geo.UTF8Encoding===false) return geo;
  const scale=geo.UTF8Scale||1024;
  function decodePolygon(coordinate, encodeOffsets){
    const result=[];
    let prevX=encodeOffsets[0];
    let prevY=encodeOffsets[1];
    for(let i=0;i<coordinate.length;i+=2){
      let x=coordinate.charCodeAt(i)-64;
      let y=coordinate.charCodeAt(i+1)-64;
      x=(x>>1)^(-(x&1));
      y=(y>>1)^(-(y&1));
      x+=prevX;
      y+=prevY;
      prevX=x;
      prevY=y;
      result.push([x/scale,y/scale]);
    }
    return result;
  }
  (geo.features||[]).forEach(feature=>{
    const geometry=feature.geometry||{};
    const coordinates=geometry.coordinates||[];
    const encodeOffsets=geometry.encodeOffsets||[];
    if(geometry.type==='Polygon'){
      geometry.coordinates=coordinates.map((ring,idx)=>decodePolygon(ring,encodeOffsets[idx]));
    }else if(geometry.type==='MultiPolygon'){
      geometry.coordinates=coordinates.map((polygon,pIdx)=>
        polygon.map((ring,rIdx)=>decodePolygon(ring,encodeOffsets[pIdx][rIdx]))
      );
    }
    geometry.encodeOffsets=null;
  });
  geo.UTF8Encoding=false;
  return geo;
}

function getChinaMapFeatures(){
  if(cachedChinaMap) return cachedChinaMap;
  const source=window.CHINA_ECHARTS_GEOJSON;
  const decoded=decodeChinaGeoJson(source);
  const features=(decoded.features||[]).filter(f=>f?.properties?.name&&f.properties.name!=='南海诸岛');
  const points=[];
  features.forEach(feature=>walkGeoCoords(feature.geometry,pt=>points.push(pt)));
  const bounds=points.reduce((acc,[lon,lat])=>({
    minLon:Math.min(acc.minLon,lon),
    maxLon:Math.max(acc.maxLon,lon),
    minLat:Math.min(acc.minLat,lat),
    maxLat:Math.max(acc.maxLat,lat)
  }),{minLon:Infinity,maxLon:-Infinity,minLat:Infinity,maxLat:-Infinity});
  cachedChinaMap={features,bounds};
  return cachedChinaMap;
}

function walkGeoCoords(geometry,visitor){
  if(!geometry) return;
  const coords=geometry.coordinates||[];
  if(geometry.type==='Polygon'){
    coords.forEach(ring=>ring.forEach(visitor));
  }else if(geometry.type==='MultiPolygon'){
    coords.forEach(polygon=>polygon.forEach(ring=>ring.forEach(visitor)));
  }
}

function projectChinaPoint(point,bounds){
  const {w,h,pad}=CHINA_MAP_VIEWBOX;
  const x=pad+((point[0]-bounds.minLon)/(bounds.maxLon-bounds.minLon))*(w-pad*2);
  const y=pad+((bounds.maxLat-point[1])/(bounds.maxLat-bounds.minLat))*(h-pad*2);
  return [x,y];
}

function ringToPath(ring,bounds){
  if(!ring?.length) return '';
  return ring.map((pt,idx)=>{
    const [x,y]=projectChinaPoint(pt,bounds);
    return `${idx?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ')+' Z';
}

function featureToPath(feature,bounds){
  const geometry=feature.geometry||{};
  if(geometry.type==='Polygon'){
    return geometry.coordinates.map(ring=>ringToPath(ring,bounds)).join(' ');
  }
  if(geometry.type==='MultiPolygon'){
    return geometry.coordinates.map(polygon=>polygon.map(ring=>ringToPath(ring,bounds)).join(' ')).join(' ');
  }
  return '';
}

function provinceMeta(id){
  return PROVINCES.find(p=>p.id===id);
}

// ── 饮食日历视图 ───────────────────────────────────────────────────────────────
function getCalendarMealDate(m,index,year,month,daysInMonth){
  const ts=mealTs(m);
  if(ts&&ts>Date.now()-366*86400000) return new Date(ts);
  const today=new Date();
  const baseDay=year===today.getFullYear()&&month===today.getMonth()?today.getDate():Math.min(15,daysInMonth);
  return new Date(year,month,Math.min(daysInMonth,Math.max(1,baseDay-4+index)));
}

function buildCalendarMealsByDay(sourceMeals,year,month,daysInMonth){
  const groups={};
  sourceMeals.forEach((m,i)=>{
    const d=getCalendarMealDate(m,i,year,month,daysInMonth);
    if(d.getFullYear()===year&&d.getMonth()===month){
      const day=d.getDate();
      if(!groups[day]) groups[day]=[];
      groups[day].push(m);
    }
  });
  return groups;
}

function calendarAvailableMonths(year){
  const now=new Date();
  const months=new Set();
  meals.forEach((m,i)=>{
    const ts=mealTs(m);
    const d=ts&&ts>Date.now()-366*86400000
      ? new Date(ts)
      : new Date(now.getFullYear(),now.getMonth(),Math.min(28,now.getDate()-4+i));
    if(d.getFullYear()===year) months.add(d.getMonth());
  });
  if(!months.size&&year===now.getFullYear()) months.add(now.getMonth());
  if(!months.size) months.add(0);
  return Array.from(months).sort((a,b)=>a-b);
}

function calendarFilteredMeals(){
  if(calendarMealFilter==='全部') return meals;
  return meals.filter(m=>m.type===calendarMealFilter);
}

function getDayFeedbackStatus(dayMeals){
  if(!dayMeals.length) return {key:'empty',label:'无记录',bg:'transparent',border:'transparent',text:'var(--ink30)'};
  const feedbackMeals=dayMeals.filter(m=>m.fb);
  if(!feedbackMeals.length) return {key:'recorded',label:'已记录',bg:'var(--cream)',border:'transparent',text:'var(--ink60)'};
  const negative=['困倦','胀气','反酸','口渴','撑','很撑','不舒服','难受','恶心'];
  const positive=['有精神','舒服','轻松','满足','不困','稳定'];
  let score=0;
  let strongNegative=false;
  feedbackMeals.forEach(m=>{
    const comfort=m.fb?.comfort||'';
    if(negative.some(k=>comfort.includes(k))){score-=1;strongNegative=true;}
    else if(positive.some(k=>comfort.includes(k))) score+=1;
  });
  if(strongNegative||score<0) return {key:'bad',label:'不适',bg:'var(--red-s)',border:'rgba(198,54,45,.32)',text:'var(--red)'};
  if(score>0) return {key:'good',label:'良好',bg:'var(--green-s)',border:'rgba(44,107,76,.26)',text:'var(--green)'};
  return {key:'neutral',label:'一般',bg:'#fff4df',border:'rgba(211,139,43,.24)',text:'var(--amber)'};
}

    </div>`;

  const availableMonths=calendarAvailableMonths(year);

    calendarMonth=availableMonths[0];

  const pickerHtml=calendarPickerOpen?`
    <div style="background:var(--white);border:1px solid var(--border);border-radius:16px;padding:12px;margin:0 0 12px">

      </div>
      <div style="display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px">
        ${availableMonths.map(i=>`<button onclick="setCalendarDate('month',${i})" style="flex-shrink:0;border:none;background:transparent;color:${month===i?'var(--accent)':'var(--ink)'};font-family:var(--sans);font-weight:800;font-size:13px;padding:4px 0">${i+1}月</button>`).join('')}

    </div>`:'';

  // ── 饮食记录沉淀 + 我的一周合并卡片 ──────────────────────────
  const _rNow=new Date();
  const _rDay=_rNow.getDay(); const _rH=_rNow.getHours();
  const _isSunEvening=(_rDay===0&&_rH>=19);
  const _showWeekly=_isSunEvening||meals.filter(m=>m.ts&&Date.now()-m.ts<14*86400000).length>=5;

  <div style="position:relative;margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <button onclick="toggleCalendarPicker()" style="border:none;background:transparent;padding:0;font-family:var(--serif);font-size:20px;color:var(--ink);cursor:pointer">${year}年${month+1}月</button>
      <button onclick="toggleCalendarMealFilter()" style="border:none;border-radius:999px;padding:8px 12px;background:${calendarFilterOpen?'var(--accent-s)':'var(--cream)'};color:${calendarFilterOpen||filterHasValue?'var(--accent)':'var(--ink)'};font-family:var(--sans);font-size:12px;font-weight:800;cursor:pointer">${calendarMealFilter} ${calendarFilterOpen?'▲':'▼'}</button>
    </div>
    ${calendarFilterOpen?`<div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap">
      ${mealFilterOptions.map(opt=>`<button onclick="setCalendarMealFilter('${opt}')" style="border:${calendarMealFilter===opt?'none':'1px solid var(--border)'};border-radius:999px;padding:7px 11px;background:${calendarMealFilter===opt?'var(--accent)':'var(--white)'};color:${calendarMealFilter===opt?'#fff':'var(--ink60)'};font-family:var(--sans);font-size:12px;font-weight:800;cursor:pointer">${opt}</button>`).join('')}
      <button onclick="resetCalendarMealFilter()" style="border:1px solid var(--border);border-radius:999px;padding:7px 11px;background:var(--cream);color:var(--ink60);font-family:var(--sans);font-size:12px;font-weight:800;cursor:pointer">重置</button>
    </div>`:''}

        <p style="font-size:12px;color:var(--ink60);margin-top:6px">记录天数</p>
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
          ${weekRow}${cells}

  </div>
  <div id="day-detail">
    ${renderDayMeals(calendarSelectedDay, mealsByDay[calendarSelectedDay]||[], allMealsByDay[calendarSelectedDay]||[])}
  </div>`;

  window.toggleCalendarMealFilter=function(){
    calendarFilterOpen=!calendarFilterOpen;
    calendarPickerOpen=false;
    renderHistoryContent();
  };
  window.setCalendarMealFilter=function(t){
    calendarMealFilter=calendarMealFilter===t?'全部':t;
    calendarFilterOpen=false;
    historyTargetMealId=null;
    renderHistoryContent();
  };
  window.resetCalendarMealFilter=function(){
    calendarMealFilter='全部';
    calendarFilterOpen=false;
    historyTargetMealId=null;
    renderHistoryContent();
  };
  window.toggleCalendarPicker=function(){

    calendarFilterOpen=false;
    renderHistoryContent();

function renderDayMeals(day, list, totalList){

    ? `${day}日 · ${hasFilter?`${list.length} / ${total}`:total} 餐记录`
    : `${day}日 暂无记录`;
  if(!list.length) return `<div class="label">${title}</div><p style="text-align:center;color:var(--ink30);font-size:13px;padding:20px 0">${hasFilter&&total?'当前餐次筛选下暂无记录':'暂无记录'}</p>`;
  const items=list.map(m=>{
    const isTarget=historyTargetMealId&&String(m.id)===String(historyTargetMealId);
    const imgEl=m.wideImg
      ?`<img src="${m.wideImg}" style="width:60px;height:60px;object-fit:cover;border-radius:10px;flex-shrink:0">`
      :`<div style="width:60px;height:60px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0">${ava(m.analysis?.risk)}</div>`;
    const noFb=!m.fb;
    const feelColor=comfortHas(m.fb?.comfort,'有精神','舒服')?'var(--green)':comfortHas(m.fb?.comfort,'困倦','胀气')?'var(--red)':'var(--amber)';
    return `<div data-meal-id="${m.id}" style="display:flex;gap:12px;align-items:center;padding:12px ${isTarget?'10px':'0'};border-bottom:1px solid var(--border);cursor:pointer;background:${isTarget?'var(--red-s)':'transparent'};border-radius:${isTarget?'12px':'0'};margin:${isTarget?'6px -4px':'0'}" onclick="showMealDetail(${m.id})">
      <div style="position:relative;flex-shrink:0">
        ${imgEl}
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <p style="font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.dish||'这一餐'}${isTarget?' · 已定位':''}</p>
          ${noFb
            ? `<button onclick="event.stopPropagation();backfillFeedback(${m.id})" style="flex-shrink:0;border:1.5px solid var(--accent);background:var(--accent-s);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">补录反馈</button>`
            : `<span style="font-size:11px;color:${feelColor};font-weight:600;flex-shrink:0">${feelEmoji(m.fb.comfort)} ${comfortText(m.fb.comfort)}</span>`}
        </div>
        <p style="font-size:12px;color:var(--ink60);margin-top:2px">${m.type} · ${m.cuisine||'家常菜'}</p>
        <p style="font-size:12px;color:var(--ink30);margin-top:2px">${m.analysis?.structure||''}</p>
      </div>
    </div>`;
  }).join('');
  return `<div class="label">${title}</div><div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:0 16px">${items}</div>`;
}

// ── 菜系地图视图 ───────────────────────────────────────────────────────────────

      unlocked[m.province].meals.push(m);

  const chinaMap=getChinaMapFeatures();
  const total=chinaMap.features.length || PROVINCES.filter(p=>p.id!=='全国'&&p.id!=='境外').length;
  const unlockedCount=Object.keys(unlocked).length;
  const unlockedEntries=Object.entries(unlocked);

  const mapPaths=chinaMap.features.map(feature=>{
    const name=feature.properties.name;
    const isUnlocked=unlocked[name];

    if(kind==='allTime'){
      cuisineMapYearFilter='全部年份';
      cuisineMapMonthFilter='全部月份';

    }
    if(kind==='year'){
      cuisineMapYearFilter=cuisineMapYearFilter===value?'全部年份':value;
      cuisineMapMonthFilter='全部月份';
    }
    if(kind==='month') cuisineMapMonthFilter=cuisineMapMonthFilter===value?'全部月份':value;
    if(kind==='type') cuisineMapMealTypeFilter=cuisineMapMealTypeFilter===value?'全部餐次':value;
    if(cuisineMapSelectedProvince) showCuisineTimeline(cuisineMapSelectedProvince);

    const months=Array.from(new Set(monthSource.map(m=>String(new Date(m.ts||Date.now()).getMonth()+1)))).sort((a,b)=>Number(a)-Number(b));
    if(cuisineMapMonthFilter!=='全部月份'&&!months.includes(cuisineMapMonthFilter)) cuisineMapMonthFilter='全部月份';
    const typeOptions=['全部餐次','早饭','午饭','晚饭','加餐'];
    if(!typeOptions.includes(cuisineMapMealTypeFilter)) cuisineMapMealTypeFilter='全部餐次';
    const timeTabLabel=cuisineMapYearFilter==='全部年份'
      ?'全部时间'
      :(cuisineMapMonthFilter==='全部月份'?`${cuisineMapYearFilter}年`:`${cuisineMapYearFilter}年${cuisineMapMonthFilter}月`);
    const filtered=data.meals
      .filter(m=>cuisineMapYearFilter==='全部年份'||String(new Date(m.ts||Date.now()).getFullYear())===cuisineMapYearFilter)
      .filter(m=>cuisineMapMonthFilter==='全部月份'||String(new Date(m.ts||Date.now()).getMonth()+1)===cuisineMapMonthFilter)
      .filter(m=>cuisineMapMealTypeFilter==='全部餐次'||m.type===cuisineMapMealTypeFilter)
      .sort((a,b)=>(b.ts||0)-(a.ts||0));
    const hasActiveFilter=cuisineMapYearFilter!=='全部年份'||cuisineMapMonthFilter!=='全部月份'||cuisineMapMealTypeFilter!=='全部餐次';
    const countText=hasActiveFilter?`${filtered.length} / ${data.count} 餐记录`:`${data.count} 餐记录`;
    const timelineItems=filtered.map(m=>{
      const dt=new Date(m.ts||Date.now());
      const dateText=`${dt.getMonth()+1}月${dt.getDate()}日`;
      const timeText=`${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;

          <p style="font-size:14px;font-weight:700;color:var(--ink);line-height:1.35">${m.dish||'这一餐'}</p>
          <p style="font-size:12px;color:var(--ink60);margin-top:5px">${m.type} · ${m.cuisine||data.cuisine} · ${comfort}</p>
          ${m.analysis?.structure?`<p style="font-size:12px;color:var(--ink60);margin-top:7px;line-height:1.5">${m.analysis.structure}</p>`:''}
        </div>
      </div>`;
    }).join('');
    const panel=document.getElementById('cuisine-map-record-panel');
    if(panel) panel.innerHTML=`
      <div style="padding:14px 0 10px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <div style="width:42px;height:42px;border-radius:12px;background:var(--accent-s);display:flex;align-items:center;justify-content:center;font-size:22px">${prov?.emoji||'🍽️'}</div>

// ── ##026 身体拼图统一算法入口（deriveInsights 子集 getter）────────────────────
function getInsightsForPreferenceBlock(mealsArr){
  return deriveInsights(mealsArr,1).filter(function(i){return i.category==='preference';});
}
function getInsightsForReactionBlock(mealsArr){
  return deriveInsights(mealsArr,1).filter(function(i){return i.category==='reaction';});
}
function computeCuisineExploration(mealsArr){
  var sortedByTs=mealsArr.filter(function(m){return !!m.ts;}).sort(function(a,b){return a.ts-b.ts;});
  function _fmtD(ts){var d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
  var res={};
  sortedByTs.forEach(function(m){
    if(!m.cuisine||m.cuisine==='家常菜'||m.cuisine==='全国') return;
    if(!res[m.cuisine]) res[m.cuisine]={cuisine:m.cuisine,firstDate:_fmtD(m.ts),count:0,good:0};
    res[m.cuisine].count++;
    if(m.fb&&comfortHas(m.fb.comfort,'舒服','有精神')) res[m.cuisine].good++;
  });
  return Object.values(res);
}
function computeComfortTrend(mealsArr){
  // ── 修 5：周报月度舒服率与 deriveInsights 同源 ──
  // 月度趋势本质是时序统计（fact），不是 pattern（insight）
  // 但它读取的数据源（m.fb.comfort）与 deriveInsights reaction 类完全同源
  // 此函数明确为"派生统计"，与引擎共享数据真相，避免被误认为孤立算法
  // 同时附带 insight 计数摘要（mature 数 / forming 数），供周报"我的一周"卡使用
  var mo={};
  mealsArr.forEach(function(m){
    if(!m.ts) return;
    var dd=new Date(m.ts);
    var key=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0');
    var label=(dd.getMonth()+1)+'月';
    if(!mo[key]) mo[key]={label:label,good:0,total:0};
    mo[key].total++;
    if(m.fb&&comfortHas(m.fb.comfort,'舒服','有精神')) mo[key].good++;
  });
  var monthly=Object.entries(mo).sort(function(a,b){return a[0].localeCompare(b[0]);})
    .map(function(e){var v=e[1];return {label:v.label,good:v.good,total:v.total,rate:Math.round(v.good/v.total*100)};});
  var improving=monthly.length>=2&&monthly[monthly.length-1].rate>monthly[0].rate+5;
  // insights 计数（修 5 关键：周报展示"已稳定规律 N 条"等可消费的引擎输出）
  var insSummary = {mature:0,forming:0,byCategory:{preference:0,avoid:0,reaction:0,goal_alignment:0}};
  if(typeof deriveInsights === 'function'){
    var allIns = deriveInsights(mealsArr, 1);
    allIns.forEach(function(i){
      if(i.maturity==='mature') insSummary.mature++;
      if(i.maturity==='forming') insSummary.forming++;
      if(insSummary.byCategory[i.category]!==undefined) insSummary.byCategory[i.category]++;
    });
  }
  return {monthly:monthly,improving:improving,insights:insSummary};
}
// computeInsights — DEPRECATED: 孤岛算法，已被 deriveInsights getters 替代，保留函数体防止连带

function computeInsights(){
  const good = meals.filter(m=>comfortHas(m.fb?.comfort,'舒服','有精神'));
  const bad  = meals.filter(m=>comfortHas(m.fb?.comfort,'困倦','胀气'));
  const overfull = meals.filter(m=>m.fb?.fullness==='撑');
  const regret = meals.filter(m=>m.fb?.mood==='后悔');

  // 最舒服的餐：取好评餐里出现的菜品/结构
  const bestMeals = good.slice(-3).map(m=>`${m.dish||m.analysis.structure.split('，')[0]}（${m.date}${m.type}）`);

  // 最容易困：找差评且有困倦的餐，找共同标签
  const sleepyMeals = bad.filter(m=>comfortHas(m.fb?.comfort,'困倦'));
  let sleepyStr = '暂无足够数据';
  if(sleepyMeals.length>=1){
    const tags = sleepyMeals.flatMap(m=>m.analysis?.tags||[]);
    const freq = {};tags.forEach(t=>freq[t]=(freq[t]||0)+1);
    const topTag = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
    const ex = sleepyMeals[sleepyMeals.length-1];
    sleepyStr = topTag
      ? `${ex.dish||'高油高碳的餐'} → 饭后困倦，共出现 ${sleepyMeals.length} 次，多和「${topTag[0]}」有关`
      : `${ex.dish||'重口味的餐'} → 饭后困倦，共出现 ${sleepyMeals.length} 次`;
  }

  // 最容易撑：场景分析
  let overfullStr = '暂无足够数据';
  if(overfull.length>=1){
    const types = overfull.map(m=>m.type);
    const freq = {};types.forEach(t=>freq[t]=(freq[t]||0)+1);
    const topType = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
    overfullStr = `${topType[0]}最容易吃撑，共 ${overfull.length} 次，${regret.length>0?'其中 '+regret.length+' 次后悔了':''}`;
  }

  // 性价比最高：值 + 舒服/有精神
  const goodValue = meals.filter(m=>m.fb?.price==='值'&&comfortHas(m.fb?.comfort,'舒服','有精神'));
  let bestValue = '暂无足够数据';
  if(goodValue.length>=1){
    const ex = goodValue[goodValue.length-1];
    bestValue = `${ex.dish||'这顿'}：你觉得价格值，身体感受也好`;
  }

  // 状态 → 身体反应关联
  const stressedMeals = meals.filter(m=>m.state==='压力有点大'&&m.fb?.comfort);
  let stateInsight = null;
  if(stressedMeals.length>=2){
    const badStress = stressedMeals.filter(m=>comfortHas(m.fb?.comfort,'困倦','胀气'));
    if(badStress.length/stressedMeals.length>0.5){
      stateInsight = `你压力大时吃饭，${Math.round(badStress.length/stressedMeals.length*100)}% 的概率身体反应不好，下次试试先休息 10 分钟再吃`;
    }
  }

  // 最值得调整的一件事
  let action = '再记录几餐，规律就会浮现';
  if(sleepyMeals.length>=2){
    const ex=sleepyMeals[sleepyMeals.length-1];
    const tag=(ex.analysis?.tags||[])[0]||'重口味';
    action=`减少「${tag}」的频率，你有 ${sleepyMeals.length} 次饭后困倦和它有关`;
  } else if(overfull.length>=2){
    action=`${overfull[overfull.length-1].type}少点一份，你已经撑了 ${overfull.length} 次了`;
  } else if(good.length>=1){
    const ex=good[good.length-1];
    action=`多吃「${ex.dish||'让你舒服的那类餐'}」，这是你目前身体反应最好的方向`;
  }

  // 结论句留空，由 renderInsight() 基于身体拼图数据（cuisineTimeline/monthly）生成结构性洞察
  const conclusion = '';

  return {bestMeals, sleepyStr, overfullStr, bestValue, stateInsight, action, conclusion};
}

    if(otherPool.length<2) return null;

    const matureTitle =
      ins.category === 'preference' ? `「${ins.target||'—'}」已成稳定偏好` :
      ins.category === 'avoid'      ? `「${ins.target||'—'}」已确认回避` :
      ins.category === 'reaction'   ? `${ins.angle||'身体反应'} 已成稳定规律` :
      `${ins.angle||'—'}（已成稳定规律）`;

    // 🌱 forming：第 3 个样本（阈值 sparse→forming）
    if (sourceMeals.length >= 3) {
      const fm = sourceMeals[2];
      _insightEvents.push({
        ts: fm.ts,
        date: fmtDate(fm.ts),
        color: '#D97706',
        emoji: '🌱',
        title: formingTitle,
        desc: `规律正在形成（基于 3 次记录）`,

    if (ins.maturity === 'mature' && sourceMeals.length >= 5) {
      const mm = sourceMeals[4];
      const hits = Math.round(ins.evidence.sampleSize * (ins.evidence.hitRate || 0));
      _insightEvents.push({
        ts: mm.ts,
        date: fmtDate(mm.ts),
        color: 'var(--accent)',
        emoji: '✦',
        title: matureTitle,
        desc: `${ins.evidence.sampleSize} 次中 ${hits} 次命中`,

// ── 月度舒服率柱状图 ───────────────────────────────────────────────────────
function renderMonthlyTrend(monthly,improving,totalMeals){
  if(!monthly||monthly.length===0) return `<p style="font-size:14px;color:var(--ink60)">数据积累中…</p>`;
  const bars=monthly.slice(-4).map(m=>{
    const color=m.rate>=70?'var(--green)':m.rate>=40?'var(--amber)':'#ef4444';
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px">
      <p style="font-size:13px;font-weight:700;color:${color}">${m.rate}%</p>
      <div style="width:100%;background:var(--cream);border-radius:6px;height:64px;display:flex;align-items:flex-end;overflow:hidden">
        <div style="width:100%;background:${color};border-radius:6px;height:${Math.max(m.rate,6)}%;transition:height .4s ease"></div>
      </div>
      <p style="font-size:11px;color:var(--ink60)">${m.label}</p>
      <p style="font-size:10px;color:var(--ink30)">${m.good}/${m.total}餐</p>
    </div>`;
  }).join('');
  const summary=improving
    ?`比 ${monthly[0].label} 提高了 <strong style="color:var(--green)">${monthly[monthly.length-1].rate-monthly[0].rate}%</strong>。不是因为自律，是因为你越来越了解自己了。`
    :`规律在积累，数据会越来越准。共记录 ${totalMeals} 餐。`;
  return `
    <div style="display:flex;gap:8px;margin-bottom:16px;align-items:flex-end">${bars}</div>
    <div style="background:${improving?'var(--green-s)':'var(--cream)'};border-radius:12px;padding:12px 14px">
      <p style="font-size:14px;color:var(--ink60);line-height:1.7">${summary}</p>
    </div>`;
}

  const goal = getActiveGoal();
  const feeling = profile.feeling || '容易困倦';
  const avoid = profile.avoid || '无限制';
  const heightTxt = profile.height ? profile.height + ' cm' : '未填';

      ${profileEditStat('年龄', ageTxt, "openProfileNumEdit('age','年龄','岁')")}
      ${profileEditStat('性别', genderTxt, 'openProfileGenderEdit()')}

function renderAIConfigResult(type, message, meta={}){
  const isOk = type === 'ok';
  const isLoading = type === 'loading';
  const bg = isOk ? 'var(--green-s)' : isLoading ? 'var(--amber-s)' : 'var(--red-s)';
  const color = isOk ? 'var(--green)' : isLoading ? 'var(--amber)' : 'var(--red)';
  const title = isOk ? '连接可用' : isLoading ? '正在测试' : '连接失败';
  const statusLine = meta.status ? `<p style="font-size:11px;color:${color};font-weight:800;margin-bottom:2px">状态：${escapeHtml(meta.status)}</p>` : '';
  const rawLine = meta.raw ? `<p style="font-size:10px;color:var(--ink30);line-height:1.45;overflow-wrap:anywhere;margin-top:5px">原始响应：${escapeHtml(meta.raw.slice(0,300))}</p>` : '';
  return `<div style="background:${bg};border-radius:12px;padding:10px 12px">
    <p style="font-size:12px;font-weight:800;color:${color};margin-bottom:2px">${title}</p>
    ${statusLine}
    <p style="font-size:11px;color:var(--ink60);line-height:1.45;overflow-wrap:anywhere">${escapeHtml(message)}</p>
    ${rawLine}
  </div>`;
}

function setAIConfigResult(type, message, meta={}){
  const box=document.getElementById('ai-test-result');
  if(box) box.innerHTML=renderAIConfigResult(type, message, meta);
}

function setAIConfigSteps(steps){
  const box=document.getElementById('ai-test-result');
  if(!box) return;
  box.innerHTML=`<div style="background:var(--cream);border-radius:12px;padding:10px 12px">
    ${steps.map(s=>`<div style="padding:${s===steps[0]?'0':'8px 0 0'};border-top:${s===steps[0]?'none':'1px solid var(--border)'}">
      <p style="font-size:12px;font-weight:800;color:${s.ok?'var(--green)':s.pending?'var(--amber)':'var(--red)'};margin-bottom:2px">${escapeHtml(s.title)}</p>
      <p style="font-size:11px;color:var(--ink60);line-height:1.45;overflow-wrap:anywhere">状态：${escapeHtml(s.status || '等待中')} ${s.raw?`· ${escapeHtml(String(s.raw).slice(0,220))}`:''}</p>
    </div>`).join('')}
  </div>`;
}

function readAISettingsFromForm(){
  const k=cleanApiKey(document.getElementById('ai-key-input')?.value);
  const m=document.getElementById('ai-model-input')?.value.trim();
  const ep=document.getElementById('ai-endpoint-input')?.value.trim();
  if(!k || !m || !ep){
    setAIConfigResult('fail','请填完整 Key、模型和接口地址。');
    return null;
  }
  AI_CONFIG.key=k;
  AI_CONFIG.model=m;
  AI_CONFIG.endpoint=ep;
  return {k,m,ep};
}

function persistAISettings(settings){
  localStorage.setItem('ai_api_key',settings.k);
  localStorage.setItem('ai_model',settings.m);
  localStorage.setItem('ai_endpoint',settings.ep);
  AI_CONFIG.key = settings.k;
  AI_CONFIG.model = settings.m;
  AI_CONFIG.endpoint = settings.ep;
  rememberAIModel(settings.m);
  renderProfile();
}

function saveAISettings(mode){
  const settings=readAISettingsFromForm();
  if(!settings) return;
  if(mode==='save'){
    persistAISettings(settings);
    localStorage.removeItem('ai_last_error');
    setAIConfigResult('ok','配置已保存。下一次餐图分析会使用当前 Key、模型和接口地址。');
    toast('AI 配置已保存');
    return;
  }
  runAIConfigTest(settings);
}

async function runAIConfigTest(settings){
  const steps=[
    {title:'1. Key / Endpoint 认证', pending:true},
    {title:'2. 模型文本调用'},
    {title:'3. 图片识别调用'},
  ];
  setAIConfigSteps(steps);

  const auth = await testAIAuthRaw();
  steps[0]={title:'1. Key / Endpoint 认证', ok:auth.ok, status:auth.status, raw:auth.raw};
  steps[1].pending=auth.ok;
  setAIConfigSteps(steps);
  if(!auth.ok){
    rememberAIError({message:`认证失败 ${auth.status}: ${auth.raw}`, status:auth.status, raw:auth.raw});
    toast('连接失败');
    return;
  }

  const text = await testAITextRaw();
  steps[1]={title:'2. 模型文本调用', ok:text.ok, status:text.status, raw:text.raw};
  steps[2].pending=text.ok;
  setAIConfigSteps(steps);
  if(!text.ok){
    rememberAIError({message:`模型文本调用失败 ${text.status}: ${text.raw}`, status:text.status, raw:text.raw});
    toast('连接失败');
    return;
  }

  const vision = await testAIVisionRaw();
  steps[2]={title:'3. 图片识别调用', ok:vision.ok, status:vision.status, raw:vision.raw};
  setAIConfigSteps(steps);
  if(!vision.ok){
    rememberAIError({message:`图片识别调用失败 ${vision.status}: ${vision.raw}`, status:vision.status, raw:vision.raw});
    toast('连接失败');
    return;
  }

  persistAISettings(settings);
  localStorage.removeItem('ai_last_error');
  setAIConfigResult('ok',`连接可用：Key、模型文本调用、图片识别都已通过。模型：${AI_CONFIG.model}`, {status:200, raw:vision.raw});
  toast('AI 连接可用');
}

function saveProfileField(key, value){
  if(value===''||value===null||value===undefined) return;
  const num = Number(value);
  profile[key] = isNaN(num)||value==='' ? value : num;
  // 体重每次保存都追加到时序日志
  if(key==='weight' && !isNaN(num) && num>0){
    if(!profile.weightLog) profile.weightLog=[];
    profile.weightLog.push({ value:parseFloat(num), ts:Date.now() });
    profile.weightLog = profile.weightLog.slice(-52); // 保留约一年周数据
  }
  if(currentUser){ try{ localStorage.setItem('profile_'+currentUser, JSON.stringify(profile)); }catch(_){} }
  renderProfile();
}

function computeTasteStats(){
  const cuisines=meals.map(m=>m.cuisine).filter(Boolean);
  const freq={};cuisines.forEach(c=>freq[c]=(freq[c]||0)+1);
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  return {topCuisine:top?top[0]:'暂无', cuisineCount:new Set(cuisines).size};
}

// ── 3️⃣ 周报表（集成到身体拼图） ────────────────────────────────────────────────────
function mealTimeMs(m){
  const candidates=[m?.ts,m?.createdAt,m?.created_at,m?.time,m?.dateTime];
  for(const v of candidates){
    const t=typeof v==='number'?v:Date.parse(v);
    if(Number.isFinite(t)) return t;
  }
  return null;
}

function firstNumber(value){
  const hit=String(value||'').match(/\d+(?:\.\d+)?/);
  return hit ? Number(hit[0]) : null;
}

function renderWeeklyReportSection(allMeals){
  const source = toArray(allMeals);
  if(source.length === 0) return '';
  const now = Date.now();
  let weekMeals = source.filter(m => {
    const t = mealTimeMs(m);
    if(!t) return false;
    const daysAgo = (now - t) / (1000*60*60*24);
    return daysAgo >= 0 && daysAgo <= 7;
  });

  // 兼容补记、历史导入和旧原型数据：没有有效时间时，用最近 7 条记录生成周报。
  if(weekMeals.length === 0) weekMeals = source.slice(-7);

  if(weekMeals.length === 0) return '';

  // 口味偏好
  const flavorMap = {};
  weekMeals.forEach(m => {
    const cuisine = m.cuisine || '其他';
    flavorMap[cuisine] = (flavorMap[cuisine] || 0) + 1;
  });
  const topFlavors = Object.entries(flavorMap).sort((a,b) => b[1]-a[1]).slice(0,3);

  // 营养汇总
  let totalCals = 0, calCount = 0, totalProtein = 0, proteinCount = 0;
  weekMeals.forEach(m => {
    if(m.analysis?.nutritionEstimate?.calories?.range){
      const cal = firstNumber(m.analysis.nutritionEstimate.calories.range);
      if(cal !== null){ totalCals += cal; calCount++; }
    }
    if(m.analysis?.nutritionEstimate?.protein?.range){
      const prot = firstNumber(m.analysis.nutritionEstimate.protein.range);
      if(prot !== null){ totalProtein += prot; proteinCount++; }
    }
  });

  // 感受统计
  const feelingMap = {};
  const fullnessMap = {};
  weekMeals.forEach(m => {
    comfortArr(m.fb?.comfort || '未评').forEach(c=>{ feelingMap[c]=(feelingMap[c]||0)+1; });
    const fullness = m.fb?.fullness || m.fb?.satiety || '未评';
    fullnessMap[fullness] = (fullnessMap[fullness] || 0) + 1;
  });

  // 改进建议（基于反馈）
  let suggestion = '';
  if(feelingMap['困倦'] && feelingMap['困倦'] >= weekMeals.length/2){
    suggestion = '😴 这周午餐后困倦明显，建议减少高碳水组合，增加蛋白质。';
  } else if(fullnessMap['撑'] && fullnessMap['撑'] >= 2){
    suggestion = '🍽️ 发现容易吃撑的模式，可以提前设定饭量提醒。';
  } else {
    suggestion = '✨ 保持现在的饮食节奏，身体反馈很稳定！';
  }

  const goodFeelings = Object.entries(feelingMap).filter(([k]) => ['舒服','有精神'].includes(k));
  const avgCal = calCount ? Math.round(totalCals / calCount) : null;
  const avgProtein = proteinCount ? Math.round(totalProtein / proteinCount) : null;

  return `
    <div class="card fade" style="animation-delay:.24s;background:linear-gradient(135deg, var(--accent-s), var(--amber-s));border:1px solid var(--border)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
        <div style="font-size:11px;font-weight:600;color:var(--ink60);text-transform:uppercase;letter-spacing:.07em">📊 我的一周</div>
        <span style="font-size:11px;color:var(--ink30)">近 ${weekMeals.length} 餐</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <div style="font-size:13px;color:var(--ink60);margin-bottom:6px">口味</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">
            ${topFlavors.slice(0,2).map(([f,c]) => `<span class="chip chip-amber" style="font-size:11px">${f}${c}×</span>`).join('') || '<span class="chip" style="font-size:11px">待观察</span>'}
          </div>
        </div>
        <div>
          <div style="font-size:13px;color:var(--ink60);margin-bottom:6px">感受最好</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">
            ${goodFeelings.map(([k,v]) => `<span class="chip chip-green" style="font-size:11px">${k}${v}×</span>`).join('') || '<span class="chip" style="font-size:11px">待观察</span>'}
          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <div style="background:rgba(255,255,255,.62);border-radius:12px;padding:10px">
          <p style="font-size:11px;color:var(--ink60);margin-bottom:4px">粗估热量</p>
          <p style="font-size:16px;font-weight:800;color:var(--accent)">${avgCal ? `约${avgCal} kcal/餐` : '待确认'}</p>
        </div>
        <div style="background:rgba(255,255,255,.62);border-radius:12px;padding:10px">
          <p style="font-size:11px;color:var(--ink60);margin-bottom:4px">蛋白质</p>
          <p style="font-size:16px;font-weight:800;color:var(--green)">${avgProtein ? `约${avgProtein} g/餐` : '待确认'}</p>
        </div>
      </div>
      <p style="font-size:12px;color:var(--ink);margin-top:10px;line-height:1.5">${suggestion}</p>
    </div>`;
}

// ── 历史周总结 ────────────────────────────────────────────────────────────────
function showWeeklySummaryHistory(){
  document.getElementById('weekly-history-sheet')?.remove();
  const sheet=document.createElement('div');
  sheet.id='weekly-history-sheet';
  sheet.style.cssText=`position:fixed;inset:0;z-index:600;background:var(--white);display:flex;flex-direction:column;animation:slideInRight .22s ease`;

  const nowMs=Date.now();
  const src=[...meals];

  // 当前期：与卡片算法完全一致（近7天有效记录，兜底取最近7条）
  let curMeals=src.filter(m=>{const t=mealTimeMs(m);return t&&(nowMs-t)/864e5<=7;});
  if(curMeals.length===0) curMeals=src.slice(-7);
  const curSet=new Set(curMeals);

  // 当前期日期标签：本周周一～周日
  const wdNow=(new Date(nowMs).getDay()+6)%7;
  const monMs=new Date(nowMs-wdNow*864e5); monMs.setHours(0,0,0,0);
  const sunDate=new Date(monMs.getTime()+6*864e5);
  function fd(d){return `${d.getMonth()+1}月${d.getDate()}日`;}
  const curLabel=`${fd(monMs)} ~ ${fd(sunDate)}`;

  // 历史周：自然周分组，排除当前期已包含的记录
  const historical=src.filter(m=>m.ts&&!curSet.has(m)).sort((a,b)=>a.ts-b.ts);
  const histWeeks=[];
  if(historical.length){
    let wStart=new Date(historical[0].ts); wStart.setHours(0,0,0,0);
    const wd2=(wStart.getDay()+6)%7; wStart=new Date(wStart.getTime()-wd2*864e5);
    let cursor=wStart.getTime();
    while(cursor<monMs.getTime()){
      const wEnd=cursor+7*864e5;
      const wm=historical.filter(m=>m.ts>=cursor&&m.ts<wEnd);
      if(wm.length>0) histWeeks.push({label:`${fd(new Date(cursor))} ~ ${fd(new Date(wEnd-864e5))}`,meals:wm});
      cursor=wEnd;
    }
  }

  // 合并：当前期在最前，历史倒序
  const allWeeks=[{label:curLabel,meals:curMeals},...histWeeks.reverse()];

  function renderWeek(w){
    // 口味
    const flavorMap={};w.meals.forEach(m=>{const c=m.cuisine||'其他';flavorMap[c]=(flavorMap[c]||0)+1;});
    const topFlavors=Object.entries(flavorMap).sort((a,b)=>b[1]-a[1]).slice(0,2);
    // 感受
    const feelingMap={};const fullnessMap={};
    w.meals.forEach(m=>{
      comfortArr(m.fb?.comfort||'未评').forEach(c=>{feelingMap[c]=(feelingMap[c]||0)+1;});
      const f=m.fb?.fullness||m.fb?.satiety||'未评';fullnessMap[f]=(fullnessMap[f]||0)+1;
    });
    const goodFeelings=Object.entries(feelingMap).filter(([k])=>['舒服','有精神'].includes(k));
    // 营养
    let totalCals=0,calCount=0,totalProtein=0,proteinCount=0;
    w.meals.forEach(m=>{
      if(m.analysis?.nutritionEstimate?.calories?.range){const v=firstNumber(m.analysis.nutritionEstimate.calories.range);if(v!==null){totalCals+=v;calCount++;}}
      if(m.analysis?.nutritionEstimate?.protein?.range){const v=firstNumber(m.analysis.nutritionEstimate.protein.range);if(v!==null){totalProtein+=v;proteinCount++;}}
    });
    const avgCal=calCount?Math.round(totalCals/calCount):null;
    const avgProtein=proteinCount?Math.round(totalProtein/proteinCount):null;
    // 建议
    let suggestion='';
    if(feelingMap['困倦']&&feelingMap['困倦']>=w.meals.length/2) suggestion='😴 这周午餐后困倦明显，建议减少高碳水组合，增加蛋白质。';
    else if(fullnessMap['撑']&&fullnessMap['撑']>=2) suggestion='🍽️ 发现容易吃撑的模式，可以提前设定饭量提醒。';
    else suggestion='✨ 保持现在的饮食节奏，身体反馈很稳定！';
    return `<div class="card" style="background:linear-gradient(135deg,var(--accent-s),var(--amber-s));border:1px solid var(--border);margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:700;color:var(--ink60)">${w.label}</div>
        <span style="font-size:11px;color:var(--ink30)">近 ${w.meals.length} 餐</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <div style="font-size:13px;color:var(--ink60);margin-bottom:6px">口味</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">
            ${topFlavors.slice(0,2).map(([f,c])=>`<span class="chip chip-amber" style="font-size:11px">${f}${c}×</span>`).join('')||'<span class="chip" style="font-size:11px">待观察</span>'}
          </div>
        </div>
        <div>
          <div style="font-size:13px;color:var(--ink60);margin-bottom:6px">感受最好</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">
            ${goodFeelings.map(([k,v])=>`<span class="chip chip-green" style="font-size:11px">${k}${v}×</span>`).join('')||'<span class="chip" style="font-size:11px">待观察</span>'}
          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <div style="background:rgba(255,255,255,.62);border-radius:12px;padding:10px">
          <p style="font-size:11px;color:var(--ink60);margin-bottom:4px">粗估热量</p>
          <p style="font-size:16px;font-weight:800;color:var(--accent)">${avgCal?`约${avgCal} kcal/餐`:'待确认'}</p>
        </div>
        <div style="background:rgba(255,255,255,.62);border-radius:12px;padding:10px">
          <p style="font-size:11px;color:var(--ink60);margin-bottom:4px">蛋白质</p>
          <p style="font-size:16px;font-weight:800;color:var(--green)">${avgProtein?`约${avgProtein} g/餐`:'待确认'}</p>
        </div>
      </div>
      <p style="font-size:12px;color:var(--ink);margin-top:10px;line-height:1.5">${suggestion}</p>
    </div>`;
  }
  const weeksHtml=allWeeks.map(renderWeek).join('')||'<p style="color:var(--ink60);text-align:center;padding:40px 0">暂无历史数据</p>';

  sheet.innerHTML=`
    <style>@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}</style>
    <div style="display:flex;align-items:center;gap:4px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0">
      <button onclick="document.getElementById('weekly-history-sheet').remove()" style="background:none;border:none;cursor:pointer;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink)">←</button>
      <h2 style="font-size:17px;font-weight:700;flex:1">我的一周 · 历史</h2>
      <span style="font-size:13px;color:var(--ink30)">${allWeeks.length} 周</span>
    </div>
    <div style="flex:1;overflow-y:auto;padding:20px 16px 48px">
      <p style="font-size:13px;color:var(--ink60);margin-bottom:16px;line-height:1.6">每周总结在周日晚 7 点生成，周一 0 点后仅在这里查看历史。</p>
      ${weeksHtml}
    </div>`;
  document.body.appendChild(sheet);
}

// 初始化
function initApp(){
  loadUserSession();
  if(currentUser) loadMealsForUser();
  navBackTarget='roadmap';
  renderRoadmap();
  show('roadmap');
}

window.addEventListener('load', initApp);
</script>

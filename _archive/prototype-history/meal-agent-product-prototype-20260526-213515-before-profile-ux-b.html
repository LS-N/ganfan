<html lang="zh">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>干饭 · 好好吃饭</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF7F2;--white:#FFFEF9;--ink:#1A1612;--ink60:#7A6E66;--ink30:#C5BDB5;
  --accent:#E85D26;--accent-s:#FFF0E9;--green:#2D6A4F;--green-s:#EBF5EF;
  --amber:#D4860A;--amber-s:#FEF6E4;--red:#C0392B;--red-s:#FDECEA;
  --border:#EDE8E1;--r:16px;--rs:10px;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  --serif:Georgia,'Songti SC',serif;
}
html,body{height:100%;background:var(--cream);font-family:var(--sans);color:var(--ink)}
#app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;position:relative}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:0;z-index:100}
.nav-title{font-family:var(--serif);font-size:19px}
.nav-back{background:none;border:none;color:var(--ink60);font-size:14px;font-family:var(--sans);padding:6px 10px;border-radius:8px;cursor:pointer}
.nav-home-left{display:flex;align-items:center;gap:14px;border:none;background:transparent;padding:0;font-family:var(--sans);min-width:170px}
.nav-avatar{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:linear-gradient(135deg,var(--accent-s),var(--green-s));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(26,22,18,.06)}
.nav-home-stat{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:21px;font-weight:900;line-height:1}
.nav-home-stat .muted{color:var(--ink30)}
.home-slide{position:relative;height:58px;border-radius:999px;background:var(--cream);border:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:5px;margin:18px 0 16px;overflow:hidden}
.home-slide-thumb{position:absolute;top:5px;bottom:5px;left:calc(33.333% + 5px);width:calc(33.333% - 10px);border-radius:999px;background:var(--white);box-shadow:0 8px 22px rgba(26,22,18,.08);border:1px solid var(--border);z-index:1}
.home-slide button{position:relative;z-index:2;border:none;background:transparent;font-family:var(--sans);font-size:12px;font-weight:800;color:var(--ink60);cursor:pointer;height:48px;border-radius:999px}
.home-slide button.center{color:var(--accent);font-size:13px}

/* TABS */
.tabbar{display:flex;border-top:1px solid var(--border);background:var(--white);position:sticky;bottom:0;z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;border:none;background:none;cursor:pointer;color:var(--ink60);font-family:var(--sans);font-size:10px;font-weight:500}
.tab-btn.active{color:var(--accent)}
.tab-icon{font-size:20px;line-height:1}

/* PAGE */
.page{flex:1;overflow-y:auto;padding:20px;padding-bottom:90px}
.screen{display:none}.screen.active{display:block}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 24px;border-radius:100px;font-family:var(--sans);font-size:15px;font-weight:500;cursor:pointer;border:none;width:100%;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:#C44D1F;transform:scale(.98)}
.btn-primary:disabled{opacity:.4;cursor:default}
.btn-ghost{background:transparent;color:var(--ink60);font-size:14px;margin-top:8px}

/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px}

/* CHIPS */
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:500}
.chip-green{background:var(--green-s);color:var(--green)}
.chip-amber{background:var(--amber-s);color:var(--amber)}
.chip-red{background:var(--red-s);color:var(--red)}

/* SECTION LABEL */
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink60);margin-bottom:10px}

/* UPLOAD ZONE */
.upload-zone{border:2px dashed var(--border);border-radius:var(--r);padding:28px 20px;text-align:center;cursor:pointer;background:var(--cream);transition:border-color .2s;margin-bottom:14px}
.upload-zone:active{border-color:var(--accent);background:var(--accent-s)}
.upload-zone img{width:100%;height:160px;object-fit:cover;border-radius:var(--rs);display:block}
.upload-zone .uz-icon{font-size:30px;margin-bottom:6px}
.upload-zone p{font-size:13px;color:var(--ink60)}

/* SCORE BUTTONS */
.score-row{display:flex;gap:8px;margin-bottom:16px}
.score-btn{flex:1;padding:10px 4px;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--white);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink60);transition:all .15s;text-align:center}
.score-btn.sel{border-color:var(--accent);background:var(--accent-s);color:var(--accent)}

/* PROGRESS DOTS */
.day-dots{display:flex;gap:8px;flex-wrap:wrap}
.day-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--ink60)}
.day-dot.done{background:var(--accent);border-color:var(--accent);color:#fff}
.day-dot.today{border-color:var(--accent);color:var(--accent)}

/* RISK BAR */
.risk-bar{height:3px;border-radius:2px;margin-top:10px}
.risk-low{background:var(--green);width:33%}
.risk-medium{background:var(--amber);width:66%}
.risk-high{background:var(--red);width:100%}

/* ADVICE BOX */
.advice-box{background:var(--accent-s);border-radius:var(--rs);padding:14px;margin-top:12px}
.advice-text{font-size:14px;color:var(--accent);line-height:1.6}

/* MEAL LIST */
.meal-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.meal-item:last-child{border-bottom:none}
.meal-ava{width:42px;height:42px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.meal-meta{flex:1}
.meal-top{display:flex;align-items:center;justify-content:space-between}
.meal-name{font-size:13px;font-weight:600}
.meal-feel{font-size:12px;color:var(--ink60);margin-top:3px}

/* INSIGHT CARD */
.insight-row{display:flex;gap:10px;align-items:flex-start}
.insight-icon{font-size:22px;flex-shrink:0}
.insight-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink60);margin-bottom:4px}
.insight-val{font-size:14px;line-height:1.5}

/* ONBOARD */
.ob-progress{display:flex;gap:6px;margin-bottom:22px}
.ob-bar{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background .3s}
.ob-bar.done{background:var(--accent)}
.ob-question{font-family:var(--serif);font-size:24px;line-height:1.3;margin-bottom:20px}
.ob-opt{display:flex;align-items:center;gap:10px;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--rs);cursor:pointer;margin-bottom:10px;font-size:15px;transition:all .15s}
.ob-opt.sel{border-color:var(--accent);background:var(--accent-s);color:var(--accent)}

/* HERO */
.hero-title{font-family:var(--serif);font-size:36px;line-height:1.1;margin-top:6px}
.hero-title em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:14px;color:var(--ink60);line-height:1.6;margin-top:8px}

/* ANALYZING */
.analyzing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.spin{display:inline-block;font-size:48px;animation:spin 2s linear infinite}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:999;white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes puzzlePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes planPageIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes planPageBack{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .3s ease both}
</style>
</head>

let currentUser = null;
function loadUserSession(){
  const userStr = localStorage.getItem('user_session');
  if(userStr){
    try{
      currentUser = JSON.parse(userStr);
      return true;
    }catch(_){}
  }
  return false;
}
function saveUserSession(user){
  currentUser = user;
  localStorage.setItem('user_session', JSON.stringify(user));
}
function logout(){
  currentUser = null;
  localStorage.removeItem('user_session');
  localStorage.removeItem('user_data');
  show('login');
}
function getUserMeals(){
  if(!currentUser) return [];
  const allStr = localStorage.getItem('user_data');
  const allData = allStr ? JSON.parse(allStr) : {};
  return allData[currentUser.userId]?.meals || [];
}
async function compressImgForStorage(dataUrl, maxPx=480, quality=0.65){
  if(!dataUrl||!dataUrl.startsWith('data:image')) return dataUrl;
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxPx/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale);
      c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

function checkStorageQuota(){
  try{
    const used=Object.entries(localStorage).reduce((s,[k,v])=>s+k.length+v.length,0);
    const usedMB=(used/1024/1024).toFixed(1);
    if(used>4*1024*1024){
      toast(`⚠ 本地存储已用 ${usedMB}MB，接近上限。建议在「我的记录」清理旧图片。`);
    }
  }catch(_){}
}

function saveUserMeals(meals){
  if(!currentUser) return;
  const allStr = localStorage.getItem('user_data');
  const allData = allStr ? JSON.parse(allStr) : {};
  allData[currentUser.userId] = {meals, profile, correctionHistory: correctionHistory};
  try{
    localStorage.setItem('user_data', JSON.stringify(allData));
    checkStorageQuota();
  }catch(e){
    if(e.name==='QuotaExceededError'||e.code===22){
      toast('⚠ 存储空间不足，图片过多。已跳过本次保存，请清理旧记录后重试。');
    }
  }
}

function setUserDataForCurrent(nextMeals, nextProfile){
  if(!currentUser) return;

  allData[currentUser.userId] = {

  };
  localStorage.setItem('user_data', JSON.stringify(allData));
}

function getCurrentUserData(){
  if(!currentUser) return null;
  const allStr = localStorage.getItem('user_data');
  const allData = allStr ? JSON.parse(allStr) : {};
  return allData[currentUser.userId] || null;
}

function computePlanReasoning(){
  const bad=meals.filter(m=>comfortHas(m.fb?.comfort,'困倦','胀气')||m.fb?.mood==='后悔');
  const good=meals.filter(m=>comfortHas(m.fb?.comfort,'舒服','有精神')&&m.fb?.mood==='满足');
  const badTags={};
  bad.forEach(m=>(m.analysis?.tags||[]).forEach(t=>badTags[t]=(badTags[t]||0)+1));
  const goodTags={};
  good.forEach(m=>(m.analysis?.tags||[]).forEach(t=>goodTags[t]=(goodTags[t]||0)+1));
  const topBad=Object.entries(badTags).sort((a,b)=>b[1]-a[1])[0];
  const topGood=Object.entries(goodTags).sort((a,b)=>b[1]-a[1])[0];
  return {topBad,topGood,sleepy:bad.filter(m=>comfortHas(m.fb?.comfort,'困倦')).length,badCount:bad.length,goodCount:good.length};
}

  {durationMin:19*60+29,startLabel:'5月6日 21:39',endLabel:'5月7日 17:08',medal:'gold',dayStr:'2026-05-06'},
  {durationMin:243*60+46,startLabel:'4月26日 17:53',endLabel:'5月6日 21:39',medal:'bronze',dayStr:'2026-04-26'}
];
let fastTimerInterval=null;
const FASTING_PLANS={
  '14:10': {fast:14,eat:10,icon:'🍎',desc:'14 小时空窗，10 小时进食，温和入门'},
  '16:8':  {fast:16,eat:8, icon:'🍊',desc:'最受欢迎，16 小时空窗，8 小时进食'},
  '18:6':  {fast:18,eat:6, icon:'🥝',desc:'18 小时空窗，6 小时进食，进阶减重'},
  '20:4':  {fast:20,eat:4, icon:'🍋',desc:'20 小时空窗，每日 1-2 餐，深度模式'},
  '不启用': {fast:0, eat:24,icon:'🥑',desc:'不记录禁食数据，餐饮计划不受影响'}
};
function getAIFastingRecommendation(){
  const g=getActiveGoal();
  if(g==='减重'||g==='控糖更稳') return '16:8';
  if(g==='改善睡眠'||g==='减少夜宵') return '14:10';
  return '14:10';
}
function fmtHMS(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');
}
function fmtClock(ms){
  const d=new Date(ms);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function startFastTimer(){
  clearInterval(fastTimerInterval);
  fastTimerInterval=setInterval(function(){
    const el=document.getElementById('fast-countdown');
    if(!el){clearInterval(fastTimerInterval);return;}
    const plan=FASTING_PLANS[mvp3FastingPlan]||FASTING_PLANS['16:8'];
    let remaining;
    if(fastingState==='eating'){
      remaining=Math.max(0,fastEatStartMs+plan.eat*3600000-Date.now());
    } else {
      remaining=Math.max(0,fastStartMs+plan.fast*3600000-Date.now());
      if(remaining===0){endFastAuto();return;}
    }
    el.textContent=fmtHMS(remaining);
  },1000);
}
function endFastAuto(){
  clearInterval(fastTimerInterval);
  if(fastStartMs){
    const dur=Math.floor((Date.now()-fastStartMs)/60000);
    const s=new Date(fastStartMs),e=new Date();
    fastingHistory.unshift({
      durationMin:dur,
      startLabel:(s.getMonth()+1)+'月'+s.getDate()+'日 '+String(s.getHours()).padStart(2,'0')+':'+String(s.getMinutes()).padStart(2,'0'),
      endLabel:(e.getMonth()+1)+'月'+e.getDate()+'日 '+String(e.getHours()).padStart(2,'0')+':'+String(e.getMinutes()).padStart(2,'0'),
      medal:dur>=16*60?'gold':'bronze'
    });
  }
  fastingState='eating';fastEatStartMs=Date.now();fastStartMs=null;
  if(curScreen==='mvp2') renderMvpTwo(); else renderMvpThree();
}

  }

    startTimeLabel=fmtClock(fastStartMs);
    barProgress=Math.min(1,(now-fastStartMs)/(plan.fast*3600000));
  } else {
    const eatEndMs=fastEatStartMs+plan.eat*3600000;
    countdownMs=Math.max(0,eatEndMs-now);
    statusLabel='距下次禁食';
    endTimeLabel=fmtClock(eatEndMs);
    startTimeLabel=fmtClock(fastEatStartMs);
    barProgress=Math.min(1,(now-fastEatStartMs)/(plan.eat*3600000));
  }

  const barBg=isFasting?'#FEF3CD':'#D4F0DC';

  let fireBarHtml='';

    footerText=isFasting?'坚持就是胜利，保持状态':'好好享用，准备好了再开始禁食';

function confirmEndFast(){
  let recorded=false;
  if(fastStartMs){
    const dur=Math.floor((Date.now()-fastStartMs)/60000);
    if(dur>=9*60){
      const s=new Date(fastStartMs),e=new Date();
      const dayStr=e.getFullYear()+'-'+String(e.getMonth()+1).padStart(2,'0')+'-'+String(e.getDate()).padStart(2,'0');
      fastingHistory.unshift({
        durationMin:dur,
        startLabel:(s.getMonth()+1)+'月'+s.getDate()+'日 '+String(s.getHours()).padStart(2,'0')+':'+String(s.getMinutes()).padStart(2,'0'),
        endLabel:(e.getMonth()+1)+'月'+e.getDate()+'日 '+String(e.getHours()).padStart(2,'0')+':'+String(e.getMinutes()).padStart(2,'0'),
        medal:dur>=16*60?'gold':'bronze',
        dayStr
      });
      recorded=true;
    }
  }
  fastingState='eating';fastEatStartMs=Date.now();fastStartMs=null;
  clearInterval(fastTimerInterval);
  document.querySelectorAll('[data-end-fast-sheet]').forEach(function(e){e.remove();});
  document.querySelectorAll('[data-fast-meal-check]').forEach(function(e){e.remove();});
  if(curScreen==='mvp2') renderMvpTwo(); else renderMvpThree();
  if(recorded){
    const streak=computeFastStreak();
    setTimeout(()=>showFastCelebration(streak),400);
  }
}

function computeFastStreak(){
  const days=[...new Set(fastingHistory.map(h=>h.dayStr).filter(Boolean))].sort().reverse();
  if(!days.length) return fastingHistory.length;
  let streak=1;
  for(let i=0;i<days.length-1;i++){
    const diff=(new Date(days[i])-new Date(days[i+1]))/(86400000);
    if(diff<=2) streak++; else break;
  }
  return streak;
}

// ── ONBOARD ───────────────────────────────────────────────────────────────────
function renderOnboard(){
  const s=document.getElementById('s-onboard');
  const step=obSteps[obStep];
  const sel=profile[step.key]||'';
  const bars=obSteps.map((_,i)=>`<div class="ob-bar${i<=obStep?' done':''}"></div>`).join('');
  const opts=step.opts.map(o=>`<div class="ob-opt${sel===o?' sel':''}" onclick="obSelect('${o}')">${sel===o?'● ':'○ '}${o}</div>`).join('');
  s.innerHTML=`
  <div class="fade">
    <div class="ob-progress">${bars}</div>
    <p style="font-size:12px;color:var(--ink60);margin-bottom:6px">${obStep+1} / ${obSteps.length}</p>
    <p class="ob-question">${step.q}</p>
    <div style="margin-bottom:24px">${opts}</div>
    <button class="btn btn-primary" id="ob-next" onclick="obNext()" ${sel?'':'disabled'} style="opacity:${sel?1:.4}">
      ${obStep<obSteps.length-1?'继续 →':'开始记录 →'}
    </button>
  </div>`;
}
function obSelect(val){
  const step = obSteps[obStep];
  profile[step.key] = val;
  // 单日预算：将选项字符串转为整数存入 profile.daily_budget
  if(step.key === 'daily_budget' && step.budgetMap){
    profile.daily_budget = step.budgetMap[val] || 90;
  }
  renderOnboard();
}
function obNext(){
  if(!profile[obSteps[obStep].key]) return;
  if(obStep<obSteps.length-1){obStep++;renderOnboard();}
  else{
    if(currentUser) setUserDataForCurrent(meals, profile);
    renderHome();
    show('home');
  }
}

// ── 每日身体回访（每天一次，三个维度）────────────────────────────────
function scheduleDailyCheckin(meal){
  try{
    const dateKey = getTodayDateKey();
    const checkins = JSON.parse(localStorage.getItem('daily_checkins')||'[]');
    const existing = checkins.find(c=>c.date===dateKey);
    // 晚饭 → 次日早 7 点触发；其他餐次 → 下午 5 点或 3 小时后（取较晚者）
    const tomorrow7am = ()=>{ const d=new Date(); d.setDate(d.getDate()+1); d.setHours(7,0,0,0); return d.getTime(); };
    const today5pm = ()=>{ const d=new Date(); d.setHours(17,0,0,0); return Math.max(d.getTime(), Date.now()+3*3600000); };
    const isDinner = meal.type==='晚饭';
    if(existing && !existing.answered){
      if(!existing.mealIds.includes(meal.id)) existing.mealIds.push(meal.id);
      // 只要有一顿是晚饭，触发时间就推到次日晨
      if(isDinner){ existing.dueAt=tomorrow7am(); existing.isNextDay=true; }
    } else if(!existing){
      checkins.push({ date:dateKey, mealIds:[meal.id],
        dueAt: isDinner ? tomorrow7am() : today5pm(),
        isNextDay: isDinner,
        answered:false, dismissed:false,
        energy:null, digestion:null, satiety:null, answeredAt:null });
    }
    localStorage.setItem('daily_checkins', JSON.stringify(checkins.slice(-30)));
  }catch(_){}
}

function renderDailyCheckinCard(){
  try{
    const checkins = JSON.parse(localStorage.getItem('daily_checkins')||'[]');
    const today = getTodayDateKey();
    const yesterday = getDateKey(Date.now()-86400000);
    const due = checkins.find(c=>(c.date===today||c.date===yesterday)&&!c.answered&&Date.now()>=c.dueAt);
    if(!due) return '';
    const label = due.isNextDay||due.date===yesterday ? '昨天吃了什么，身体有什么感受？' : '今天吃得怎么样，身体有什么感受？';
    const qs=[

function submitDailyCheckin(dateKey){
  try{
    const checkins=JSON.parse(localStorage.getItem('daily_checkins')||'[]');
    const idx=checkins.findIndex(c=>c.date===dateKey);
    if(idx>=0){
      checkins[idx].answered=true;
      checkins[idx].energy=checkinAnswers.energy;
      checkins[idx].digestion=checkinAnswers.digestion;
      checkins[idx].satiety=checkinAnswers.satiety;
      checkins[idx].answeredAt=Date.now();
      // 回写到当天每一条餐次记录
      (checkins[idx].mealIds||[]).forEach(mealId=>{
        const m=meals.find(m=>String(m.id)===String(mealId));
        if(m){ m.dailyCheckin={ energy:checkinAnswers.energy, digestion:checkinAnswers.digestion,
          satiety:checkinAnswers.satiety, answeredAt:Date.now() }; }
      });
      if(currentUser) saveUserMeals(meals);
    }
    localStorage.setItem('daily_checkins', JSON.stringify(checkins));
    checkinAnswers={};
  }catch(_){}
  toast('✓ 身体感受已记录');
  renderHome();
}

function dismissDailyCheckin(dateKey){
  try{
    const checkins=JSON.parse(localStorage.getItem('daily_checkins')||'[]');
    const idx=checkins.findIndex(c=>c.date===dateKey);
    if(idx>=0){ checkins[idx].answered=true; checkins[idx].dismissed=true; }
    localStorage.setItem('daily_checkins', JSON.stringify(checkins));
    checkinAnswers={};
  }catch(_){}
  renderHome();
}

function getTodayStartMs(){
  const todayStart=new Date();todayStart.setHours(0,0,0,0);
  return todayStart.getTime();
}

function mealTs(m){
  return m?.startedAt || m?.mealStartedAt || m?.ts || 0;
}

function isTodayMeal(m){
  return mealTs(m)>=getTodayStartMs();
}

function mealElapsedMin(m){
  const ts=mealTs(m);
  if(!ts) return 0;
  return Math.max(0,Math.floor((Date.now()-ts)/60000));
}

function isUnfeedbackMeal(m){
  return m && !m.fb;
}

function isMealOverdue(m){
  return isUnfeedbackMeal(m) && mealElapsedMin(m)>=30;
}

function todayUnfeedbackMeals(){
  return meals
    .filter(m=>isTodayMeal(m)&&isUnfeedbackMeal(m))
    .sort((a,b)=>mealTs(b)-mealTs(a));
}

function getActiveHomePendingMeal(){
  return todayUnfeedbackMeals().find(m=>!isMealOverdue(m)) || null;
}

function getHomeScene(){
  const n=Math.min(meals.length,7);
  const scene=getCurrentMealScene();
  const overdue=todayUnfeedbackMeals().filter(isMealOverdue);
  const pending=forceHomeRecordDefault?null:getActiveHomePendingMeal();
  if(pending){
    return renderHomePendingMeal(pending) + (overdue.length?renderHomeOverdueHint(overdue):'');
  }
  return renderHomeBeforeMeal(scene,n,forceHomeRecordDefault?'默认':'') + (overdue.length?renderHomeOverdueHint(overdue):'');
}

function apiErrorMessage(status, raw){
  let detail = '';
  try {
    const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
    detail = parsed?.error?.message || parsed?.message || parsed?.detail || JSON.stringify(parsed);
  } catch(_) {
    detail = String(raw || '').trim();
  }
  return detail ? `API error ${status}: ${detail}` : `API error ${status}`;
}

function createAIError(status, raw){
  const err = new Error(apiErrorMessage(status, raw));
  err.status = status;
  err.raw = raw;
  return err;
}

function describeAIError(error){
  const msg = String(error?.message || error || '未知错误');
  const status = error?.status || (msg.match(/API error\s+(\d+)/i)?.[1] || '');
  const raw = String(error?.raw || '').trim();
  const isTimeout = String(status).toUpperCase() === 'TIMEOUT' || /timeout/i.test(msg);
  return {
    status: status || (isTimeout ? 'TIMEOUT' : (/Failed to fetch|NetworkError|Load failed/i.test(msg) ? 'NETWORK' : 'UNKNOWN')),
    message: isTimeout ? `${msg}。前端在限定时间内没有收到 HTTP 响应，这不是 400/401/500 状态码。` : msg,
    raw,
  };
}

function chatEndpointToModelsUrl(endpoint){

    url.pathname = url.pathname.replace(/\/chat\/completions\/?$/,'/models');

  }
}

async function rawAIRequest(url, options={}, timeoutMs=30000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, {...options, signal:controller.signal});
    const raw = await res.text().catch(()=>'');
    return {ok:res.ok, status:res.status, raw};
  } catch(e) {
    if(e?.name === 'AbortError') return {ok:false, status:'TIMEOUT', raw:`Request timeout after ${Math.round(timeoutMs/1000)}s`};
    return {ok:false, status:'NETWORK', raw:e?.message || 'Network request failed'};
  } finally {
    clearTimeout(timer);
  }
}

function extractJsonObject(text){
  if(!text) throw new Error('AI 返回为空');
  const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const source = fenced ? fenced[1] : text;
  try { return JSON.parse(source.trim()); } catch(_){}
  const start = source.indexOf('{');
  const end = source.lastIndexOf('}');
  if(start === -1 || end === -1 || end <= start) throw new Error('AI 返回中没有 JSON');
  try {
    return JSON.parse(source.slice(start, end + 1));
  } catch(e) {
    const body = source.slice(start, end + 1);
    const openBraces = (body.match(/\{/g)||[]).length;
    const closeBraces = (body.match(/\}/g)||[]).length;
    const openBrackets = (body.match(/\[/g)||[]).length;
    const closeBrackets = (body.match(/\]/g)||[]).length;
    const preview = source.slice(start, Math.min(end + 1, start + 360)).replace(/\s+/g,' ');
    if(openBraces !== closeBraces || openBrackets !== closeBrackets){
      throw new Error(`AI 返回 JSON 被截断或括号未闭合；返回片段：${preview}`);
    }
    throw new Error(`${e.message}；返回片段：${preview}`);
  }
}

function normalizeNutritionEstimate(v, foodType){
  const n = v && typeof v === 'object' ? v : {};
  const metric = (key, fallbackLevel, fallbackRange='暂无法估算')=>{
    const raw = n[key];
    if(raw && typeof raw === 'object'){
      return {
        range: raw.range || raw.value || fallbackRange,
        level: raw.level || fallbackLevel,
        basis: raw.basis || '',
      };
    }
    return {
      range: typeof raw === 'string' && /\d/.test(raw) ? raw : fallbackRange,
      level: typeof raw === 'string' && !/\d/.test(raw) ? raw : fallbackLevel,
      basis: '',
    };
  };
  return {
    calories: metric('calories','待确认','无法准确估算'),
    carbs: metric('carbs','待确认'),
    protein: metric('protein','待确认'),
    fat: metric('fat','待确认'),
    fiber: metric('fiber','待确认'),
    vitamins: metric('vitamins','待确认'),
    sodium: metric('sodium','待确认'),
    sugar: metric('sugar', foodType==='drink'||foodType==='dessert'?'待确认':'不明显'),
    caffeine: metric('caffeine', foodType==='drink'?'待确认':'无'),
    confidence: n.confidence || '粗估',
  };
}

async function searchNutritionCatalog(query){
  const q=String(query||'').trim();
  if(!q) return {status:'empty',items:[]};
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),NUTRITION_LOOKUP_TIMEOUT_MS);
  try{
    const res=await fetch(`${nutritionApiBase()}/nutrition/search?q=${encodeURIComponent(q)}&limit=5`,{signal:controller.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error(`nutrition_search_${res.status}`);
    const data=await res.json();
    return {status:'ok',query:q,sourceCount:data.source_count||0,items:Array.isArray(data.items)?data.items:[]};
  }catch(error){
    clearTimeout(timer);
    return {status:'offline',query:q,error:String(error?.message||error)};
  }
}

function formatNutritionContribution(item, grams){
  const n=item?.nutrition_per_100g || {};
  const scale=Number.isFinite(Number(grams)) && Number(grams)>0 ? Number(grams)/100 : null;
  const value=(key)=>typeof n[key]==='number'?n[key]:Number.isFinite(Number(n[key]))?Number(n[key]):null;
  const format=(key,unit,digits=0)=>{
    const raw=value(key);
    if(raw===null) return '';
    const amount=scale ? raw*scale : raw;
    const rounded=digits ? Math.round(amount*10)/10 : Math.round(amount);
    return `${scale?'约':'每100g '}${rounded}${unit}`;
  };
  return normalizeNutritionContribution({
    calories:format('calories',' kcal'),
    protein:format('protein_g','g',1),
    fat:format('fat_g','g',1),
    carbs:format('carb_g','g',1),
    fiber:format('fiber_g','g',1),
    sodium:format('sodium_mg','mg'),
  });
}

function metricLevel(key,value){
  if(value===null) return '待确认';
  if(key==='calories') return value>=750?'偏高':value>=450?'适中':'偏低';
  if(key==='carbs') return value>=80?'偏高':value>=35?'适中':'偏低';
  if(key==='protein') return value>=35?'偏足':value>=18?'中等':'偏少';
  if(key==='fat') return value>=35?'偏高':value>=12?'中等':'较低';
  if(key==='fiber') return value>=6?'偏足':value>=3?'中等':'偏低';
  if(key==='sodium') return value>=1800?'可能偏高':value>=800?'中等':'较低';
  return '待确认';
}

function mergeNutritionEstimateFromMatches(foods, fallbackEstimate, foodType){
  const fallback=normalizeNutritionEstimate(fallbackEstimate,foodType);
  const totals={calories:0,protein:0,fat:0,carbs:0,fiber:0,sodium:0};
  let knownCount=0;
  foods.forEach(f=>{
    const grams=Number(f.estimatedWeightGrams);
    const n=f._matchedNutrition?.nutrition_per_100g || null;
    if(!n || !Number.isFinite(grams) || grams<=0) return;
    knownCount++;
    totals.calories+=(Number(n.calories)||0)*grams/100;
    totals.protein+=(Number(n.protein_g)||0)*grams/100;
    totals.fat+=(Number(n.fat_g)||0)*grams/100;
    totals.carbs+=(Number(n.carb_g)||0)*grams/100;
    totals.fiber+=(Number(n.fiber_g)||0)*grams/100;
    totals.sodium+=(Number(n.sodium_mg)||0)*grams/100;
  });
  if(!knownCount){
    return {
      ...fallback,
      confidence:'营养库命中 · 份量待确认',
      calories:{...fallback.calories,basis:'营养库已命中标准项，但照片份量不足以可靠换算。'},
    };
  }
  const range=(value,unit,digits=0)=>{
    const low=value*.9, high=value*1.1;
    const round=(x)=>digits?Math.round(x*10)/10:Math.round(x);
    return `约${round(low)}-${round(high)}${unit}`;
  };
  return {
    ...fallback,
    calories:{range:range(totals.calories,' kcal'),level:metricLevel('calories',totals.calories),basis:`${knownCount} 项食物命中营养库，按照片份量换算。`},
    protein:{range:range(totals.protein,'g',1),level:metricLevel('protein',totals.protein),basis:'营养库每100g蛋白质换算。'},
    fat:{range:range(totals.fat,'g',1),level:metricLevel('fat',totals.fat),basis:'营养库每100g脂肪换算。'},
    carbs:{range:range(totals.carbs,'g',1),level:metricLevel('carbs',totals.carbs),basis:'营养库每100g碳水换算。'},
    fiber:{range:range(totals.fiber,'g',1),level:metricLevel('fiber',totals.fiber),basis:'营养库每100g膳食纤维换算。'},
    sodium:{range:range(totals.sodium,'mg'),level:metricLevel('sodium',totals.sodium),basis:'营养库每100g钠含量换算；调味和汤汁仍需反馈校准。'},
    confidence:'营养库换算 · 份量仍需校准',
  };
}

async function hydrateNutritionFromCatalog(analysis){
  const base=normalizeMealAnalysis(analysis);
  const foods=normalizeRecognizedFoods(base.recognizedFoods,base.dish);
  const lookups=await Promise.all(foods.map(f=>searchNutritionCatalog(f.name)));
  const hasOffline=lookups.some(x=>x.status==='offline');
  const sourceCount=Math.max(0,...lookups.map(x=>Number(x.sourceCount)||0));
  const enrichedFoods=foods.map((food,idx)=>{
    const result=lookups[idx];
    const item=result?.items?.find(x=>Number(x.score)>=NUTRITION_LOOKUP_SCORE) || null;
    if(!item){
      return {
        ...food,
        nutritionSource: hasOffline?'nutrition_api_unavailable':'ai_estimate',
        matchedNutritionName:'',
        matchedNutritionId:'',
        matchConfidence:null,
      };
    }
    return {
      ...food,
      nutritionSource:item.nutrition_source || 'nutrition_database',
      matchedNutritionName:item.dish_name,
      matchedNutritionId:item.id || '',
      matchConfidence:Number(item.score),
      nutritionContribution:formatNutritionContribution(item,food.estimatedWeightGrams),
      _matchedNutrition:item,
    };
  });
  const matched=enrichedFoods.filter(f=>f.matchConfidence!==null);
  const updated=matched.length
    ? {
        ...base,
        recognizedFoods:enrichedFoods.map(({_matchedNutrition,...f})=>f),
        nutritionEstimate:mergeNutritionEstimateFromMatches(enrichedFoods,base.nutritionEstimate,base.foodType),
        nutritionSource:'nutrition_database',
        matchedNutritionName:matched[0].matchedNutritionName,
        matchedNutritionId:matched[0].matchedNutritionId,
        matchConfidence:Math.max(...matched.map(f=>f.matchConfidence||0)),
        nutritionDataVersion:sourceCount?`本地营养库 ${sourceCount} 项`:(base.nutritionDataVersion||'本地营养库'),
        nutritionConnectionStatus:'connected',
      }
    : {
        ...base,
        recognizedFoods:enrichedFoods,
        nutritionSource:hasOffline?'nutrition_api_unavailable':'ai_estimate',
        nutritionConnectionStatus:hasOffline?'offline':'no_match',
        nutritionDataVersion:sourceCount?`本地营养库 ${sourceCount} 项`:(base.nutritionDataVersion||'未连接'),
      };
  pendingAnalysis=updated;
  updateAnalysisDetails(updated);
  return updated;
}

// ── 工具函数：调用 OpenAI-compatible 大模型接口 ──────
async function callModel(systemPrompt, userContent, maxTokens=1024, options={}){
  const timeoutMs = options.timeoutMs || 20000;
  const useStream = options.stream === true;
  const baseBody = {
    model: AI_CONFIG.model,
    max_tokens: maxTokens,
    temperature: 0.2,
    messages:[
      { role:'system', content: systemPrompt },
      { role:'user', content: userContent },
    ],
  };
  async function requestJsonMode(useJsonMode){
    const body = useJsonMode ? {...baseBody, response_format:{type:'json_object'}} : baseBody;
    if(useStream) body.stream = true;
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), timeoutMs);
    let res;
    try {
      res = await fetch(AI_CONFIG.endpoint, {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization': `Bearer ${AI_CONFIG.key}`,
        },
        body: JSON.stringify(body),
        signal: controller.signal,
      });
    } catch(e) {
      if(e?.name === 'AbortError'){
        const err = new Error(`Request timeout after ${Math.round(timeoutMs/1000)}s`);
        err.status = 'TIMEOUT';
        throw err;
      }
      const err = new Error(e?.message || 'Network request failed');
      err.status = 'NETWORK';
      throw err;
    } finally {
      clearTimeout(timer);
    }
    if(!res.ok){
      const raw = await res.text().catch(()=>'');
      throw createAIError(res.status, raw);
    }
    if(useStream){
      let fullText = '';
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      try {
        while(true){
          const {done, value} = await reader.read();
          if(done) break;
          const chunk = decoder.decode(value, {stream:true});
          const lines = chunk.split('\n');
          for(const line of lines){
            if(line.startsWith('data:')) {
              const json = line.slice(5).trim();
              if(json === '[DONE]') break;
              try {
                const delta = JSON.parse(json);
                if(delta.choices?.[0]?.delta?.content){
                  fullText += delta.choices[0].delta.content;
                }
              } catch(_){}
            }
          }
        }
      } finally {
        reader.releaseLock();
      }
      return extractJsonObject(fullText);
    }
    const data = await res.json();
    const text = data.choices?.[0]?.message?.content || '';
    return extractJsonObject(text);
  }
  try {
    return await requestJsonMode(aiProvider()==='openai');
  } catch(e) {
    if(!/response_format|json_object|schema/i.test(e.message)) throw e;
    return requestJsonMode(false);
  }
}

// ── 图片转 base64 ──────────────────────────────────────────────────
async function imgToBase64(url){
  // data URL: extract base64 directly, no fetch needed
  if(url.startsWith('data:')) return url.split(',')[1];
  const res = await fetch(url);
  if(!res.ok) throw new Error(`fetch image failed: ${res.status}`);
  const blob = await res.blob();
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function imgMediaType(url){
  if(url.startsWith('data:')) return url.split(';')[0].slice(5);
  return 'image/jpeg';
}

// 压缩图片到 maxPx 最长边，始终输出 JPEG，解决手机大图 400 问题
function compressImage(dataUrl, maxPx=1568, quality=0.85){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, maxPx/Math.max(img.width, img.height));
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror=()=>resolve(dataUrl); // fallback: use original
    img.src=dataUrl;
  });
}

async function aiAnalyzeMeal(imageUrl, userProfile, mealHistory, onProgress){
  if(!aiReady()) return mockAnalysis();

  const historySummary = mealHistory.slice(-5).map(m=>
    `${m.date}${m.type}：${m.dish||m.analysis?.structure}，饭后${m.fb?.comfort||'未记录'}`

  const foodProfileSummary = formatUserFoodProfileSummary(userFoodProfile);
  const puzzleStatus = bodyPuzzleStatus();
  const analysisStartedAt = Date.now();
  const timings = {};
  const timed = async (key, fn)=>{
    const start = Date.now();
    try { return await fn(); }
    finally { timings[key + 'DurationMs'] = Date.now() - start; }
  };

  try {
    onProgress?.('recognition');

      [imageBlock, { type:'text', text: contextBase + '\n\n快速识别这张餐食照片，只返回核心判断。' }],
      280,
      { timeoutMs: phase1TimeLimit }
    ));
    const phase1Result = normalizeMealAnalysis({ ...phase1Raw, _source:'ai', _phase:'partial' });
    onProgress?.('phase1', phase1Result);

    // ── 阶段2：异步后台完成，10秒总超时 ──
    const remainingTime = Math.max(2000, 10000 - (Date.now() - analysisStartedAt));
    const phase2Promise = timed('phase2', ()=>callModel(
      PROMPT_MEAL_ANALYSIS,
      [imageBlock, {
        type:'text',
        text:`${contextBase}\n身体拼图状态：${puzzleStatus}\n当前状态：${todayState||'未填写'}\n\n第一阶段识别结果：菜品《${phase1Raw.dish||'见照片'}》，分类：${phase1Raw.foodType||'unknown'}，结构：${phase1Raw.structure||'未知'}。\n\n请基于上述识别结果，补全营养估算、食物组成和饮食建议，返回完整 JSON。`
      }],
      900,
      { timeoutMs: remainingTime }
    )).catch(()=>null); // Phase2 失败不影响，返回 null

    // 立即返回 Phase1 结果，不等 Phase2
    const result = normalizeMealAnalysis({...phase1Raw, _source:'ai'});
    result.analysisMeta = buildAnalysisMeta('success', null, analysisStartedAt, timings, 'meal-analysis-phase1-only-v1.0');

    // Phase2 异步更新（不阻塞主流程）
    phase2Promise.then(phase2Raw => {
      if(phase2Raw){
        const merged = normalizeMealAnalysis({
          ...phase2Raw,
          dish: phase1Raw.dish || phase2Raw.dish,
          foodType: phase1Raw.foodType || phase2Raw.foodType,
          structure: phase1Raw.structure || phase2Raw.structure,
          risk: phase1Raw.risk || phase2Raw.risk,
          tags: (phase1Raw.tags?.length ? phase1Raw.tags : phase2Raw.tags),
          detail: (phase1Raw.detail?.length ? phase1Raw.detail : phase2Raw.detail),
          advice: phase1Raw.advice || phase2Raw.advice,
          _source: 'ai',
        });
        merged.analysisMeta = buildAnalysisMeta('success', null, analysisStartedAt, timings, 'meal-analysis-two-stage-v1.0');
        pendingAnalysis = merged;
        // Phase2 会补全标题、风险、营养和建议，必须整块刷新，避免顶部摘要和详情卡不一致。
        if(curScreen === 'camera' && document.getElementById('analysis-area')){
          showInlineResult(false);
          setTimeout(() => enableEditableAnalysis(), 400);
        } else {
          updateAnalysisDetails(merged);
        }
        console.log('Phase2 异步完成，已自动更新详情');
      }
    });

    return result;
  } catch(e) {
    console.error('AI分析失败:', e);
    rememberAIError(e);
    renderAnalysisFailure(e);
    return null;
  }
}

function buildAnalysisMeta(status, failureStep, startedAt, timings, pipelineVersion='meal-analysis-three-step-v0.3'){
  const completedAt = Date.now();
  return {
    analysisId: 'analysis_' + startedAt,
    pipelineVersion,
    modelProvider: aiProvider(),
    visionModel: AI_CONFIG.model,
    startedAt: new Date(startedAt).toISOString(),
    completedAt: new Date(completedAt).toISOString(),
    totalDurationMs: completedAt - startedAt,
    status,
    failureStep,
    promptVersions:{recognition:'v0.3',nutrition:'v0.3',advice:'v0.3'},
    ...timings,
  };
}

function mergeFoodNutritionContributions(recognitionFoods, nutritionFoods){
  const source = normalizeRecognizedFoods(recognitionFoods, '这一餐');
  const byName = {};
  toArray(nutritionFoods).forEach(f=>{
    if(f?.name) byName[f.name] = f;
  });
  return source.map(f=>{
    const hit = byName[f.name] || {};
    return {
      ...f,
      nutritionContribution: normalizeNutritionContribution(hit.nutritionContribution || hit.nutrition || f.nutritionContribution),
    };
  });
}

const DISH_MAP = {
  '蛋白质足+搭配均衡': ['鸡胸肉饭','番茄鸡蛋面','清蒸鱼+米饭','牛肉炒饭'],

  '高油+易困倦':       ['炸鸡饭','麻辣烫','油炸外卖','汉堡套餐'],
  '低负担':            ['鸡胸肉沙拉','清汤面','蒸蔬菜+蛋','轻食沙拉碗'],
  '探索':              ['泰式柠檬鸡','越南春卷','日式定食','韩式拌饭'],
};
function tagsToDish(tags){
  const key = Object.keys(DISH_MAP).find(k=>tags.some(t=>k.includes(t)));
  const list = key ? DISH_MAP[key] : DISH_MAP['低负担'];
  return list[Math.floor(Math.random()*list.length)];

// 计算距今天数（用记录序号模拟）
function daysSince(mealIdx){
  const diff = meals.length - 1 - mealIdx;
  if(diff===0) return '今天';
  if(diff===1) return '昨天';
  return `${diff} 天前`;
}

// ── 状态感知卡池构建 ──────────────────────────────────────────────────────────
// 三槽位：常规款 / 特别款 / 隐藏款（Pop Mart 盲盒风格）
// 三阶段质量：general（通用）/ feedback（反馈）/ body_puzzle（身体谜题）
// 过滤和加权都基于用户历史反馈，不依赖外部标签库
function buildCardPoolForState(state){
  const stage = currentRecommendationStage || 'general';
  const withFb = meals.filter(m=>m.fb && m.fb.comfort);

  // ── 洞察驱动的加权和过滤（替代散落的硬编码规则）──
  const _insights = (typeof deriveInsights === 'function') ? deriveInsights(meals, 1) : [];
  const _preferTargets = new Set(_insights.filter(i=>i.category==='preference' && i.maturity==='mature').map(i=>i.target));
  const _avoidTargets  = new Set(_insights.filter(i=>i.category==='avoid'      && i.maturity==='mature').map(i=>i.target));
  const _reactionTriggers = _insights
    .filter(i=>i.category==='reaction' && i.maturity==='mature')
    .flatMap(i=>i.triggers||[])
    .filter(t=>t && t!=='午饭');

  function mealScore(m){
    let s = 0;
    const mood = m.fb.mood;
    const tags = m.analysis?.tags||[];
    const cnt = meals.filter(x=>x.dish===m.dish).length;
    if(comfortHas(m.fb.comfort,'舒服','有精神')) s+=3;
    if(comfortHas(m.fb.comfort,'困倦','胀气')) s-=2;
    if(mood==='满足') s+=2;
    if(mood==='后悔') s-=2;
    switch(state){
      case '压力有点大': s+=cnt*2; break;
      case '很累很困':   if(comfortHas(m.fb.comfort,'有精神')) s+=3; break;
      case '想吃点清淡': if(tags.some(t=>t.includes('少油')||t.includes('蛋白质足'))) s+=2; break;
      case '想吃点好的': case '心情不错': if(mood==='满足') s+=2; break;
    }
    // 洞察驱动加权：preference 大幅加分；reaction 触发词降分
    if(m.cuisine && _preferTargets.has(m.cuisine)) s += 5;
    if(_reactionTriggers.length && tags.some(t=>_reactionTriggers.some(r=>t.includes(r)||r.includes(t)))) s -= 3;
    return s;
  }

  function passFilter(m){
    const tags = m.analysis?.tags||[];
    // 洞察硬过滤：mature avoid 类菜系直接剔除
    if(m.cuisine && _avoidTargets.has(m.cuisine)) return false;
    if(state==='想吃点清淡'){
      if(tags.some(t=>t.includes('高油')||t.includes('主食偏多')||t.includes('易困倦'))) return false;
    }
    if(state==='很累很困'){
      if(comfortHas(m.fb.comfort,'困倦')) return false;
      if(tags.some(t=>t.includes('高油')||t.includes('易困倦'))) return false;
    }
    return true;
  }

  // 按过滤+评分排序，按菜名去重
  const seen = new Set();
  const candidates = withFb.filter(passFilter)
    .sort((a,b)=>mealScore(b)-mealScore(a))
    .filter(m=>{ if(seen.has(m.dish)) return false; seen.add(m.dish); return true; });

  const s1 = candidates[0];
  const s2 = candidates.find(m=>m.dish!==s1?.dish);

  function makeReason(m){
    if(!m) return null;
    const cnt = meals.filter(x=>x.dish===m.dish).length;
    const lastIdx = meals.map((x,i)=>x.dish===m.dish?i:-1).filter(i=>i>=0).pop()||0;
    const last = daysSince(lastIdx);
    // body_puzzle 阶段：优先引用 deriveInsights mature 条目（数据血缘，杜绝编造）
    if(stage==='body_puzzle'){
      // 1) 如果命中 preference 类 insight，引用该洞察
      const matchPref = _insights.find(i=>i.category==='preference' && i.maturity==='mature' && i.target===m.cuisine);
      if(matchPref){
        return `「${m.cuisine}」是你的稳定偏好，${matchPref.evidence.sampleSize} 次都让你状态好`;
      }
      // 2) 如果是 state 匹配的 reaction 类反例（如"很累很困"+ 无困倦反应的菜），引用洞察反推
      if(state==='很累很困'){
        const sleepyIns = _insights.find(i=>i.category==='reaction' && i.outcome==='困倦' && i.maturity==='mature');
        if(sleepyIns){
          const tags=m.analysis?.tags||[];
          const safe = !sleepyIns.triggers.some(t=>tags.some(x=>x.includes(t)||t.includes(x)));
          if(safe) return `避开了你已识别的"${sleepyIns.angle}"触发词，疲惫时安全`;
        }
      }
      // 3) 回退到原 body_puzzle 逻辑
      const comfortCnt = meals.filter(x=>x.dish===m.dish&&comfortHas(x.fb?.comfort,'舒服','有精神')).length;
      if(state==='压力有点大') return cnt>=2?`吃过 ${cnt} 次，${comfortCnt} 次身体舒服，压力大时这个最稳`:`上次${last}吃完${comfortText(m.fb.comfort)}，状态有记录`;
      if(state==='很累很困')   return comfortHas(m.fb.comfort,'有精神')?`身体记录：吃完精力回来了 ${comfortCnt} 次，疲惫首选`:`${cnt} 次记录，没有困倦反馈，安全`;
      if(state==='想吃点清淡') return `${cnt} 次记录均无不适，清淡方向历史稳定`;
      return `${cnt} 次记录，${comfortCnt} 次身体舒服，综合评分高`;
    }
    // feedback 阶段：基于反馈数据
    if(stage==='feedback'){
      if(state==='压力有点大') return cnt>=2?`吃过 ${cnt} 次，每次都${comfortText(m.fb.comfort)}，压力大选熟悉的更稳`:`上次吃是${last}，吃完${comfortText(m.fb.comfort)}`;
      if(state==='很累很困')   return comfortHas(m.fb.comfort,'有精神')?`上次吃完你精力不错，疲惫时这个靠谱`:`吃完${comfortText(m.fb.comfort)}，不会加重困意`;
      if(state==='想吃点清淡') return `上次是${last}，吃完${comfortText(m.fb.comfort)}，清淡方向适合现在`;
      if(state==='想吃点好的'||state==='心情不错') return `吃了 ${cnt} 次${m.fb.mood==='满足'?'，每次都满足':''}`;
      return `吃了 ${cnt} 次，上次${last}，吃完${comfortText(m.fb.comfort)}`;
    }
    // general 阶段（不应走到这里，因为 withFb 为空）
    return null;
  }

  const fallback = {

function renderCardDraw(){
  cardIdx = 0;
  cardPhase = 'draw';
  drawnCard = null;
  todayState = '';

      {val:'心情不错',emoji:'😊'},
      {val:'很累很困',emoji:'😴'},
      {val:'想吃点好的',emoji:'🤤'},
      {val:'想吃点清淡',emoji:'🥗'},
      {val:'随便都行',emoji:'🤷'},

      <button onclick="selectState('${s.val}',this)" style="

      </button>`).join('')}

  <div id="card-area" style="display:none">

function selectState(val, btn){
  todayState = val;
  document.querySelectorAll('#state-grid button').forEach(b=>{
    b.style.borderColor='var(--border)';
    b.style.background='var(--white)';
    b.style.color='var(--ink60)';
  });
  btn.style.borderColor='var(--accent)';
  btn.style.background='var(--accent-s)';
  btn.style.color='var(--accent)';
  setTimeout(()=>{
    cardPool = buildCardPoolForState(todayState);
    cardStates = {};
    const area = document.getElementById('card-area');
    area.style.display='block';
    area.scrollIntoView({behavior:'smooth',block:'start'});
    const hint = document.getElementById('three-cards-hint');
    const _stageLabel = currentRecommendationStage==='body_puzzle'?'身体阶段':currentRecommendationStage==='feedback'?'反馈阶段':'通用阶段';
    if(hint) hint.textContent = currentRecommendationStage==='general'
      ? `通用阶段 · 基于状态推荐（记录 3 餐后升级至反馈阶段）`
      : `${_stageLabel} · 基于 ${currentFeedbackCount} 餐记录 × 当前状态生成`;
    renderThreeCardsInArea();
    refreshCardsFromAIByState();
  }, 200);
}

function refreshCardsFromAIByState(){
  if(!aiReady()) return;
  const hint = document.getElementById('three-cards-hint');
  if(hint) hint.textContent = 'AI 正在结合状态和历史生成推荐…';
  aiGenerateCards(meals, profile, todayState).then(aiCards=>{
    if(!aiCards || !aiCards.length) return;
    cardPool = aiCards.slice(0, 3);
    cardStates = {};
    activeSheetIdx = -1;
    renderThreeCardsInArea();
    if(hint) hint.textContent = `AI 已参考 ${meals.length} 餐记录和当前状态`;
    toast('AI 已生成餐前建议卡');
  }).catch(e=>{
    console.warn('AI卡池刷新失败:', e.message);
  });
}

      return `<div onclick="openCardSheet(${i})" style="
          flex:1;min-width:0;height:200px;border-radius:var(--r);cursor:pointer;

          flex:1;min-width:0;border-radius:var(--r);

// 点击暗牌 → 翻开 Sheet

  const stage = recommendationStageMeta(c);
  c.recommendationStage = stage.key;
  c.recommendationStageLabel = stage.label;

// 关闭 Sheet（点遮罩 or 换一张）
function closeCardSheet(){
  document.getElementById('card-sheet-overlay').style.display = 'none';
  document.getElementById('card-sheet').style.display = 'none';
  activeSheetIdx = -1;
}

// 采纳某张卡 → 跳转拍照页
function selectThisCard(idx){
  closeCardSheet();
  drawnCard = cardPool[idx];
  drawnCard._adoptedAt = Date.now();
  recordCardAction(drawnCard, 'accepted');
  renderCameraShoot(drawnCard);
}

// 不选了 → 把已看过的卡记为 skipped，返回首页
function skipCardDraw(){
  Object.keys(cardStates).forEach(i => {
    if(cardStates[i] === 'seen' && cardPool[i]){
      recordCardAction(cardPool[i], 'skipped');
    }
  });
  drawnCard = null;
  closeCardSheet();
  show('home');
}

// 兼容旧引用
function acceptCard(){ if(activeSheetIdx >= 0) selectThisCard(activeSheetIdx); }
function skipCard(){ skipCardDraw(); }
function flipCard(){ openCardSheet(0); }

function recordCardAction(card, action){
  try{
    const history = JSON.parse(localStorage.getItem('card_actions')||'[]');
    history.push({
      dish: card.dish,
      badge: card.badge||'',
      risk: card.risk||'',
      slot: card.slot||'',
      slotLabel: card.slotLabel||'',
      cardState: todayState||'',
      recommendationStage: card.recommendationStage||recommendationStageKey(card),
      recommendationStageLabel: card.recommendationStageLabel||recommendationStageMeta(card).label,
      recommendationReason: card.recommendationReason||card.reason||'',
      recommendationSources: card.recommendationSources||recommendationStageMeta(card).sources,
      unlockRequirement: card.unlockRequirement||recommendationStageMeta(card).unlock,
      confidenceLevel: card.confidenceLevel||recommendationStageMeta(card).confidence,
      action,
      ts: Date.now(),
    });
    localStorage.setItem('card_actions', JSON.stringify(history.slice(-50)));
  }catch(_){}
}

// 统计卡片推荐命中率（供洞察页使用）
function getCardAcceptanceRate(){
  try{
    const history = JSON.parse(localStorage.getItem('card_actions')||'[]');
    if(!history.length) return null;
    const accepted = history.filter(h=>h.action==='accepted').length;
    return { total: history.length, accepted, rate: Math.round(accepted/history.length*100) };
  }catch(_){ return null; }
}

function guessMealType(){
  const h=new Date().getHours();
  if(h>=5&&h<10) return '早饭';
  if(h>=10&&h<14) return '午饭';
  if(h>=14&&h<17) return '加餐';
  if(h>=17&&h<21) return '晚饭';
  return '加餐';
}

function handleMealImageFile(file, fromHome){
  const previewUrl=URL.createObjectURL(file);
  if(fromHome || curScreen!=='camera'){

    show('camera');
  }
  renderSelectedMealPreview(previewUrl);
  const reader=new FileReader();
  reader.onloadend=()=>{ wideImg=reader.result; startInlineAnalyze(); };
  reader.onerror=()=>{ wideImg=previewUrl; startInlineAnalyze(); };
  reader.readAsDataURL(file);
}

function startInlineAnalyze(){
  renderAnalysisProgress('recognition');
  pendingMealType=camMealType;
  if(wideImg && aiReady()){
    aiAnalyzeMeal(wideImg, profile, meals, (step, data)=>{
      if(step === 'phase1' && data){
        // 阶段1完成：立刻展示核心结果，卡片区域显示骨架屏
        pendingAnalysis = data;
        showInlineResult(true);
      } else if(step === 'phase2'){
        // 阶段2后台运行，进度条静默推进
        renderAnalysisProgress('phase2');
      } else {
        renderAnalysisProgress(step);
      }
    }).then(result=>{
      if(result){
        // 阶段2完成：用真实数据替换骨架屏，无滚动跳动
        pendingAnalysis = result;
        updateAnalysisDetails(result);
        setTimeout(() => enableEditableAnalysis(), 800);
      }
    });
  } else {
    pendingAnalysis = mockAnalysis();
    setTimeout(() => {
      showInlineResult(true);
      setTimeout(() => enableEditableAnalysis(), 1600);
    }, 1600);
  }
}

function shortAIErrorMessage(error){
  const msg = String(error?.message || error || '真实 AI 分析暂时失败');
  const status = error?.status || '';
  if(status === 'NETWORK' || /Failed to fetch|NetworkError|Load failed|network/i.test(msg))
    return !navigator.onLine ? '当前无网络连接，请检查网络后重试。' : '网络请求失败，请检查网络连接后重试。';
  if(status === 'TIMEOUT' || /timeout/i.test(msg)) return '请求超时（模型响应过慢），请重试或换用更快的模型。';
  if(/API error 401|unauthorized|invalid api key/i.test(msg)) return 'Key 无效或无权限，请检查 API Key。';
  if(/API error 400|model|vision|image/i.test(msg)) return '模型或图片识别参数不匹配，请换一个支持视觉的模型。';
  if(/API error 429|rate limit|quota/i.test(msg)) return '额度或并发受限，请稍后重试或换 Key。';
  if(/API error 500|unknown error|server/i.test(msg)) return '模型服务端返回异常，请重试或换一个视觉模型。';
  return msg.slice(0,120);
}

function mealCommentText(a){
  const raw = (a.structure || '').trim();
  if(raw) return raw;
  const tags = Array.isArray(a.tags) ? a.tags.filter(Boolean) : [];
  if(tags.length) return `这餐重点是${tags.slice(0,2).join('、')}，先按结构判断，营养库会继续校准标准营养事实。`;
  return '这餐已完成结构识别，先按当前照片和食物组成给出饭前判断。';
}

function nutritionFlags(n){
  const flags=[];
  if(n.vitamins && !['待确认','中等'].includes(n.vitamins.level)) flags.push(`维生素 ${n.vitamins.level} · ${n.vitamins.range}`);
  if(n.sodium && !['待确认','中等'].includes(n.sodium.level)) flags.push(`盐分 ${n.sodium.level} · ${n.sodium.range}`);
  if(n.sugar && !['待确认','不明显','较低'].includes(n.sugar.level)) flags.push(`糖 ${n.sugar.level} · ${n.sugar.range}`);
  if(n.caffeine && n.caffeine.level!=='无' && n.caffeine.level!=='待确认') flags.push(`咖啡因 ${n.caffeine.level} · ${n.caffeine.range}`);
  return flags.slice(0,4);
}

const NUTRIENT_LABELS = {
  calories:'热量',
  protein:'蛋白质',
  fat:'脂肪',
  carbs:'碳水',
  fiber:'纤维',
  sodium:'盐分',
  sugar:'糖',
  caffeine:'咖啡因',
};

function nutritionSourceMeta(a){
  const source = a?.nutritionSource || a?.nutrition_source || 'nutrition_lookup_pending';
  const confidenceRaw = Number(a?.matchConfidence ?? a?.match_confidence);
  const confidence = Number.isFinite(confidenceRaw) ? confidenceRaw : null;
  const matched = a?.matchedNutritionName || a?.matched_nutrition_name || a?.dish || '标准食物项';
  const version = a?.nutritionDataVersion || a?.nutrition_data_version || '2026-05';
  if(source === 'vector_matched' || source === 'manual_phase1_dish_overlay' || source === 'nutrition_database'){
    const confidenceText = confidence !== null ? ` · 匹配 ${Math.round(confidence*100)}%` : '';
    return {
      source,
      label:'营养库匹配',
      title:`匹配营养库：${matched}${confidenceText}`,
      description:'AI 先识别食物和大致份量，营养库提供每 100g 标准营养事实，再按照片份量估算本餐范围。',
      version,
      color:'var(--green)',
      bg:'var(--green-s)',
      panelBg:'rgba(44,122,82,.08)',
      border:'rgba(44,122,82,.22)'
    };
  }
  if(source === 'nutrition_lookup_pending'){
    return {
      source,
      label:'连接营养库',
      title:'正在连接真实营养库',
      description:'原型会调用本地 FastAPI /v1/nutrition/search，用真实营养库候选校准 AI 识别结果。',
      version,
      color:'var(--accent)',
      bg:'var(--accent-s)',
      panelBg:'var(--accent-s)',
      border:'rgba(232,93,38,.2)'
    };
  }
  if(source === 'nutrition_api_unavailable'){
    return {
      source,
      label:'营养库未连接',
      title:'真实营养库接口暂不可用',
      description:'请启动本地 FastAPI 并配置营养数据目录；当前只保留 AI 结构估算，不假装已命中营养库。',
      version,
      color:'var(--amber)',
      bg:'rgba(210,139,25,.12)',
      panelBg:'rgba(210,139,25,.08)',
      border:'rgba(210,139,25,.24)'
    };
  }
  if(source === 'needs_user_confirmation'){
    return {
      source,
      label:'待确认',
      title:'营养库暂不能可靠换算',
      description:'菜名、规格、糖度或份量缺少关键条件，先展示结构判断；用户修正后再提高营养估算可信度。',
      version,
      color:'var(--amber)',
      bg:'rgba(210,139,25,.12)',
      panelBg:'rgba(210,139,25,.08)',
      border:'rgba(210,139,25,.24)'
    };
  }
  return {
    source,
    label:'AI估算',
    title:'未命中稳定营养库项',
    description:'当前结果主要来自 AI 对照片的结构估算，只适合做饮食决策参考，不作为精确热量或营养计算。',
    version,
    color:'var(--ink60)',
    bg:'var(--cream)',
    panelBg:'var(--cream)',
    border:'var(--border)'
  };
}

function foodNutritionMeta(food, mealMeta){
  const source = food.nutritionSource || mealMeta.source;
  const confidence = food.matchConfidence !== null ? ` · ${Math.round(food.matchConfidence*100)}%` : '';
  if(source === 'vector_matched' || source === 'manual_phase1_dish_overlay' || source === 'nutrition_database'){
    return {text:`营养库：${food.matchedNutritionName || food.name}${confidence}`, color:'var(--green)'};
  }
  if(source === 'needs_user_confirmation'){
    return {text:'规格/份量待确认，暂不做精确换算', color:'var(--amber)'};
  }
  if(source === 'nutrition_lookup_pending'){
    return {text:'正在查询真实营养库', color:'var(--accent)'};
  }
  if(source === 'nutrition_api_unavailable'){
    return {text:'营养库未连接，先按 AI 粗估', color:'var(--amber)'};
  }
  return {text:'未命中标准项，先按 AI 粗估', color:'var(--ink30)'};
}

    </div>
    <div style="background:${meta.panelBg};border:1px solid ${meta.border};border-radius:12px;padding:10px 12px;margin-bottom:10px">
      <p style="font-size:12px;font-weight:800;color:${meta.color};line-height:1.5">${meta.title}</p>

    <div style="display:flex;flex-direction:column">
      ${rows.map((r,i)=>`<div style="display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-top:${i?'1px solid var(--border)':'none'}">
        <div>
          <p style="font-size:15px;font-weight:800;color:var(--ink)">${r.name}</p>
          <p style="font-size:12px;color:var(--ink60);margin-top:3px">${r.basis}</p>
          <p style="font-size:10px;color:var(--ink30);margin-top:4px">${r.source}</p>
        </div>
        <p style="font-size:13px;font-weight:800;color:var(--accent);text-align:right">${r.amount}</p>
      </div>`).join('')}
    </div>
  </div>`;
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}

function confidenceText(v){
  if(v==='high') return '较确定';
  if(v==='low') return '不确定';
  return '粗估';
}

function recognitionRowsForType(a){
  const foodType = normalizeFoodType(a.foodType);
  const fields = {...defaultTypeFields(foodType, a), ...(a.typeFields || {})};
  return (FOOD_TYPE_FIELDS[foodType] || FOOD_TYPE_FIELDS.unknown)
    .map(([key,label,fallback])=>[label, fields[key] || fallback, `typeFields.${key}`]);
}

function inferDishFromAnalysis(a){
  if(a.tags?.includes('高油')) return '麻辣香锅';
  if(a.tags?.includes('蛋白质足')) return '白切鸡饭';
  return '黄焖鸡米饭';
}

function editRecognition(key,label){
  const el=document.getElementById('rec-'+key);
  if(!el) return;
  const current=el.textContent||'';
  const next=prompt(`修改${label}`, current);
  if(!next || next===current) return;
  el.textContent=next;
  // 存 diff：保留 AI 原始值 + 用户修正值 + 时间戳
  const corrections = pendingAnalysis.corrections || {};
  corrections[key] = { ai_value: corrections[key]?.ai_value ?? current, user_value: next, ts: Date.now() };
  pendingAnalysis.corrections = corrections;
  if(key==='dish') pendingAnalysis.dish=next;
  if(key==='scene') pendingAnalysis.scene=next;
  if(key==='cuisine') pendingAnalysis.cuisine=next;
  if(key==='province') pendingAnalysis.province=next;
  if(key==='foodType'){
    const found=Object.entries(FOOD_TYPE_LABELS).find(([k,v])=>k===next||v===next);
    pendingAnalysis.foodType=found?found[0]:'unknown';
    pendingAnalysis.typeFields=defaultTypeFields(pendingAnalysis.foodType,pendingAnalysis);
    showInlineResult();
  }
  if(key.startsWith('typeFields.')){
    const field=key.split('.')[1];
    pendingAnalysis.typeFields={...(pendingAnalysis.typeFields||{}),[field]:next};
  }
}
function findMealById(id){
  return meals.find(x=>String(x.id)===String(id));
}

function ensurePendingMealRecord(){
  if(window._backfillMealId) return findMealById(window._backfillMealId);
  const startedAt=mealStartedAt||Date.now();
  const analysis=normalizeMealAnalysis(pendingAnalysis||mockAnalysis());
  pendingAnalysis=analysis;
  const cuisine=analysis.cuisine
    ? {cuisine:analysis.cuisine, province:analysis.province||'全国'}
    : drawnCard
      ? CUISINE_MAP[drawnCard.dish]||{cuisine:drawnCard.cuisine||'家常菜',province:drawnCard.province||'全国'}
      : {cuisine:'家常菜',province:'全国'};
  const existing=activePendingMealId?findMealById(activePendingMealId):null;
  if(existing && !existing.fb){
    existing.type=pendingMealType;
    existing.dish=getMealDisplayTitle(analysis);
    existing.cuisine=cuisine.cuisine;
    existing.province=cuisine.province;
    existing.analysis=analysis;
    existing.analysisMeta=analysis.analysisMeta;
    existing.wideImg=wideImg||existing.wideImg||null;
    existing.startedAt=existing.startedAt||startedAt;
    existing.mealStartedAt=existing.mealStartedAt||startedAt;
    existing.ts=existing.ts||startedAt;
    existing.status='pending';
    if(currentUser) saveUserMeals(meals);
    return existing;
  }
  const m={
    id:startedAt,
    date:DAYS[meals.length%7],
    type:pendingMealType,
    dish:getMealDisplayTitle(analysis),
    cuisine:cuisine.cuisine,
    province:cuisine.province,
    analysis,
    analysisMeta:analysis.analysisMeta,
    fb:null,
    wideImg,
    ts:startedAt,
    startedAt,
    mealStartedAt:startedAt,
    status:'pending',
    state:todayState,
    fromCard: drawnCard ? {
      dish:drawnCard.dish,
      badge:drawnCard.badge||'',
      risk:drawnCard.risk||'',
      recommendationStage:drawnCard.recommendationStage||recommendationStageKey(drawnCard),
      recommendationStageLabel:drawnCard.recommendationStageLabel||recommendationStageMeta(drawnCard).label,
      recommendationReason:drawnCard.recommendationReason||drawnCard.reason||'',
      recommendationSources:drawnCard.recommendationSources||recommendationStageMeta(drawnCard).sources,
      unlockRequirement:drawnCard.unlockRequirement||recommendationStageMeta(drawnCard).unlock,
      confidenceLevel:drawnCard.confidenceLevel||recommendationStageMeta(drawnCard).confidence
    } : null,
  };
  meals.push(m);
  activePendingMealId=m.id;
  if(currentUser) saveUserMeals(meals);
  return m;
}

function openFeedbackForMeal(mealId){
  const m=findMealById(mealId);if(!m)return;
  activePendingMealId=m.id;
  pendingAnalysis=m.analysis||null;
  pendingMealType=m.type||guessMealType();
  pendingAdditionals=m.additionals||[];
  wideImg=m.wideImg||null;
  mealEatingStarted=true;
  mealStartedAt=m.mealStartedAt||m.startedAt||m.ts||Date.now();
  startAutoCloseTimer();
  renderFeedback();
  show('feedback');
}

function openHistoryToMeal(mealId){
  historyTargetMealId=mealId;
  historyView='calendar';
  calendarMealFilter='全部';
  calendarFilterOpen=false;
  renderHistory();
  show('history');
}

function goFeedback(){
  mealEatingStarted=true;
  mealStartedAt=Date.now();
  ensurePendingMealRecord();
  startAutoCloseTimer();
  renderFeedback();
  show('feedback');
}

function startAutoCloseTimer(){
  clearAutoCloseTimer();
  autoCloseTimer=setTimeout(()=>{
    if(!pendingAnalysis) return;
    const m=ensurePendingMealRecord();
    if(m){
      m.autoClosedAt=new Date().toISOString();
      m.status='pending';
    }
    if(currentUser) saveUserMeals(meals);

// ── 餐后对比分析（两图发给模型）────────────────────────────────────
async function aiAnalyzeLeftover(beforeImg, afterImg, originalAnalysis){
  if(!aiReady() || !beforeImg || !afterImg) return null;
  try {
    const [b64Before, b64After] = await Promise.all([
      compressImage(beforeImg, 768, 0.75).then(c=>imgToBase64(c)),
      compressImage(afterImg, 768, 0.75).then(c=>imgToBase64(c)),
    ]);
    const n = normalizeNutritionEstimate(originalAnalysis.nutritionEstimate, originalAnalysis.foodType);
    const foods = normalizeRecognizedFoods(originalAnalysis.recognizedFoods, originalAnalysis.dish).slice(0,3);
    const foodList = foods.map(f=>f.name).join('、') || originalAnalysis.dish || '这一餐';
    const foodTypeLabel = originalAnalysis.foodType==='drink' ? '饮品' : '餐食';
    const ctx = `【食物信息】餐前识别为：${foodList}（类型：${foodTypeLabel}）。结构描述：${originalAnalysis.structure||'未知'}。
【两张图说明】这两张图拍的是同一${foodTypeLabel}的开始前和结束后，不存在其他食物。
【餐前营养基准】热量${n.calories.range}，碳水${n.carbs.range}，蛋白${n.protein.range}，脂肪${n.fat.range}。请以此为基准，按实际消耗比例推算实际摄入量。`;
    return await callModel(
      PROMPT_LEFTOVER_COMPARE,
      [
        { type:'image_url', image_url:{ url:`data:image/jpeg;base64,${b64Before}` } },
        { type:'text', text:'（第一张：餐前照片）' },
        { type:'image_url', image_url:{ url:`data:image/jpeg;base64,${b64After}` } },
        { type:'text', text:`（第二张：餐后/剩余照片）\n${ctx}` },
      ],
      300,
      { timeoutMs: 14000 }
    );
  } catch(e){
    console.error('餐后对比分析失败:', e);
    return null;
  }
}

function intakeRatioInfo(value){
  const map={
    '全吃完':  {ratio:1.0, label:'全吃完'},
    '一半左右':{ratio:0.5, label:'一半左右'},
    '只吃一点':{ratio:0.2, label:'只吃一点'},
    // 兼容旧 4 档数据
    '吃了3/4': {ratio:.75, label:'吃了 3/4'},
    '吃了一半':{ratio:.5,  label:'吃了一半'},
    '剩很多':  {ratio:.25, label:'剩很多'},
  };
  return map[value] || {ratio:1, label:'饭前估算'};
}
function ratioToActualIntake(r){
  if(r >= 0.88) return '全吃完';
  if(r >= 0.35) return '一半左右';
  return '只吃一点';
}
function autoSelectActualIntake(intakeRatio){
  // 若用户已手选（autoFilled === false 且 actualIntake 已设），不覆盖
  if(scores.actualIntake && scores.actualIntakeAutoFilled === false) return;
  const val = ratioToActualIntake(intakeRatio);
  const row = document.getElementById('row-actualIntake');
  if(!row) return;
  row.querySelectorAll('.score-btn').forEach(b=>b.classList.remove('sel'));
  const btn = [...row.querySelectorAll('.score-btn')].find(b=>b.textContent.trim()===val);
  if(btn){ btn.classList.add('sel'); }
  scores.actualIntake = val;
  scores.actualIntakeRatio = intakeRatioInfo(val).ratio;
  scores.actualIntakeAutoFilled = true;
  // 显示 AI 回填标签
  const lbl = document.getElementById('actualIntake-ai-label');
  if(lbl) lbl.style.display = 'inline';
  checkCanSubmit();
}
async function updatePostMealEstimate(){
  // 反馈页内不再弹卡片；AI 在后台对比，结果存入 actualIntakeAnalysis / scores，
  // 同时秒级回填 actualIntake 档位（用户可覆盖）。详细数据进入提交后的总结页。
  if(!(leftoverImg && wideImg && aiReady())) return;
  const result = await aiAnalyzeLeftover(wideImg, leftoverImg, pendingAnalysis);
  if(!result) return;
  actualIntakeAnalysis = result;
  scores.afterPhotoIntakeRatio = typeof result.intakeRatio==='number' ? result.intakeRatio : null;
  scores.consumedItems = result.consumedItems || null;
  if(typeof result.intakeRatio === 'number') autoSelectActualIntake(result.intakeRatio);
  checkCanSubmit();
}

function personalizedFollowUpQuestion(analysis){
  const dish = analysis?.dish;
  const tags = analysis?.tags || [];
  // 优先级 1：首次记录这道菜 → 合口味吗（DishScore 核心数据，只有一次机会）
  const isFirstTime = dish && !meals.some(m => m.dish === dish && m.fb);
  if(isFirstTime){
    const s = QUESTION_SCHEMA.taste;
    return {key:'taste', label:s.label, opts:s.options.map(o=>o.text), skippable:true};
  }
  // 优先级 2：上次吃这道菜有不适 → 今天有没有同样感觉
  const pastDiscomfort = dish && meals.filter(m =>
    m.dish === dish && m.fb && (
      (Array.isArray(m.fb.comfort) ? m.fb.comfort.some(c=>['胀气','困倦'].includes(c)) : ['胀气','困倦'].includes(m.fb.comfort))
    )
  );
  if(pastDiscomfort && pastDiscomfort.length >= 1){
    const s = QUESTION_SCHEMA.repeatDiscomfort;
    return {key:'repeatDiscomfort', label:s.label, opts:s.options.map(o=>o.text), skippable:true};
  }
  // 优先级 3：碳水偏高 → 困不困（个人碳水敏感度模型）
  if(tags.some(t => t.includes('高碳') || t.includes('主食偏多') || t.includes('碳水'))){
    const s = QUESTION_SCHEMA.sleepiness;
    return {key:'sleepiness', label:s.label, opts:s.options.map(o=>o.text), skippable:true};
  }
  return null;
}

function postMealFeedbackQuestions(analysis){
  const followUp = personalizedFollowUpQuestion(analysis);
  const q = QUESTION_SCHEMA;
  return [
    {key:'actualIntake', label:q.actualIntake.label, opts:q.actualIntake.options.map(o=>o.text), aiAutoFill:true},
    {key:'fullness',     label:q.fullness.label,     opts:q.fullness.options.map(o=>o.text)},
    {key:'comfort',      label:q.comfort.label,      opts:q.comfort.options.map(o=>o.text), multi:true},
    {key:'satisfaction', label:q.satisfaction.label, opts:q.satisfaction.options.map(o=>o.text)},
    ...(followUp ? [followUp] : []),
  ];
}

function dynamicReactionQuestions(analysis){
  const advice = normalizeEatingAdvice(analysis?.eatingAdvice, analysis?.advice);
  const reactions = advice.expectedReaction || [];
  // 已在固定题或个性化追问里覆盖的维度，不再进入通用动态池
  const blocked = ['撑不撑','饱不饱','舒服吗','有精神吗','困不困','腻不腻','腻不腻吗','困倦吗'];
  const focus = toArray(advice.feedbackFocus, []).filter(label=>label && !blocked.some(k=>label.includes(k)));
  const mapped = focus.map((label,idx)=>{
    const hit = reactions.find(r=>label.includes(r.name) || r.name?.includes(label.replace(/[吗？?]/g,''))) || {};
    return {
      key:`reaction${idx+1}`,
      label,
      opts:['没有','有一点','明显'],
      prediction:{name:label, reason:hit.reason || '来自饭前分析的饭后重点观察', evidence:hit.evidence || ''},
    };
  });
  const seen=new Set();
  return mapped.filter(q=>{
    if(seen.has(q.label)) return false;
    seen.add(q.label);
    return true;
  });
}
function checkCanSubmit(){
  const qs=postMealFeedbackQuestions(pendingAnalysis);
  const all=qs.every(q=>{
    if(q.skippable) return true;
    if(q.multi) return Array.isArray(scores[q.key]) && scores[q.key].length>0;
    return !!scores[q.key];
  });
  const sub=document.getElementById('fb-submit');
  if(sub){ sub.disabled=!all; sub.style.opacity=all?1:.4; }
}
function scoreSelect(key,val,btn,isMulti){
  if(isMulti){
    if(!Array.isArray(scores[key])) scores[key]=[];
    const idx=scores[key].indexOf(val);
    if(idx>=0){ scores[key].splice(idx,1); btn.classList.remove('sel'); }
    else       { scores[key].push(val);     btn.classList.add('sel');    }
    // dual-layer: sync values array from QUESTION_SCHEMA
    const schema=QUESTION_SCHEMA[key];
    if(schema){
      scores[key+'Values']=(scores[key]||[]).map(t=>{
        const o=schema.options.find(x=>x.text===t); return o?o.value:t;
      });
    }
  } else {
    scores[key]=val;
    btn.closest('.score-row').querySelectorAll('.score-btn').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
    // dual-layer: store numeric value from QUESTION_SCHEMA
    const schema=QUESTION_SCHEMA[key];
    if(schema){
      const opt=schema.options.find(o=>o.text===val);
      if(opt!==undefined) scores[key+'Value']=opt.value;
    }
  }
  // 用户手动修改 actualIntake：清除 AI 标签
  if(key==='actualIntake'){
    scores.actualIntakeRatio = intakeRatioInfo(val).ratio;
    scores.actualIntakeAutoFilled = false;
    const lbl=document.getElementById('actualIntake-ai-label');
    if(lbl) lbl.style.display='none';
  }
  checkCanSubmit();
}
// ── 个人食物规律摘要（L4层）────────────────────────────────────────
function buildUserFoodProfile(mealList){
  if(!mealList || mealList.length < 2) return null;
  const withFb = mealList.filter(m=>m.fb?.comfort);
  const n = withFb.length;

  // 最佳/最差饮食
  const bestMeals = [...new Set(
    withFb.filter(m=>comfortHas(m.fb?.comfort,'有精神','舒服') && m.fb?.fullness==='刚好')
          .slice(-8).map(m=>m.dish).filter(Boolean)
  )].slice(0,3);
  const worstPatterns = withFb
    .filter(m=>comfortHas(m.fb?.comfort,'困倦','胀气'))
    .slice(-6).map(m=>m.dish ? `${m.dish} → ${comfortText(m.fb.comfort)}` : null).filter(Boolean)
    .slice(0,3);

  // 份量偏差
  const withIntake = mealList.filter(m=>m.fb?.afterPhotoIntakeRatio || m.fb?.actualIntake);
  let portionBias = null;
  if(withIntake.length >= 3){
    const map = {'全吃完':1,'吃了3/4':.75,'吃了一半':.5,'剩很多':.25};
    const ratios = withIntake.map(m=>m.fb?.afterPhotoIntakeRatio ?? map[m.fb?.actualIntake] ?? 1);
    const avg = ratios.reduce((a,b)=>a+b,0)/ratios.length;
    portionBias = avg < 0.82 ? `通常只吃完约${Math.round(avg*100)}%，倾向少吃`
                : avg > 1.02 ? '通常全吃完'
                : '摄入量接近 AI 估算';
  }

  // 高碳午饭与困意的关联
  const hcLunches = mealList.filter(m=>m.type==='午饭'&&(m.analysis?.tags||[]).some(t=>/主食偏多|高碳/.test(t)));
  const sleepyRate = hcLunches.length >= 3
    ? Math.round(hcLunches.filter(m=>comfortHas(m.fb?.comfort,'困倦')).length/hcLunches.length*100)
    : null;

  // 成熟度
  const maturity = n>=30?'深度个性化':n>=15?'规律浮现期':n>=5?'模式萌芽期':'冷启动期';

  // 目标进展
  let goalProgress = null;
  if(profile?.goal==='下午不困' && sleepyRate!==null)
    goalProgress = `午饭高碳水后困意率约 ${sleepyRate}%`;

  const fp = { totalMeals:mealList.length, maturity, bestMeals, worstPatterns, portionBias,
               highCarbSleepyRate:sleepyRate, goalProgress, updatedAt:Date.now() };

  // 持久化
  try{
    const allStr=localStorage.getItem('user_data');
    const allData=allStr?JSON.parse(allStr):{};
    if(currentUser){
      allData[currentUser.userId]=allData[currentUser.userId]||{};
      allData[currentUser.userId].foodProfile=fp;
      localStorage.setItem('user_data',JSON.stringify(allData));
    }
  }catch(_){}
  return fp;
}

function formatUserFoodProfileSummary(fp){
  if(!fp || fp.totalMeals < 2) return '';
  const lines = [`个人规律（${fp.maturity}，已记录${fp.totalMeals}餐）：`];
  if(fp.bestMeals?.length)   lines.push(`- 吃得好的餐：${fp.bestMeals.join('、')}`);
  if(fp.worstPatterns?.length) lines.push(`- 容易不舒服：${fp.worstPatterns.join('；')}`);
  if(fp.portionBias)         lines.push(`- 份量习惯：${fp.portionBias}`);
  if(fp.goalProgress)        lines.push(`- 目标进展：${fp.goalProgress}`);
  return '\n' + lines.join('\n');
}

  const feedbackSubmittedAt2=Date.now();

    state:todayState,
    fromCard: drawnCard ? {
      dish:drawnCard.dish,
      badge:drawnCard.badge||'',
      risk:drawnCard.risk||'',
      recommendationStage:drawnCard.recommendationStage||recommendationStageKey(drawnCard),
      recommendationStageLabel:drawnCard.recommendationStageLabel||recommendationStageMeta(drawnCard).label,

      unlockRequirement:drawnCard.unlockRequirement||recommendationStageMeta(drawnCard).unlock,
      confidenceLevel:drawnCard.confidenceLevel||recommendationStageMeta(drawnCard).confidence
    } : null,
    // L3 精确时间戳
    mealStartedAt,
    mealDurationMs: mealStartedAt ? feedbackSubmittedAt2 - mealStartedAt : null,

  userFoodProfile = buildUserFoodProfile(meals);
  // L3：写入每日回访计划（每天一次，非每餐）

    return `<div data-meal-id="${m.id}" style="display:flex;gap:12px;align-items:center;padding:12px ${isTarget?'10px':'0'};border-bottom:1px solid var(--border);cursor:pointer;background:${isTarget?'var(--red-s)':'transparent'};border-radius:${isTarget?'12px':'0'};margin:${isTarget?'6px -4px':'0'}" onclick="showMealDetail(${m.id})">
      <div style="position:relative;flex-shrink:0">
        ${imgEl}
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <p style="font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.dish||'这一餐'}${isTarget?' · 已定位':''}</p>
          ${noFb
            ? `<button onclick="event.stopPropagation();backfillFeedback(${m.id})" style="flex-shrink:0;border:1.5px solid var(--accent);background:var(--accent-s);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">补录反馈</button>`
            : `<span style="font-size:11px;color:${feelColor};font-weight:600;flex-shrink:0">${feelEmoji(m.fb.comfort)} ${m.fb.comfort}</span>`}
        </div>
        <p style="font-size:12px;color:var(--ink60);margin-top:2px">${m.type} · ${m.cuisine||'家常菜'}</p>
        <p style="font-size:12px;color:var(--ink30);margin-top:2px">${m.analysis?.structure||''}</p>
      </div>
    </div>`;
  }).join('');
  return `<div class="label">${day}日的记录</div><div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:0 16px">${items}</div>`;
}

function renderMapView(container){
  // 统计已解锁的省份
  const unlocked={};
  meals.forEach(m=>{
    if(m.province&&m.province!=='全国'&&m.province!=='境外'){
      if(!unlocked[m.province]) unlocked[m.province]={count:0,meals:[],cuisine:m.cuisine};
      unlocked[m.province].count++;
      unlocked[m.province].meals.push(m);
    }
  });
  const total=PROVINCES.filter(p=>p.id!=='全国'&&p.id!=='境外').length;
  const unlockedCount=Object.keys(unlocked).length;

  // 绘制 SVG 地图
  const svgProvinces=PROVINCES.map(p=>{
    const isUnlocked=unlocked[p.id];
    const fill=isUnlocked?'var(--accent)':'var(--border)';
    const opacity=isUnlocked?1:0.5;
    return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"
      rx="4" ry="4" fill="${fill}" opacity="${opacity}"
      style="cursor:${isUnlocked?'pointer':'default'};transition:all .2s"

      style="font-size:${p.w>50?'9':'7'}px;fill:${isUnlocked?'#fff':'var(--ink30)'};pointer-events:none;font-family:var(--sans);font-weight:${isUnlocked?600:400}">
      ${p.w>40?p.id:''}
    </text>
    ${isUnlocked?`<text x="${p.x+p.w/2}" y="${p.y+p.h/2+10}" text-anchor="middle" dominant-baseline="middle"
      style="font-size:10px;fill:#fff;pointer-events:none">${p.emoji}</text>`:''}`;
  }).join('');

  // 解锁列表
  const unlockedList=Object.entries(unlocked).map(([province,data])=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="showProvinceDetail('${province}')">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--accent-s);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">
        ${PROVINCES.find(p=>p.id===province)?.emoji||'🍽️'}

        <p style="font-weight:600;font-size:14px">${data.cuisine}</p>
        <p style="font-size:12px;color:var(--ink60)">${province} · 记录了 ${data.count} 餐</p>
      </div>
      <span style="font-size:12px;color:var(--ink30)">→</span>
    </div>`).join('');

  container.innerHTML=`
  <div style="text-align:center;margin-bottom:16px">
    <p style="font-family:var(--serif);font-size:22px">美食版图</p>
    <p style="font-size:13px;color:var(--ink60);margin-top:4px">已解锁 <strong style="color:var(--accent)">${unlockedCount}</strong> / ${total} 个省份菜系</p>
  </div>

  <div style="background:var(--cream);border-radius:var(--r);padding:12px;margin-bottom:16px;overflow:hidden">
    <svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
      ${svgProvinces}
    </svg>
    <p style="text-align:center;font-size:11px;color:var(--ink30);margin-top:4px">点击橙色省份查看详情</p>
  </div>

  <div style="display:flex;gap:12px;margin-bottom:16px">
    <div style="flex:1;background:var(--accent-s);border-radius:var(--rs);padding:12px;text-align:center">
      <p style="font-size:24px;font-weight:700;color:var(--accent)">${unlockedCount}</p>
      <p style="font-size:11px;color:var(--ink60)">已解锁菜系</p>
    </div>
    <div style="flex:1;background:var(--cream);border-radius:var(--rs);padding:12px;text-align:center">
      <p style="font-size:24px;font-weight:700;color:var(--ink)">${total-unlockedCount}</p>
      <p style="font-size:11px;color:var(--ink60)">待探索</p>
    </div>
    <div style="flex:1;background:var(--green-s);border-radius:var(--rs);padding:12px;text-align:center">
      <p style="font-size:24px;font-weight:700;color:var(--green)">${meals.length}</p>
      <p style="font-size:11px;color:var(--ink60)">总记录餐</p>

  ${unlockedCount>0?`<div class="label">已解锁菜系</div>
  <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:0 16px">
    ${unlockedList}

  <div id="province-detail"></div>`;

  window.showProvinceDetail=function(province){
    const data=unlocked[province];if(!data)return;

  };

function backfillFeedback(mealId){
  const m=meals.find(x=>x.id===mealId);if(!m)return;
  // 恢复这顿饭的 pending 状态，打开补录打分页
  pendingAnalysis=m.analysis||null;
  pendingMealType=m.type||'午饭';
  pendingAdditionals=m.additionals||[];
  wideImg=m.wideImg||null;
  mealEatingStarted=true;
  activePendingMealId=mealId;
  mealStartedAt=m.mealStartedAt||m.startedAt||m.ts||Date.now();
  // 提交后替换原记录而非新增
  window._backfillMealId=mealId;
  renderFeedback();
  show('feedback');
}

  // 时间信息
  const tsDate=m.ts?new Date(m.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';

        <p style="font-family:var(--serif);font-size:20px;line-height:1.3;margin-bottom:8px">${m.dish||a.structure||'这一餐'}</p>
        <div class="risk-bar risk-${a.risk}"></div>

        ${a.advice?`<div class="advice-box" style="margin-top:10px"><p style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:4px">吃法建议</p><p class="advice-text">${a.advice}</p></div>`:''}

function computeInsights(){
  const good = meals.filter(m=>['舒服','有精神'].includes(m.fb?.comfort));
  const bad  = meals.filter(m=>['困倦','胀气'].includes(m.fb?.comfort));
  const overfull = meals.filter(m=>m.fb?.fullness==='撑');
  const regret = meals.filter(m=>m.fb?.mood==='后悔');

  // 最舒服的餐：取好评餐里出现的菜品/结构
  const bestMeals = good.slice(-3).map(m=>`${m.dish||m.analysis.structure.split('，')[0]}（${m.date}${m.type}）`);

  // 最容易困：找差评且有困倦的餐，找共同标签
  const sleepyMeals = bad.filter(m=>m.fb?.comfort==='困倦');
  let sleepyStr = '暂无足够数据';
  if(sleepyMeals.length>=1){
    const tags = sleepyMeals.flatMap(m=>m.analysis?.tags||[]);
    const freq = {};tags.forEach(t=>freq[t]=(freq[t]||0)+1);
    const topTag = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
    const ex = sleepyMeals[sleepyMeals.length-1];
    sleepyStr = topTag
      ? `${ex.dish||'高油高碳的餐'} → 饭后困倦，共出现 ${sleepyMeals.length} 次，多和「${topTag[0]}」有关`
      : `${ex.dish||'重口味的餐'} → 饭后困倦，共出现 ${sleepyMeals.length} 次`;
  }

  // 最容易撑：场景分析
  let overfullStr = '暂无足够数据';
  if(overfull.length>=1){
    const types = overfull.map(m=>m.type);
    const freq = {};types.forEach(t=>freq[t]=(freq[t]||0)+1);
    const topType = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
    overfullStr = `${topType[0]}最容易吃撑，共 ${overfull.length} 次，${regret.length>0?'其中 '+regret.length+' 次后悔了':''}`;
  }

  // 性价比最高：值 + 舒服/有精神
  const goodValue = meals.filter(m=>m.fb?.price==='值'&&['舒服','有精神'].includes(m.fb?.comfort));
  let bestValue = '暂无足够数据';
  if(goodValue.length>=1){
    const ex = goodValue[goodValue.length-1];
    bestValue = `${ex.dish||'这顿'}：你觉得价格值，身体感受也好`;
  }

  // 状态 → 身体反应关联
  const stressedMeals = meals.filter(m=>m.state==='压力有点大'&&m.fb?.comfort);
  let stateInsight = null;
  if(stressedMeals.length>=2){
    const badStress = stressedMeals.filter(m=>['困倦','胀气'].includes(m.fb?.comfort));
    if(badStress.length/stressedMeals.length>0.5){
      stateInsight = `你压力大时吃饭，${Math.round(badStress.length/stressedMeals.length*100)}% 的概率身体反应不好，下次试试先休息 10 分钟再吃`;
    }
  }

  // 最值得调整的一件事
  let action = '再记录几餐，规律就会浮现';
  if(sleepyMeals.length>=2){
    const ex=sleepyMeals[sleepyMeals.length-1];
    const tag=(ex.analysis?.tags||[])[0]||'重口味';
    action=`减少「${tag}」的频率，你有 ${sleepyMeals.length} 次饭后困倦和它有关`;
  } else if(overfull.length>=2){
    action=`${overfull[overfull.length-1].type}少点一份，你已经撑了 ${overfull.length} 次了`;
  } else if(good.length>=1){
    const ex=good[good.length-1];
    action=`多吃「${ex.dish||'让你舒服的那类餐'}」，这是你目前身体反应最好的方向`;
  }

  // 生成结论句
  let conclusion = '';
  if(sleepyMeals.length>=1&&good.length>=1){
    const badEx=sleepyMeals[sleepyMeals.length-1];
    const goodEx=good[good.length-1];
    conclusion=`你${badEx.date}吃了${badEx.dish||'重口味的东西'}，饭后困倦；${goodEx.date}吃了${goodEx.dish||'蛋白质足的搭配'}，感觉${goodEx.fb?.comfort}。身体在告诉你区别在哪里。`;
  } else if(good.length>=2){
    conclusion=`这周吃得最好的是${good.slice(-2).map(m=>m.dish||'那顿').join('和')}，身体反应都不错。继续这个方向。`;
  } else if(meals.length>=3){
    conclusion=`记录了 ${meals.length} 餐，规律正在浮现。再记几天，洞察会更准确。`;
  }

  return {bestMeals, sleepyStr, overfullStr, bestValue, stateInsight, action, conclusion};
}

function renderInsight(){
  const s=document.getElementById('s-insight');
  const n=meals.length;
  const phase=n<3?0:n<8?1:n<21?2:3;

  // ── 阶段0：还没数据 ───────────────────────────────────────────
  if(phase===0){
    s.innerHTML=`
    <div style="min-height:70vh;display:flex;flex-direction:column;justify-content:center">
      <p style="font-size:13px;color:var(--ink60);margin-bottom:8px">你的身体拼图</p>
      <h1 style="font-family:var(--serif);font-size:32px;line-height:1.2;margin-bottom:16px">
        还差 <em style="color:var(--accent);font-style:italic">${3-n}</em> 餐<br>第一块就出来了
      </h1>
      <p style="font-size:15px;color:var(--ink60);line-height:1.7;margin-bottom:32px">每一餐都是一块拼图。<br>吃完打个分，身体的秘密慢慢浮现。</p>
      <button class="btn btn-primary" onclick="switchTab('camera')">📷 去记录这一餐</button>
    </div>`;
    return;
  }

  // ── 计算四块拼图 ──────────────────────────────────────────────
  const ins=computeInsights();
  const good=meals.filter(m=>['舒服','有精神'].includes(m.fb?.comfort));
  const bad=meals.filter(m=>['困倦','胀气'].includes(m.fb?.comfort));
  const overfull=meals.filter(m=>m.fb?.fullness==='撑');
  const cuisines=[...new Set(meals.map(m=>m.cuisine).filter(c=>c&&c!=='家常菜'))];
  const recent7=meals.slice(-7);
  const early7=meals.slice(0,7);
  const recentRate=recent7.filter(m=>['舒服','有精神'].includes(m.fb?.comfort)).length/Math.max(recent7.length,1);
  const earlyRate=early7.filter(m=>['舒服','有精神'].includes(m.fb?.comfort)).length/Math.max(early7.length,1);
  const improving=recentRate>earlyRate+0.1;

  // 每块拼图的数据
  const wow2tags=(()=>{
    const tc={};
    good.forEach(m=>(m.analysis?.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
    return Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,2);
  })();

  const pieces=[
    // 块0：喜欢吃这个
    {
      unlocked:good.length>=1,
      emoji:'😋',label:'喜欢吃这个',
      color:'var(--green)',colorSoft:'var(--green-s)',
      headline:'原来我喜欢吃这个',
      body: good.length>=1 ? good.slice(-3).map(m=>
        `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:22px;flex-shrink:0">${feelEmoji(m.fb.comfort)}</span>
          <div>
            <p style="font-size:15px;font-weight:600">${m.dish||m.analysis.structure.split('，')[0]}</p>
            <p style="font-size:12px;color:var(--green);margin-top:2px">${m.fb.comfort} · ${m.date} ${m.type}</p>
          </div>
        </div>`).join('')+
        `<p style="font-size:13px;color:var(--ink60);padding-top:12px">吃了 ${good.length} 次让你舒服的餐，方向越来越清晰</p>`
      : '',
      hint:'再打几次好评，这块拼图就出来了',
    },
    // 块1：该这么吃
    {
      unlocked:wow2tags.length>=1,
      emoji:'🥢',label:'该这么吃',
      color:'var(--accent)',colorSoft:'var(--accent-s)',
      headline:'我该这么吃',
      body: wow2tags.length>=1 ? [
        wow2tags[0]?`<div style="padding:12px 0;border-bottom:1px solid var(--border)"><p style="font-size:15px">✓ &nbsp;${wow2tags[0][0]}的搭配，让你有精神的概率最高</p></div>`:null,
        bad.length>=1?`<div style="padding:12px 0;border-bottom:1px solid var(--border)"><p style="font-size:15px">↓ &nbsp;${(bad[bad.length-1].analysis?.tags||['重口味'])[0]}之后你容易不舒服</p></div>`:null,
        overfull.length>=2?`<div style="padding:12px 0"><p style="font-size:15px">○ &nbsp;你的合适饭量比你想的小一点</p></div>`:null,
      ].filter(Boolean).join('')+
      `<p style="font-size:13px;color:var(--ink60);padding-top:12px">这是你的专属吃法，不是通用建议</p>`
      : '',
      hint:'好评和差评各积累几次，规律就算出来了',
    },
    // 块2：口味探索
    {
      unlocked:cuisines.length>=2,
      emoji:'🗺️',label:'口味探索',
      color:'var(--amber)',colorSoft:'var(--amber-s)',
      headline:'这个口味也不错',
      body: cuisines.length>=2 ? cuisines.map(c=>{
        const cms=meals.filter(m=>m.cuisine===c);
        const g=cms.filter(m=>['舒服','有精神'].includes(m.fb?.comfort));
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">
          <p style="font-size:15px">${c}</p>
          <p style="font-size:13px;color:${g.length>0?'var(--green)':'var(--ink60)'}">${g.length>0?`${g.length}次感觉不错`:`试了${cms.length}次`}</p>
        </div>`;
      }).join('')+
      `<button onclick="document.getElementById('wow-sheet').remove();switchTab('history');setTimeout(()=>switchHistoryView('map'),100)"
        style="margin-top:14px;width:100%;padding:11px;border:1.5px solid var(--amber);border-radius:100px;background:transparent;color:var(--amber);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer">
        看我的美食地图 →
      </button>`
      : '',
      hint:`再探索 ${Math.max(0,2-cuisines.length)} 种新菜系解锁`,
    },
    // 块3：越来越舒服
    {
      unlocked:n>=10,
      emoji:'✨',label:'越来越舒服',
      color:'var(--green)',colorSoft:'var(--green-s)',
      headline:'我的身体越来越舒服了',
      body: n>=10 ?
        `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
          <div style="background:${improving?'var(--green)':'var(--cream)'};border-radius:var(--rs);padding:16px;text-align:center">
            <p style="font-size:26px;font-weight:700;color:${improving?'#fff':'var(--ink)'}">${Math.round(recentRate*100)}%</p>
            <p style="font-size:11px;color:${improving?'rgba(255,255,255,.75)':'var(--ink60)'};margin-top:3px">近期舒服率</p>
          </div>
          <div style="background:var(--cream);border-radius:var(--rs);padding:16px;text-align:center">
            <p style="font-size:26px;font-weight:700;color:var(--ink)">${n}</p>
            <p style="font-size:11px;color:var(--ink60);margin-top:3px">累计记录</p>
          </div>
        </div>
        <p style="font-size:14px;color:var(--ink60);line-height:1.7">${improving?`比刚开始提高了 ${Math.round((recentRate-earlyRate)*100)}%。不是因为自律，是因为你越来越了解自己了。`:'规律在积累，数据会越来越准。'}</p>`
      : '',
      hint:`记录到 10 餐后解锁（还差 ${10-n} 餐）`,
    },
  ];

  const unlockedCount=pieces.filter(p=>p.unlocked).length;

  // ── 拼图格子 ─────────────────────────────────────────────────
  const grid=pieces.map((p,i)=>`
    <div onclick="${p.unlocked?`showWowSheet(${i})`:'null'}" style="
      aspect-ratio:1;border-radius:16px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;

      background:${p.unlocked?p.color:'var(--cream)'};

        text-align:center;line-height:1.35;padding:0 8px">${p.unlocked?p.label:p.hint}</p>

  // ── 结论句 ────────────────────────────────────────────────────
  const conclusion=ins.conclusion?`
    <div style="background:var(--accent);border-radius:var(--r);padding:18px;margin-bottom:20px">
      <p style="font-size:11px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px">你的身体说</p>

  s.innerHTML=`

    </p>`;

  // ── Bottom sheet：点击拼图弹出 ───────────────────────────────
  window.showWowSheet=function(i){
    const p=pieces[i];
    // 移除旧的
    document.getElementById('wow-sheet')?.remove();

function renderAIConfigResult(type, message, meta={}){
  const isOk = type === 'ok';
  const isLoading = type === 'loading';
  const bg = isOk ? 'var(--green-s)' : isLoading ? 'var(--amber-s)' : 'var(--red-s)';
  const color = isOk ? 'var(--green)' : isLoading ? 'var(--amber)' : 'var(--red)';
  const title = isOk ? '连接可用' : isLoading ? '正在测试' : '连接失败';
  const statusLine = meta.status ? `<p style="font-size:11px;color:${color};font-weight:800;margin-bottom:2px">状态：${escapeHtml(meta.status)}</p>` : '';
  const rawLine = meta.raw ? `<p style="font-size:10px;color:var(--ink30);line-height:1.45;overflow-wrap:anywhere;margin-top:5px">原始响应：${escapeHtml(meta.raw.slice(0,300))}</p>` : '';
  return `<div style="background:${bg};border-radius:12px;padding:10px 12px">
    <p style="font-size:12px;font-weight:800;color:${color};margin-bottom:2px">${title}</p>
    ${statusLine}
    <p style="font-size:11px;color:var(--ink60);line-height:1.45;overflow-wrap:anywhere">${escapeHtml(message)}</p>
    ${rawLine}
  </div>`;
}

function setAIConfigResult(type, message, meta={}){
  const box=document.getElementById('ai-test-result');
  if(box) box.innerHTML=renderAIConfigResult(type, message, meta);
}

function setAIConfigSteps(steps){
  const box=document.getElementById('ai-test-result');
  if(!box) return;
  box.innerHTML=`<div style="background:var(--cream);border-radius:12px;padding:10px 12px">
    ${steps.map(s=>`<div style="padding:${s===steps[0]?'0':'8px 0 0'};border-top:${s===steps[0]?'none':'1px solid var(--border)'}">
      <p style="font-size:12px;font-weight:800;color:${s.ok?'var(--green)':s.pending?'var(--amber)':'var(--red)'};margin-bottom:2px">${escapeHtml(s.title)}</p>
      <p style="font-size:11px;color:var(--ink60);line-height:1.45;overflow-wrap:anywhere">状态：${escapeHtml(s.status || '等待中')} ${s.raw?`· ${escapeHtml(String(s.raw).slice(0,220))}`:''}</p>
    </div>`).join('')}
  </div>`;
}

function readAISettingsFromForm(){
  const k=cleanApiKey(document.getElementById('ai-key-input')?.value);
  const m=document.getElementById('ai-model-input')?.value.trim();
  const ep=document.getElementById('ai-endpoint-input')?.value.trim();
  if(!k || !m || !ep){
    setAIConfigResult('fail','请填完整 Key、模型和接口地址。');
    return null;
  }
  AI_CONFIG.key=k;
  AI_CONFIG.model=m;
  AI_CONFIG.endpoint=ep;
  return {k,m,ep};
}

function persistAISettings(settings){
  localStorage.setItem('ai_api_key',settings.k);
  localStorage.setItem('ai_model',settings.m);
  localStorage.setItem('ai_endpoint',settings.ep);
  AI_CONFIG.key = settings.k;
  AI_CONFIG.model = settings.m;
  AI_CONFIG.endpoint = settings.ep;
  rememberAIModel(settings.m);
  renderProfile();
}

function saveAISettings(mode){
  const settings=readAISettingsFromForm();
  if(!settings) return;
  if(mode==='save'){
    persistAISettings(settings);
    localStorage.removeItem('ai_last_error');
    setAIConfigResult('ok','配置已保存。下一次餐图分析会使用当前 Key、模型和接口地址。');
    toast('AI 配置已保存');
    return;
  }
  runAIConfigTest(settings);
}

async function runAIConfigTest(settings){
  const steps=[
    {title:'1. Key / Endpoint 认证', pending:true},
    {title:'2. 模型文本调用'},
    {title:'3. 图片识别调用'},
  ];
  setAIConfigSteps(steps);

  const auth = await testAIAuthRaw();
  steps[0]={title:'1. Key / Endpoint 认证', ok:auth.ok, status:auth.status, raw:auth.raw};
  steps[1].pending=auth.ok;
  setAIConfigSteps(steps);
  if(!auth.ok){
    rememberAIError({message:`认证失败 ${auth.status}: ${auth.raw}`, status:auth.status, raw:auth.raw});
    toast('连接失败');
    return;
  }

  const text = await testAITextRaw();
  steps[1]={title:'2. 模型文本调用', ok:text.ok, status:text.status, raw:text.raw};
  steps[2].pending=text.ok;
  setAIConfigSteps(steps);
  if(!text.ok){
    rememberAIError({message:`模型文本调用失败 ${text.status}: ${text.raw}`, status:text.status, raw:text.raw});
    toast('连接失败');
    return;
  }

  const vision = await testAIVisionRaw();
  steps[2]={title:'3. 图片识别调用', ok:vision.ok, status:vision.status, raw:vision.raw};
  setAIConfigSteps(steps);
  if(!vision.ok){
    rememberAIError({message:`图片识别调用失败 ${vision.status}: ${vision.raw}`, status:vision.status, raw:vision.raw});
    toast('连接失败');
    return;
  }

  persistAISettings(settings);
  localStorage.removeItem('ai_last_error');
  setAIConfigResult('ok',`连接可用：Key、模型文本调用、图片识别都已通过。模型：${AI_CONFIG.model}`, {status:200, raw:vision.raw});
  toast('AI 连接可用');
}

function saveProfileField(key, value){
  if(value===''||value===null||value===undefined) return;
  const num = Number(value);
  profile[key] = isNaN(num)||value==='' ? value : num;
  // 体重每次保存都追加到时序日志
  if(key==='weight' && !isNaN(num) && num>0){
    if(!profile.weightLog) profile.weightLog=[];
    profile.weightLog.push({ value:parseFloat(num), ts:Date.now() });
    profile.weightLog = profile.weightLog.slice(-52); // 保留约一年周数据
  }
  if(currentUser){ try{ localStorage.setItem('profile_'+currentUser, JSON.stringify(profile)); }catch(_){} }
  renderProfile();
}

function computeTasteStats(){
  const cuisines=meals.map(m=>m.cuisine).filter(Boolean);
  const freq={};cuisines.forEach(c=>freq[c]=(freq[c]||0)+1);
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  return {topCuisine:top?top[0]:'暂无', cuisineCount:new Set(cuisines).size};
}

  `);
}

function openNewUserAuth(){
  loginMode='new';
  authAgreementChecked=false;
  renderLogin();
}

function openReturningUserAuth(){
  loginMode='returning';
  renderLogin();
}

function toggleAuthAgreement(){
  authAgreementChecked=!authAgreementChecked;
  renderLogin();
}

function completeNewUserAuth(method){
  if(!authAgreementChecked){
    toast('请先勾选用户协议和隐私政策');
    return;
  }
  startNewUserDemo(method);
}

function resetMealFlowState(){
  pendingAnalysis=null;
  pendingMealType=guessMealType();
  mealEatingStarted=false;
  pendingAdditionals=[];
  justCompletedMealId=null;
  drawnCard=null;
  todayState='';
  wideImg=null;
  closeImg=null;
  leftoverImg=null;
  scores={};
  forceHomeRecordDefault=false;
  mealStartedAt=null;
  activePendingMealId=null;
  historyTargetMealId=null;
  actualIntakeAnalysis=null;
}

function startOnboardingFlow(){
  resetMealFlowState();
  obStep=0;
  renderOnboard();
  show('onboard');
}

function startNewUserDemo(method='demo'){
  const user = {userId:'demo_new_user', phone:'新用户演示', loginType:method, demoType:'new', loginAt:new Date().toISOString()};
  saveUserSession(user);
  profile={};
  meals=[];
  correctionHistory=[];
  setUserDataForCurrent(meals, profile);
  startOnboardingFlow();
}

function startReturningUserDemo(){
  const user = {userId:'demo_returning_user', phone:'老用户演示', loginType:'demo', demoType:'returning', loginAt:new Date().toISOString()};
  saveUserSession(user);
  profile={...RETURNING_USER_PROFILE};
  meals=demoSeedMeals();
  correctionHistory=[];
  resetMealFlowState();
  setUserDataForCurrent(meals, profile);
  renderHome();
  show('home');
}

function loginWithPhone(){
  const phone = document.getElementById('login-phone').value.trim();
  if(!phone || phone.length < 11){
    toast('请输入有效的手机号');
    return;
  }
  const user = {userId: 'user_' + phone, phone, loginType: 'phone', demoType:'new', loginAt: new Date().toISOString()};
  saveUserSession(user);
  profile = {};
  meals = [];
  correctionHistory = [];
  setUserDataForCurrent(meals, profile);
  startOnboardingFlow();
}

function loginWithWeChat(){
  startReturningUserDemo();
}

function loadMealsForUser(){
  const data = getCurrentUserData();
  if(data){
    profile = data.profile || {};
    correctionHistory = data.correctionHistory || [];
    meals = data.meals?.length ? data.meals : (currentUser?.demoType === 'returning' ? demoSeedMeals() : []);
    userFoodProfile = data.foodProfile || buildUserFoodProfile(meals);  // 恢复或重建
    return;
  }
  profile = currentUser?.demoType === 'returning' ? {...RETURNING_USER_PROFILE} : {};
  correctionHistory = [];
  meals = currentUser?.demoType === 'returning' ? demoSeedMeals() : [];
}

// ── 2️⃣ 识别可编辑 ────────────────────────────────────────────────────
function enableEditableAnalysis(){
  // 在菜品名称处添加编辑功能
  const dishEl = document.querySelector('[data-editable-dish]');
  if(dishEl){
    dishEl.style.cursor = 'pointer';
    dishEl.style.borderBottom = '2px dashed var(--border)';
    dishEl.onclick = () => {
      const newDish = prompt('修改菜品名称', pendingAnalysis.dish);
      if(newDish){
        correctionHistory.push({
          originalDish: pendingAnalysis.dish,
          correctedDish: newDish,
          ts: Date.now()
        });
        pendingAnalysis.dish = newDish;
        dishEl.textContent = newDish;
      }
    };
  }
}

// ── 3️⃣ 周报表（集成到身体拼图） ────────────────────────────────────────────────────
function mealTimeMs(m){
  const candidates=[m?.ts,m?.createdAt,m?.created_at,m?.time,m?.dateTime];
  for(const v of candidates){
    const t=typeof v==='number'?v:Date.parse(v);
    if(Number.isFinite(t)) return t;
  }
  return null;
}

function firstNumber(value){
  const hit=String(value||'').match(/\d+(?:\.\d+)?/);
  return hit ? Number(hit[0]) : null;
}

function renderWeeklyReportSection(allMeals){
  const source = toArray(allMeals);
  if(source.length === 0) return '';
  const now = Date.now();
  let weekMeals = source.filter(m => {
    const t = mealTimeMs(m);
    if(!t) return false;
    const daysAgo = (now - t) / (1000*60*60*24);
    return daysAgo >= 0 && daysAgo <= 7;
  });

  // 兼容补记、历史导入和旧原型数据：没有有效时间时，用最近 7 条记录生成周报。
  if(weekMeals.length === 0) weekMeals = source.slice(-7);

  if(weekMeals.length === 0) return '';

  // 口味偏好
  const flavorMap = {};
  weekMeals.forEach(m => {
    const cuisine = m.cuisine || '其他';
    flavorMap[cuisine] = (flavorMap[cuisine] || 0) + 1;
  });
  const topFlavors = Object.entries(flavorMap).sort((a,b) => b[1]-a[1]).slice(0,3);

  // 营养汇总
  let totalCals = 0, calCount = 0, totalProtein = 0, proteinCount = 0;
  weekMeals.forEach(m => {
    if(m.analysis?.nutritionEstimate?.calories?.range){
      const cal = firstNumber(m.analysis.nutritionEstimate.calories.range);
      if(cal !== null){ totalCals += cal; calCount++; }
    }
    if(m.analysis?.nutritionEstimate?.protein?.range){
      const prot = firstNumber(m.analysis.nutritionEstimate.protein.range);
      if(prot !== null){ totalProtein += prot; proteinCount++; }
    }
  });

  // 感受统计
  const feelingMap = {};
  const fullnessMap = {};
  weekMeals.forEach(m => {
    const comfort = m.fb?.comfort || '未评';
    feelingMap[comfort] = (feelingMap[comfort] || 0) + 1;
    const fullness = m.fb?.fullness || m.fb?.satiety || '未评';
    fullnessMap[fullness] = (fullnessMap[fullness] || 0) + 1;
  });

  // 改进建议（基于反馈）
  let suggestion = '';
  if(feelingMap['困倦'] && feelingMap['困倦'] >= weekMeals.length/2){
    suggestion = '😴 这周午餐后困倦明显，建议减少高碳水组合，增加蛋白质。';
  } else if(fullnessMap['撑'] && fullnessMap['撑'] >= 2){
    suggestion = '🍽️ 发现容易吃撑的模式，可以提前设定饭量提醒。';
  } else {
    suggestion = '✨ 保持现在的饮食节奏，身体反馈很稳定！';
  }

  const goodFeelings = Object.entries(feelingMap).filter(([k]) => ['舒服','有精神'].includes(k));
  const avgCal = calCount ? Math.round(totalCals / calCount) : null;
  const avgProtein = proteinCount ? Math.round(totalProtein / proteinCount) : null;

  return `
    <div class="card fade" style="animation-delay:.24s;background:linear-gradient(135deg, var(--accent-s), var(--amber-s));border:1px solid var(--border)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
        <div style="font-size:11px;font-weight:600;color:var(--ink60);text-transform:uppercase;letter-spacing:.07em">📊 你的一周</div>
        <span style="font-size:11px;color:var(--ink30)">近 ${weekMeals.length} 餐</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <div style="font-size:13px;color:var(--ink60);margin-bottom:6px">口味</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">
            ${topFlavors.slice(0,2).map(([f,c]) => `<span class="chip chip-amber" style="font-size:11px">${f}${c}×</span>`).join('') || '<span class="chip" style="font-size:11px">待观察</span>'}
          </div>
        </div>
        <div>
          <div style="font-size:13px;color:var(--ink60);margin-bottom:6px">感受最好</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">
            ${goodFeelings.map(([k,v]) => `<span class="chip chip-green" style="font-size:11px">${k}${v}×</span>`).join('') || '<span class="chip" style="font-size:11px">待观察</span>'}
          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <div style="background:rgba(255,255,255,.62);border-radius:12px;padding:10px">
          <p style="font-size:11px;color:var(--ink60);margin-bottom:4px">粗估热量</p>
          <p style="font-size:16px;font-weight:800;color:var(--accent)">${avgCal ? `约${avgCal} kcal/餐` : '待确认'}</p>
        </div>
        <div style="background:rgba(255,255,255,.62);border-radius:12px;padding:10px">
          <p style="font-size:11px;color:var(--ink60);margin-bottom:4px">蛋白质</p>
          <p style="font-size:16px;font-weight:800;color:var(--green)">${avgProtein ? `约${avgProtein} g/餐` : '待确认'}</p>
        </div>
      </div>
      <p style="font-size:12px;color:var(--ink);margin-top:10px;line-height:1.5">${suggestion}</p>
    </div>`;
}

// 初始化
function initApp(){
  loadUserSession();
  if(currentUser) loadMealsForUser();
  navBackTarget='roadmap';
  renderRoadmap();
  show('roadmap');
}

window.addEventListener('load', initApp);
</script>

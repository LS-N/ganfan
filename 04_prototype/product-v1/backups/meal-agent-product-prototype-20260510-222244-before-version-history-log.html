<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>干饭 · 好好吃饭</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF7F2;--white:#FFFEF9;--ink:#1A1612;--ink60:#7A6E66;--ink30:#C5BDB5;
  --accent:#E85D26;--accent-s:#FFF0E9;--green:#2D6A4F;--green-s:#EBF5EF;
  --amber:#D4860A;--amber-s:#FEF6E4;--red:#C0392B;--red-s:#FDECEA;
  --border:#EDE8E1;--r:16px;--rs:10px;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  --serif:Georgia,'Songti SC',serif;
}
html,body{height:100%;background:var(--cream);font-family:var(--sans);color:var(--ink)}
#app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;position:relative}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:0;z-index:100}
.nav-title{font-family:var(--serif);font-size:19px}
.nav-back{background:none;border:none;color:var(--ink60);font-size:14px;font-family:var(--sans);padding:6px 10px;border-radius:8px;cursor:pointer}
.nav-home-left{display:flex;align-items:center;gap:14px;border:none;background:transparent;padding:0;font-family:var(--sans);min-width:170px}
.nav-avatar{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:linear-gradient(135deg,var(--accent-s),var(--green-s));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(26,22,18,.06)}
.nav-home-stat{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:21px;font-weight:900;line-height:1}
.nav-home-stat .muted{color:var(--ink30)}
.home-slide{position:relative;height:58px;border-radius:999px;background:var(--cream);border:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:5px;margin:18px 0 16px;overflow:hidden}
.home-slide-thumb{position:absolute;top:5px;bottom:5px;left:calc(33.333% + 5px);width:calc(33.333% - 10px);border-radius:999px;background:var(--white);box-shadow:0 8px 22px rgba(26,22,18,.08);border:1px solid var(--border);z-index:1}
.home-slide button{position:relative;z-index:2;border:none;background:transparent;font-family:var(--sans);font-size:12px;font-weight:800;color:var(--ink60);cursor:pointer;height:48px;border-radius:999px}
.home-slide button.center{color:var(--accent);font-size:13px}

/* TABS */
.tabbar{display:flex;border-top:1px solid var(--border);background:var(--white);position:sticky;bottom:0;z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;border:none;background:none;cursor:pointer;color:var(--ink60);font-family:var(--sans);font-size:10px;font-weight:500}
.tab-btn.active{color:var(--accent)}
.tab-icon{font-size:20px;line-height:1}

/* PAGE */
.page{flex:1;overflow-y:auto;padding:20px;padding-bottom:90px}
.screen{display:none}.screen.active{display:block}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 24px;border-radius:100px;font-family:var(--sans);font-size:15px;font-weight:500;cursor:pointer;border:none;width:100%;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:#C44D1F;transform:scale(.98)}
.btn-primary:disabled{opacity:.4;cursor:default}
.btn-ghost{background:transparent;color:var(--ink60);font-size:14px;margin-top:8px}

/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px}

/* CHIPS */
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:500}
.chip-green{background:var(--green-s);color:var(--green)}
.chip-amber{background:var(--amber-s);color:var(--amber)}
.chip-red{background:var(--red-s);color:var(--red)}

/* SECTION LABEL */
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink60);margin-bottom:10px}

/* UPLOAD ZONE */
.upload-zone{border:2px dashed var(--border);border-radius:var(--r);padding:28px 20px;text-align:center;cursor:pointer;background:var(--cream);transition:border-color .2s;margin-bottom:14px}
.upload-zone:active{border-color:var(--accent);background:var(--accent-s)}
.upload-zone img{width:100%;height:160px;object-fit:cover;border-radius:var(--rs);display:block}
.upload-zone .uz-icon{font-size:30px;margin-bottom:6px}
.upload-zone p{font-size:13px;color:var(--ink60)}

/* SCORE BUTTONS */
.score-row{display:flex;gap:8px;margin-bottom:16px}
.score-btn{flex:1;padding:10px 4px;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--white);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink60);transition:all .15s;text-align:center}
.score-btn.sel{border-color:var(--accent);background:var(--accent-s);color:var(--accent)}

/* PROGRESS DOTS */
.day-dots{display:flex;gap:8px;flex-wrap:wrap}
.day-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--ink60)}
.day-dot.done{background:var(--accent);border-color:var(--accent);color:#fff}
.day-dot.today{border-color:var(--accent);color:var(--accent)}

/* RISK BAR */
.risk-bar{height:3px;border-radius:2px;margin-top:10px}
.risk-low{background:var(--green);width:33%}
.risk-medium{background:var(--amber);width:66%}
.risk-high{background:var(--red);width:100%}

/* ADVICE BOX */
.advice-box{background:var(--accent-s);border-radius:var(--rs);padding:14px;margin-top:12px}
.advice-text{font-size:14px;color:var(--accent);line-height:1.6}

/* MEAL LIST */
.meal-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.meal-item:last-child{border-bottom:none}
.meal-ava{width:42px;height:42px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.meal-meta{flex:1}
.meal-top{display:flex;align-items:center;justify-content:space-between}
.meal-name{font-size:13px;font-weight:600}
.meal-feel{font-size:12px;color:var(--ink60);margin-top:3px}

/* INSIGHT CARD */
.insight-row{display:flex;gap:10px;align-items:flex-start}
.insight-icon{font-size:22px;flex-shrink:0}
.insight-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink60);margin-bottom:4px}
.insight-val{font-size:14px;line-height:1.5}

/* ONBOARD */
.ob-progress{display:flex;gap:6px;margin-bottom:22px}
.ob-bar{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background .3s}
.ob-bar.done{background:var(--accent)}
.ob-question{font-family:var(--serif);font-size:24px;line-height:1.3;margin-bottom:20px}
.ob-opt{display:flex;align-items:center;gap:10px;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--rs);cursor:pointer;margin-bottom:10px;font-size:15px;transition:all .15s}
.ob-opt.sel{border-color:var(--accent);background:var(--accent-s);color:var(--accent)}

/* HERO */
.hero-title{font-family:var(--serif);font-size:36px;line-height:1.1;margin-top:6px}
.hero-title em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:14px;color:var(--ink60);line-height:1.6;margin-top:8px}

/* ANALYZING */
.analyzing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.spin{display:inline-block;font-size:48px;animation:spin 2s linear infinite}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:999;white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes planPageIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes planPageBack{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .3s ease both}
</style>
</head>

let curScreen = "onboard";

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  curScreen = id;
  const nav = document.getElementById('nav');
  const tabbar = document.getElementById('tabbar');
  const back = document.getElementById('nav-back');
  const title = document.getElementById('nav-title');
  const right = document.getElementById('nav-right');
  if(id==='roadmap'){nav.style.display='none';tabbar.style.display='none';return;}
  nav.style.display='flex';
  const titles={login:'登录',onboard:'MVP 1.0',home:'干饭',camera:'记录这一餐',feedback:'饭后打分',history:'我的记录',insight:'身体',profile:'我的档案',productmap:'产品地图',version:'版本占位',mvp2:'计划',mvp3:'MVP 3.0',mvp4:'MVP 4.0',mvp5:'MVP 5.0'};
  title.textContent = titles[id]||'干饭';
  title.style.display = '';
  title.style.visibility = 'visible';
  back.className = 'nav-back';
  back.onclick = navBack;
  back.innerHTML = '← 返回';
  right.style.width = '88px';
  right.innerHTML = navRightAction(id);
  nav.style.borderBottom = id==='home' ? 'none' : '';
  if(id==='home'){
    title.style.visibility = 'hidden';
    right.style.width = '0px';
    back.className = 'nav-home-left';
    back.onclick = openProfileFromHome;
    back.innerHTML = renderHomeNavLeft();
    back.style.visibility='visible';
    tabbar.style.display='flex';
  }
  else if(id==='insight'||id==='mvp2'){back.style.visibility='hidden';tabbar.style.display='flex';}
  else{back.style.visibility='visible';tabbar.style.display='none';}
  const activeTab = id==='mvp2'?'plan':id==='insight'?'body':id;
  const tabs=['home','plan','body'];
  tabs.forEach(t=>{
    const el=document.getElementById('tab-'+t);
    if(el) el.classList.toggle('active',t===activeTab);
  });
}
function navRightAction(id){
  if(id==='login') return ``;
  if(id==='camera') return ``;
  if(id==='onboard') return `<button onclick="leaveMvpToRoadmap()" style="border:1px solid var(--border);background:var(--white);border-radius:999px;padding:7px 10px;color:var(--ink60);font-family:var(--sans);font-size:12px;cursor:pointer;white-space:nowrap">路线</button>`;
  if(['version','mvp3','mvp4','mvp5'].includes(id)) return `<button onclick="renderRoadmap();show('roadmap')" style="border:1px solid var(--border);background:var(--white);border-radius:999px;padding:7px 10px;color:var(--ink60);font-family:var(--sans);font-size:12px;cursor:pointer;white-space:nowrap">路线</button>`;
  return '';
}

function switchTab(id){
  if(id==='camera'){navBackTarget='home';renderCamera();show('camera');}
  else if(id==='home'){navBackTarget='home';renderHome();show('home');}
  else if(id==='plan'){navBackTarget='home';planTab=planTab||'meal';renderMvpTwo();show('mvp2');}
  else if(id==='body'){navBackTarget='home';bodyTab='puzzle';renderBody();show('insight');}
  else if(id==='history'){navBackTarget=curScreen==='insight'?'insight':'camera';renderHistory();show('history');}
  else if(id==='insight'){bodyTab='puzzle';renderBody();show('insight');}
  else if(id==='profile'){navBackTarget='home';renderProfile();show('profile');}
  else if(id==='productmap'){navBackTarget='profile';renderProductMap();show('productmap');}
}

function computePlanReasoning(){
  const bad=meals.filter(m=>['困倦','胀气'].includes(m.fb?.comfort)||m.fb?.mood==='后悔');
  const good=meals.filter(m=>['舒服','有精神'].includes(m.fb?.comfort)&&m.fb?.mood==='满足');
  const badTags={};
  bad.forEach(m=>(m.analysis?.tags||[]).forEach(t=>badTags[t]=(badTags[t]||0)+1));
  const goodTags={};
  good.forEach(m=>(m.analysis?.tags||[]).forEach(t=>goodTags[t]=(goodTags[t]||0)+1));
  const topBad=Object.entries(badTags).sort((a,b)=>b[1]-a[1])[0];
  const topGood=Object.entries(goodTags).sort((a,b)=>b[1]-a[1])[0];
  return {topBad,topGood,sleepy:bad.filter(m=>m.fb?.comfort==='困倦').length,badCount:bad.length,goodCount:good.length};
}

  if(lines.length===0) lines.push(`基于目标「${goal}」和预算 ${mvp2Budget} 生成，记录更多餐次后推荐会更准`);

let fastStartMs=null;
let fastEatStartMs=Date.now()-2*3600*1000;
let fastingHistory=[
  {durationMin:19*60+29,startLabel:'5月6日 21:39',endLabel:'5月7日 17:08',medal:'gold',dayStr:'2026-05-06'},
  {durationMin:243*60+46,startLabel:'4月26日 17:53',endLabel:'5月6日 21:39',medal:'bronze',dayStr:'2026-04-26'}
];
let fastTimerInterval=null;
const FASTING_PLANS={
  '14:10': {fast:14,eat:10,icon:'🍎',desc:'14 小时空窗，10 小时进食，温和入门'},
  '16:8':  {fast:16,eat:8, icon:'🍊',desc:'最受欢迎，16 小时空窗，8 小时进食'},
  '18:6':  {fast:18,eat:6, icon:'🥝',desc:'18 小时空窗，6 小时进食，进阶减重'},
  '20:4':  {fast:20,eat:4, icon:'🍋',desc:'20 小时空窗，每日 1-2 餐，深度模式'},
  '不启用': {fast:0, eat:24,icon:'🥑',desc:'不记录禁食数据，餐饮计划不受影响'}
};
function getAIFastingRecommendation(){
  const g=getActiveGoal();
  if(g==='减重'||g==='控糖更稳') return '16:8';
  if(g==='改善睡眠'||g==='减少夜宵') return '14:10';
  return '14:10';
}
function fmtHMS(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');
}
function fmtClock(ms){
  const d=new Date(ms);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function startFastTimer(){
  clearInterval(fastTimerInterval);
  fastTimerInterval=setInterval(function(){
    const el=document.getElementById('fast-countdown');
    if(!el){clearInterval(fastTimerInterval);return;}
    const plan=FASTING_PLANS[mvp3FastingPlan]||FASTING_PLANS['16:8'];
    let remaining;
    if(fastingState==='eating'){
      remaining=Math.max(0,fastEatStartMs+plan.eat*3600000-Date.now());
    } else {
      remaining=Math.max(0,fastStartMs+plan.fast*3600000-Date.now());
      if(remaining===0){endFastAuto();return;}
    }
    el.textContent=fmtHMS(remaining);
  },1000);
}
function endFastAuto(){
  clearInterval(fastTimerInterval);
  if(fastStartMs){
    const dur=Math.floor((Date.now()-fastStartMs)/60000);
    const s=new Date(fastStartMs),e=new Date();
    fastingHistory.unshift({
      durationMin:dur,
      startLabel:(s.getMonth()+1)+'月'+s.getDate()+'日 '+String(s.getHours()).padStart(2,'0')+':'+String(s.getMinutes()).padStart(2,'0'),
      endLabel:(e.getMonth()+1)+'月'+e.getDate()+'日 '+String(e.getHours()).padStart(2,'0')+':'+String(e.getMinutes()).padStart(2,'0'),
      medal:dur>=16*60?'gold':'bronze'
    });
  }
  fastingState='eating';fastEatStartMs=Date.now();fastStartMs=null;
  if(curScreen==='mvp2') renderMvpTwo(); else renderMvpThree();
}

  const now=Date.now();
  const isFasting=fastingState==='fasting';

  if(mvp3FastingPlan==='不启用'){
    setTimeout(function(){clearInterval(fastTimerInterval);},0);
    const recPlan=aiRec;
    const curGoal=getActiveGoal();
    return `<div class="card fade" style="border:none;background:var(--cream);padding:32px 24px;text-align:center;border-radius:20px">
      <p style="font-size:48px;margin-bottom:16px">🥑</p>
      <p style="font-size:18px;font-weight:900;margin-bottom:8px">暂未启用断食计划</p>

      <button onclick="selectMvp3FastingPlan('${recPlan}')" style="border:none;background:var(--green);color:#fff;border-radius:999px;padding:14px 28px;font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer">采纳推荐 · ${recPlan}</button>
    </div>`;
  }

  let countdownMs,statusLabel,endTimeLabel,startTimeLabel,barProgress;
  if(isFasting){
    const fastEndMs=fastStartMs+plan.fast*3600000;
    countdownMs=Math.max(0,fastEndMs-now);
    statusLabel='禁食结束还有';
    endTimeLabel=fmtClock(fastEndMs);
    startTimeLabel=fmtClock(fastStartMs);
    barProgress=Math.min(1,(now-fastStartMs)/(plan.fast*3600000));
  } else {
    const eatEndMs=fastEatStartMs+plan.eat*3600000;
    countdownMs=Math.max(0,eatEndMs-now);
    statusLabel='距下次禁食';
    endTimeLabel=fmtClock(eatEndMs);
    startTimeLabel=fmtClock(fastEatStartMs);
    barProgress=Math.min(1,(now-fastEatStartMs)/(plan.eat*3600000));
  }

  const barBg=isFasting?'#FEF3CD':'#D4F0DC';
  const barFill=isFasting?'#FDBA08':'var(--green)';
  const barW=Math.max(6,Math.round(barProgress*100));
  const subtitle=isFasting?(plan.fast+'h 禁食 · 至 '+endTimeLabel):(plan.eat+'h 进食窗口 · 至 '+endTimeLabel);

  let fireBarHtml='';
  let footerText='';
  if(isFasting&&plan.fast>=12){
    const fatBurnMs=fastStartMs+12*3600000;
    const firePos=Math.round(12/plan.fast*100);
    const fatStr=fmtClock(fatBurnMs);
    const hoursLeft=Math.max(0,Math.ceil((fatBurnMs-now)/3600000));
    fireBarHtml='<div style="position:absolute;left:'+firePos+'%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none"><div style="font-size:18px">🔥</div><div style="font-size:10px;color:var(--ink60);white-space:nowrap;background:rgba(255,255,255,.8);border-radius:4px;padding:1px 4px">~'+fatStr+'</div></div>';
    footerText=now<fatBurnMs?('约 '+hoursLeft+' 小时后进入燃脂模式'):'已达到燃脂阶段 · 继续加油 🔥';
  } else {
    footerText=isFasting?'坚持就是胜利，保持状态':'好好享用，准备好了再开始禁食';
  }

  const aiGoal=getActiveGoal();
  const showAiBanner=aiRec!==mvp3FastingPlan;
  const aiBanner=showAiBanner?('<div class="fade" style="background:var(--green-s);border-radius:12px;padding:11px 14px;margin-bottom:18px;display:flex;align-items:center;gap:10px"><span style="font-size:16px">🤖</span><div style="flex:1"><p style="font-size:11px;color:var(--green);font-weight:700">算法建议 · 基于目标「'+aiGoal+'」</p><p style="font-size:13px;color:var(--ink);margin-top:2px">推荐 <strong>'+aiRec+'</strong> 模式</p></div><button onclick="selectMvp3FastingPlan(\''+aiRec+'\')" style="border:none;background:var(--green);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0">采纳</button></div>'):'';

  const btnHtml=isFasting
    ?'<button onclick="openEndFastSheet()" style="border:none;background:#F1F1F1;border-radius:999px;padding:18px 0;font-family:var(--sans);font-size:19px;font-weight:900;color:var(--ink);cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px"><span style="display:inline-block;width:16px;height:16px;background:#FDBA08;border-radius:4px;flex-shrink:0"></span>结束禁食</button>'
    :'<button onclick="openStartFastSheet()" style="border:none;background:#FDBA08;border-radius:999px;padding:18px 0;font-family:var(--sans);font-size:19px;font-weight:900;color:#fff;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:12px">▶ 开始禁食</button>';

  const streak=computeFastStreak();
  const streakBanner=fastingHistory.length>=2?('<div style="display:flex;align-items:center;gap:10px;background:var(--green-s);border-radius:12px;padding:12px 14px;margin-bottom:14px"><span style="font-size:20px">🔥</span><div><p style="font-size:13px;font-weight:700;color:var(--green)">已连续 '+streak+' 天</p><p style="font-size:11px;color:var(--ink60);margin-top:2px">坚持节奏，身体会有感觉的</p></div></div>'):'';

  const histHtml=fastingHistory.slice(0,3).map(function(h){
    const hrs=Math.floor(h.durationMin/60),mins=h.durationMin%60;
    const medal=h.medal==='gold'?'🏆':'🥈';
    return '<div class="meal-item"><div style="flex:1"><p style="font-size:22px;font-weight:900;margin-bottom:4px">'+hrs+' 小时 '+mins+' 分</p><p style="font-size:13px;color:var(--ink60)">'+h.startLabel+' → '+h.endLabel+'</p></div><div style="width:52px;height:52px;border-radius:14px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:26px">'+medal+'</div></div>';
  }).join('');

  setTimeout(function(){startFastTimer();},50);

  return `${aiBanner}<div class="fade" style="display:flex;align-items:center;justify-content:space-between;margin:6px 0 26px">
    <h2 style="font-size:34px;font-weight:900;letter-spacing:-1px">进食节奏</h2>
    <button onclick="showFastingPlanModal()" style="border:none;background:#F1F1F1;border-radius:999px;padding:10px 16px;font-family:var(--sans);font-size:15px;font-weight:800;color:var(--ink60);cursor:pointer">计划 ${mvp3FastingPlan}</button>
  </div>
  <div class="fade" style="text-align:center;margin-bottom:28px">
    <p style="font-size:14px;font-weight:700;color:var(--ink60);margin-bottom:14px">${statusLabel}</p>
    <p id="fast-countdown" style="font-size:60px;font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:10px;font-variant-numeric:tabular-nums">${fmtHMS(countdownMs)}</p>
    <p style="font-size:14px;color:var(--ink60)">${subtitle}</p>
  </div>
  <div class="fade" style="margin:0 0 28px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <p style="font-size:15px;color:var(--ink60)">${startTimeLabel}</p>
      <p style="font-size:15px;color:var(--ink60)">${endTimeLabel}</p>
    </div>
    <div style="height:72px;background:${barBg};border-radius:22px;position:relative;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${barW}%;background:${barFill};border-radius:22px"></div>
      ${fireBarHtml}
    </div>
    <p style="font-size:13px;color:var(--ink60);text-align:center;margin-top:14px">${footerText}</p>
  </div>
  <div class="fade" style="margin-bottom:36px">${btnHtml}</div>
  <div class="fade">
    <p style="font-size:16px;color:var(--ink30);margin-bottom:16px;font-weight:600">历史记录</p>
    ${streakBanner}
    ${histHtml||'<p style="font-size:14px;color:var(--ink60);text-align:center;padding:20px 0">完成第一次禁食后记录会出现在这里</p>'}
  </div>`;
}

function confirmEndFast(){
  let recorded=false;
  if(fastStartMs){
    const dur=Math.floor((Date.now()-fastStartMs)/60000);
    if(dur>=9*60){
      const s=new Date(fastStartMs),e=new Date();
      const dayStr=e.getFullYear()+'-'+String(e.getMonth()+1).padStart(2,'0')+'-'+String(e.getDate()).padStart(2,'0');
      fastingHistory.unshift({
        durationMin:dur,
        startLabel:(s.getMonth()+1)+'月'+s.getDate()+'日 '+String(s.getHours()).padStart(2,'0')+':'+String(s.getMinutes()).padStart(2,'0'),
        endLabel:(e.getMonth()+1)+'月'+e.getDate()+'日 '+String(e.getHours()).padStart(2,'0')+':'+String(e.getMinutes()).padStart(2,'0'),
        medal:dur>=16*60?'gold':'bronze',
        dayStr
      });
      recorded=true;
    }
  }
  fastingState='eating';fastEatStartMs=Date.now();fastStartMs=null;
  clearInterval(fastTimerInterval);
  document.querySelectorAll('[data-end-fast-sheet]').forEach(function(e){e.remove();});
  document.querySelectorAll('[data-fast-meal-check]').forEach(function(e){e.remove();});
  if(curScreen==='mvp2') renderMvpTwo(); else renderMvpThree();
  if(recorded){
    const streak=computeFastStreak();
    setTimeout(()=>showFastCelebration(streak),400);
  }
}

function computeFastStreak(){
  const days=[...new Set(fastingHistory.map(h=>h.dayStr).filter(Boolean))].sort().reverse();
  if(!days.length) return fastingHistory.length;
  let streak=1;
  for(let i=0;i<days.length-1;i++){
    const diff=(new Date(days[i])-new Date(days[i+1]))/(86400000);
    if(diff<=2) streak++; else break;
  }
  return streak;
}

function renderMvp3Weight(){
  return `
  <div class="card fade" style="border:none;background:linear-gradient(180deg,var(--accent-s),var(--white));padding:22px">
    <div class="label">算法判断</div>

// ── ONBOARD ───────────────────────────────────────────────────────────────────
function renderOnboard(){
  const s=document.getElementById('s-onboard');
  const step=obSteps[obStep];
  const sel=profile[step.key]||'';
  const bars=obSteps.map((_,i)=>`<div class="ob-bar${i<=obStep?' done':''}"></div>`).join('');
  const opts=step.opts.map(o=>`<div class="ob-opt${sel===o?' sel':''}" onclick="obSelect('${o}')">${sel===o?'● ':'○ '}${o}</div>`).join('');
  s.innerHTML=`
  <div class="fade">
    <div class="ob-progress">${bars}</div>
    <p style="font-size:12px;color:var(--ink60);margin-bottom:6px">${obStep+1} / ${obSteps.length}</p>
    <p class="ob-question">${step.q}</p>
    <div style="margin-bottom:24px">${opts}</div>
    <button class="btn btn-primary" id="ob-next" onclick="obNext()" ${sel?'':'disabled'} style="opacity:${sel?1:.4}">
      ${obStep<obSteps.length-1?'继续 →':'开始记录 →'}
    </button>
  </div>`;
}
function obSelect(val){
  profile[obSteps[obStep].key]=val;
  renderOnboard();
}
function obNext(){
  if(!profile[obSteps[obStep].key]) return;
  if(obStep<obSteps.length-1){obStep++;renderOnboard();}
  else{renderHome();show('home');}
}

function renderHome(){

  const h=new Date().getHours();

  if(h>=10&&h<14) return '午安';

  return '夜深了';
}
function renderHomePlanHint(){
  const goal=getActiveGoal();
  return `<div class="fade" style="margin-top:10px;background:var(--cream);border-radius:16px;padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="switchTab('plan')">

}
function renderHomeFastHint(){
  const plan=FASTING_PLANS[mvp3FastingPlan]||FASTING_PLANS['16:8'];
  const fastEndMs=fastStartMs+plan.fast*3600000;

  return `<div class="fade" style="margin-top:10px;background:#FEF3CD;border-radius:16px;padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="switchTab('plan')">

  </div>`;
}

function getHomeScene(){
  const n=Math.min(meals.length,7);
  const scene=getCurrentMealScene();
  const todayStart=new Date();todayStart.setHours(0,0,0,0);
  const todayMeals=meals.filter(m=>(m.ts||0)>=todayStart.getTime());
  const latest=todayMeals[todayMeals.length-1];
  if(forceHomeRecordDefault){
    return renderHomeBeforeMeal(scene,n,'默认');
  }
  if(latest && latest.fb?.comfort && justCompletedMealId===latest.id){
    return renderHomeDone(latest,n);
  }
  if(pendingAnalysis && mealEatingStarted){
    return renderHomeFeedback(scene);
  }
  if(pendingAnalysis){
    return renderHomeEating(scene);
  }
  return renderHomeBeforeMeal(scene,n);
}

function getHomeRecordImage(){
  if(wideImg) return wideImg;
  const todayStart=new Date();todayStart.setHours(0,0,0,0);
  const latest=[...meals].reverse().find(m=>(m.ts||0)>=todayStart.getTime()&&m.wideImg);
  return latest?.wideImg||null;
}

function homeRecordSlide(action){
  if(action==='direct') startDirectMealRecord();
  if(action==='backfill') startBackfillMealRecord();
}

function isLateNightWithDinner(){
  const h=new Date().getHours();
  if(h<21&&h>=5) return false;
  const todayStart=new Date();todayStart.setHours(0,0,0,0);
  return meals.some(m=>(m.ts||0)>=todayStart.getTime()&&['晚饭','晚餐'].includes(m.type));
}

function getLateNightMealAdvice(){
  const lateSnacks=meals.filter(m=>{
    const h=new Date(m.ts||0).getHours();
    return (h>=21||h<5)&&['加餐','晚饭'].includes(m.type)&&m.fb?.comfort;
  });
  const bad=lateSnacks.filter(m=>['困倦','胀气'].includes(m.fb.comfort));
  const badRate=lateSnacks.length>0?bad.length/lateSnacks.length:0;
  if(lateSnacks.length>=2&&badRate>0.5){
    return {type:'skip',headline:'根据你的数据，建议今晚不吃了',body:`你过去 ${lateSnacks.length} 次夜间进食里，${bad.length} 次之后身体不舒服。夜间消化负担对你影响比较大。`,options:[]};
  }
  const goal=getActiveGoal();
  const opts=goal==='减重'?['无糖酸奶 + 少量坚果','黄瓜 / 番茄']:
             goal==='改善睡眠'?['温牛奶','香蕉（含色氨酸）','低糖燕麦']:
             ['无糖酸奶','水果（苹果/梨）','温牛奶'];
  return {type:'light',headline:'晚上再吃，选轻的',body:lateSnacks.length>=2?`你的夜间进食记录还好，不过消化系统到晚上工作效率低，建议选清淡的。`:'没有足够的夜宵数据，先按通用建议来。',options:opts};
}

function openLateNightAdviceSheet(onProceed){
  const advice=getLateNightMealAdvice();
  const overlay=document.createElement('div');
  overlay.dataset.lateNightSheet='1';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(26,22,18,.38);z-index:700;display:flex;align-items:flex-end;padding:20px';
  const optHtml=advice.options.length?`<div style="margin:12px 0">${advice.options.map(o=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)"><span style="font-size:16px">✓</span><p style="font-size:14px;color:var(--ink)">${o}</p></div>`).join('')}</div>`:'';
  overlay.innerHTML=`<div style="background:var(--white);border-radius:24px 24px 20px 20px;padding:24px;width:100%;max-width:420px;margin:0 auto;animation:fadeUp .3s ease">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <span style="font-size:26px">${advice.type==='skip'?'🌙':'🥗'}</span>
      <p style="font-family:var(--serif);font-size:20px;line-height:1.3">${advice.headline}</p>
    </div>
    <p style="font-size:13px;color:var(--ink60);line-height:1.6;margin-bottom:4px">${advice.body}</p>
    ${optHtml}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
      <button onclick="document.querySelectorAll('[data-late-night-sheet]').forEach(e=>e.remove())" style="border:1.5px solid var(--border);background:transparent;border-radius:14px;padding:14px;font-family:var(--sans);font-size:14px;cursor:pointer;color:var(--ink)">${advice.type==='skip'?'不吃了':'知道了'}</button>
      <button onclick="document.querySelectorAll('[data-late-night-sheet]').forEach(e=>e.remove());(${onProceed})()" style="border:none;background:var(--accent);color:#fff;border-radius:14px;padding:14px;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer">继续记录</button>
    </div>
  </div>`;
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}

function escapeHtml(value){

function getLastAIError(){

function rememberAIError(error){
  const info = {
    message: String(error?.message || error || '未知错误').slice(0,240),
    status: error?.status || null,
    raw: String(error?.raw || '').slice(0,500),
    model: AI_CONFIG.model,
    endpoint: AI_CONFIG.endpoint,
    at: new Date().toLocaleString(),
  };
  localStorage.setItem('ai_last_error', JSON.stringify(info));
}

function apiErrorMessage(status, raw){
  let detail = '';
  try {
    const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
    detail = parsed?.error?.message || parsed?.message || parsed?.detail || JSON.stringify(parsed);
  } catch(_) {
    detail = String(raw || '').trim();
  }
  return detail ? `API error ${status}: ${detail}` : `API error ${status}`;
}

function createAIError(status, raw){
  const err = new Error(apiErrorMessage(status, raw));
  err.status = status;
  err.raw = raw;
  return err;
}

function describeAIError(error){
  const msg = String(error?.message || error || '未知错误');
  const status = error?.status || (msg.match(/API error\s+(\d+)/i)?.[1] || '');
  const raw = String(error?.raw || '').trim();
  const isTimeout = String(status).toUpperCase() === 'TIMEOUT' || /timeout/i.test(msg);
  return {
    status: status || (isTimeout ? 'TIMEOUT' : (/Failed to fetch|NetworkError|Load failed/i.test(msg) ? 'NETWORK' : 'UNKNOWN')),
    message: isTimeout ? `${msg}。前端在限定时间内没有收到 HTTP 响应，这不是 400/401/500 状态码。` : msg,
    raw,
  };
}

function chatEndpointToModelsUrl(endpoint){
  try {
    const url = new URL(endpoint);
    url.pathname = url.pathname.replace(/\/chat\/completions\/?$/,'/models');
    return url.toString();
  } catch(_) {
    return '';
  }
}

async function rawAIRequest(url, options={}, timeoutMs=30000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, {...options, signal:controller.signal});
    const raw = await res.text().catch(()=>'');
    return {ok:res.ok, status:res.status, raw};
  } catch(e) {
    if(e?.name === 'AbortError') return {ok:false, status:'TIMEOUT', raw:`Request timeout after ${Math.round(timeoutMs/1000)}s`};
    return {ok:false, status:'NETWORK', raw:e?.message || 'Network request failed'};
  } finally {
    clearTimeout(timer);
  }
}

function extractJsonObject(text){
  if(!text) throw new Error('AI 返回为空');
  const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const source = fenced ? fenced[1] : text;
  try { return JSON.parse(source.trim()); } catch(_){}
  const start = source.indexOf('{');
  const end = source.lastIndexOf('}');
  if(start === -1 || end === -1 || end <= start) throw new Error('AI 返回中没有 JSON');
  try {
    return JSON.parse(source.slice(start, end + 1));
  } catch(e) {
    const body = source.slice(start, end + 1);
    const openBraces = (body.match(/\{/g)||[]).length;
    const closeBraces = (body.match(/\}/g)||[]).length;
    const openBrackets = (body.match(/\[/g)||[]).length;
    const closeBrackets = (body.match(/\]/g)||[]).length;
    const preview = source.slice(start, Math.min(end + 1, start + 360)).replace(/\s+/g,' ');
    if(openBraces !== closeBraces || openBrackets !== closeBrackets){
      throw new Error(`AI 返回 JSON 被截断或括号未闭合；返回片段：${preview}`);
    }
    throw new Error(`${e.message}；返回片段：${preview}`);
  }
}

function toArray(v, fallback=[]){

function normalizeFoodType(v){
  return FOOD_TYPE_LABELS[v] ? v : 'unknown';
}

function defaultTypeFields(foodType, analysis){
  const type = normalizeFoodType(foodType);
  const fields = {};
  (FOOD_TYPE_FIELDS[type] || FOOD_TYPE_FIELDS.unknown).forEach(([key, _label, fallback])=>{
    fields[key] = fallback;
  });
  if(type === 'meal'){
    fields.staple = analysis?.portion || fields.staple;
    fields.oil = analysis?.oilLevel || fields.oil;
  }
  return fields;
}

function normalizeRecognizedFoods(v, fallbackName){
  const list = toArray(v).map((item, idx)=>{
    const x = item && typeof item === 'object' ? item : {name:String(item || '')};
    const quantityText = x.quantityText || x.portion || '待确认';
    const grams = Number(x.estimatedWeightGrams ?? x.weightGrams ?? x.grams);
    return {
      name: x.name || fallbackName || `食物 ${idx+1}`,
      category: x.category || '待确认',
      quantityText,
      estimatedWeightGrams: Number.isFinite(grams) ? grams : null,
      portion: x.portion || quantityText,
      nutritionContribution: normalizeNutritionContribution(x.nutritionContribution || x.nutrition || {}),
      confidence: x.confidence || 'medium',
    };
  }).filter(x=>x.name);
  return list.length ? list : [{name:fallbackName || '这一餐',category:'待确认',quantityText:'待确认',estimatedWeightGrams:null,portion:'待确认',nutritionContribution:normalizeNutritionContribution({}),confidence:'low'}];
}

function normalizeNutritionContribution(v){
  const n = v && typeof v === 'object' ? v : {};
  return {
    calories: n.calories || '',
    protein: n.protein || '',
    fat: n.fat || '',
    carbs: n.carbs || '',
    fiber: n.fiber || '',
    sodium: n.sodium || '',
    sugar: n.sugar || '',
    caffeine: n.caffeine || '',
  };
}

function normalizeNutritionEstimate(v, foodType){
  const n = v && typeof v === 'object' ? v : {};
  const metric = (key, fallbackLevel, fallbackRange='暂无法估算')=>{
    const raw = n[key];
    if(raw && typeof raw === 'object'){
      return {
        range: raw.range || raw.value || fallbackRange,
        level: raw.level || fallbackLevel,
        basis: raw.basis || '',
      };
    }
    return {
      range: typeof raw === 'string' && /\d/.test(raw) ? raw : fallbackRange,
      level: typeof raw === 'string' && !/\d/.test(raw) ? raw : fallbackLevel,
      basis: '',
    };
  };
  return {
    calories: metric('calories','待确认','无法准确估算'),
    carbs: metric('carbs','待确认'),
    protein: metric('protein','待确认'),
    fat: metric('fat','待确认'),
    fiber: metric('fiber','待确认'),
    vitamins: metric('vitamins','待确认'),
    sodium: metric('sodium','待确认'),
    sugar: metric('sugar', foodType==='drink'||foodType==='dessert'?'待确认':'不明显'),
    caffeine: metric('caffeine', foodType==='drink'?'待确认':'无'),
    confidence: n.confidence || '粗估',
  };
}

function normalizeExpectedReactions(v){
  return toArray(v).map(item=>{
    if(item && typeof item === 'object'){
      return {
        name: item.name || item.reaction || '待观察',
        reason: item.reason || item.basis || '需要饭后反馈验证',
        evidence: item.evidence || '',
      };
    }
    return {name:String(item), reason:'需要饭后反馈验证', evidence:''};
  }).filter(x=>x.name).slice(0,3);
}

function normalizeEatingAdvice(v, fallbackAdvice, foodType){

function normalizeMealAnalysis(raw){
  const a = raw && typeof raw === 'object' ? raw : {};
  const source = a._source || 'mock';
  const useMockFallback = source !== 'ai';
  const fallback = useMockFallback ? mockAnalysis() : {};
  const foodType = normalizeFoodType(a.foodType || fallback.foodType || (useMockFallback ? 'meal' : 'unknown'));
  const typeFields = {
    ...defaultTypeFields(foodType, a),
    ...(useMockFallback ? (fallback.typeFields || {}) : {}),
    ...(a.typeFields || {}),
  };
  return {
    ...fallback,
    ...a,
    foodType,
    typeFields,
    recognizedFoods: normalizeRecognizedFoods(a.recognizedFoods || (useMockFallback ? fallback.recognizedFoods : null), a.dish || fallback.dish || (useMockFallback ? inferDishFromAnalysis(fallback) : '这一餐')),
    nutritionEstimate: normalizeNutritionEstimate(a.nutritionEstimate || (useMockFallback ? fallback.nutritionEstimate : null), foodType),
    eatingAdvice: normalizeEatingAdvice(a.eatingAdvice || (useMockFallback ? fallback.eatingAdvice : null), a.advice || (useMockFallback ? fallback.advice : ''), foodType),
    dish: a.dish || fallback.dish || (useMockFallback ? inferDishFromAnalysis(a) : '这一餐'),
    cuisine: a.cuisine || fallback.cuisine || '家常菜',
    province: a.province || fallback.province || '全国',
    scene: a.scene || '外卖',
    structure: a.structure || fallback.structure || '图片信息不足，等待补全识别结果',
    portion: a.portion || '适中',
    oilLevel: a.oilLevel || '中',
    tags: toArray(a.tags, fallback.tags || []).slice(0,3),

// ── 工具函数：调用 OpenAI-compatible 大模型接口 ──────
async function callModel(systemPrompt, userContent, maxTokens=1024, options={}){
  const timeoutMs = options.timeoutMs || 20000;
  const useStream = options.stream === true;
  const baseBody = {
    model: AI_CONFIG.model,
    max_tokens: maxTokens,
    temperature: 0.2,
    messages:[
      { role:'system', content: systemPrompt },
      { role:'user', content: userContent },
    ],
  };
  async function requestJsonMode(useJsonMode){
    const body = useJsonMode ? {...baseBody, response_format:{type:'json_object'}} : baseBody;
    if(useStream) body.stream = true;
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), timeoutMs);
    let res;
    try {
      res = await fetch(AI_CONFIG.endpoint, {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization': `Bearer ${AI_CONFIG.key}`,
        },
        body: JSON.stringify(body),
        signal: controller.signal,
      });
    } catch(e) {
      if(e?.name === 'AbortError'){
        const err = new Error(`Request timeout after ${Math.round(timeoutMs/1000)}s`);
        err.status = 'TIMEOUT';
        throw err;
      }
      const err = new Error(e?.message || 'Network request failed');
      err.status = 'NETWORK';
      throw err;
    } finally {
      clearTimeout(timer);
    }
    if(!res.ok){
      const raw = await res.text().catch(()=>'');
      throw createAIError(res.status, raw);
    }
    if(useStream){
      let fullText = '';
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      try {
        while(true){
          const {done, value} = await reader.read();
          if(done) break;
          const chunk = decoder.decode(value, {stream:true});
          const lines = chunk.split('\n');
          for(const line of lines){
            if(line.startsWith('data:')) {
              const json = line.slice(5).trim();
              if(json === '[DONE]') break;
              try {
                const delta = JSON.parse(json);
                if(delta.choices?.[0]?.delta?.content){
                  fullText += delta.choices[0].delta.content;
                }
              } catch(_){}
            }
          }
        }
      } finally {
        reader.releaseLock();
      }
      return extractJsonObject(fullText);
    }
    const data = await res.json();
    const text = data.choices?.[0]?.message?.content || '';
    return extractJsonObject(text);
  }
  try {
    return await requestJsonMode(aiProvider()==='openai');
  } catch(e) {
    if(!/response_format|json_object|schema/i.test(e.message)) throw e;
    return requestJsonMode(false);
  }
}

// ── 图片转 base64 ──────────────────────────────────────────────────
async function imgToBase64(url){
  // data URL: extract base64 directly, no fetch needed
  if(url.startsWith('data:')) return url.split(',')[1];
  const res = await fetch(url);
  if(!res.ok) throw new Error(`fetch image failed: ${res.status}`);
  const blob = await res.blob();
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function imgMediaType(url){
  if(url.startsWith('data:')) return url.split(';')[0].slice(5);
  return 'image/jpeg';
}

// 压缩图片到 maxPx 最长边，始终输出 JPEG，解决手机大图 400 问题
function compressImage(dataUrl, maxPx=1568, quality=0.85){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, maxPx/Math.max(img.width, img.height));
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror=()=>resolve(dataUrl); // fallback: use original
    img.src=dataUrl;
  });
}

    onProgress?.('phase1', phase1Result);

    // Phase2 异步更新（不阻塞主流程）
    phase2Promise.then(phase2Raw => {

const DISH_MAP = {
  '蛋白质足+搭配均衡': ['鸡胸肉饭','番茄鸡蛋面','清蒸鱼+米饭','牛肉炒饭'],
  '主食偏多+少蔬菜':   ['黄焖鸡米饭','红烧肉饭','排骨饭','猪脚饭'],
  '高油+易困倦':       ['炸鸡饭','麻辣烫','油炸外卖','汉堡套餐'],
  '低负担':            ['鸡胸肉沙拉','清汤面','蒸蔬菜+蛋','轻食沙拉碗'],
  '探索':              ['泰式柠檬鸡','越南春卷','日式定食','韩式拌饭'],
};
function tagsToDish(tags){
  const key = Object.keys(DISH_MAP).find(k=>tags.some(t=>k.includes(t)));
  const list = key ? DISH_MAP[key] : DISH_MAP['低负担'];
  return list[Math.floor(Math.random()*list.length)];
}

// 计算距今天数（用记录序号模拟）
function daysSince(mealIdx){
  const diff = meals.length - 1 - mealIdx;
  if(diff===0) return '今天';
  if(diff===1) return '昨天';
  return `${diff} 天前`;
}

function buildCardPool(){
  const good = meals.map((m,i)=>({...m,idx:i}))
    .filter(m=>['舒服','有精神'].includes(m.fb.comfort) && m.fb.mood==='满足');
  const bad  = meals.map((m,i)=>({...m,idx:i}))
    .filter(m=>['困倦','胀气'].includes(m.fb.comfort) || m.fb.mood==='后悔');

  const pool = [];

  // ① 好评复现卡 —— 找评价最高且最近的菜品
  if(good.length>=1){
    const best = good[good.length-1];
    const dish = tagsToDish(best.analysis.tags||[]);
    const count = good.length;
    const lastTime = daysSince(best.idx);
    const goodCount = good.filter(m=>
      (m.analysis.tags||[]).some(t=>(best.analysis.tags||[]).includes(t))
    ).length;
    pool.push({
      type:'repeat',
      emoji:'⭐',
      badge:'历史好评',
      dish,
      tags: best.analysis.tags||[],
      risk: best.analysis.risk,
      reason: `吃了 ${goodCount} 次，每次都${best.fb.comfort}，上次是${lastTime}`,
      advice: best.analysis.advice,
    });
  }

  // ② 久未出现卡 —— 好评但超过5餐没出现
  const oldGood = good.filter(m=> meals.length - 1 - m.idx >= 5);
  if(oldGood.length>=1){
    const old = oldGood[0];
    const dish = tagsToDish(old.analysis.tags||[]);
    const lastTime = daysSince(old.idx);
    pool.push({
      type:'revisit',
      emoji:'🕰️',
      badge:'许久未见',
      dish,
      tags: old.analysis.tags||[],
      risk: old.analysis.risk,
      reason: `上次吃是${lastTime}，但你吃完感觉${old.fb.comfort}，是时候再来一次了`,
      advice: old.analysis.advice,
    });
  }

  // ③ 规避差评安全牌 —— 针对最近一次差评反向推荐
  const safeDish = ['鸡胸肉饭','番茄鸡蛋面','清蒸鱼+米饭','牛肉蔬菜碗'][Math.floor(Math.random()*4)];
  if(bad.length>=1){
    const lastBad = bad[bad.length-1];
    const badDish = tagsToDish(lastBad.analysis.tags||[]);
    const lastTime = daysSince(lastBad.idx);
    pool.push({
      type:'safe',
      emoji:'🛡️',
      badge:'安全牌',
      dish: safeDish,
      tags:['蛋白质足','少油'],
      risk:'low',
      reason: `上次吃${badDish}（${lastTime}）你${lastBad.fb.comfort}了，今天换这个`,
      advice:'先吃蛋白质和蔬菜，主食留到最后，吃七分饱就停。',
    });
  } else {
    pool.push({
      type:'safe',
      emoji:'🛡️',
      badge:'安全牌',
      dish: safeDish,
      tags:['蛋白质足','少油'],
      risk:'low',
      reason:'蛋白质足+少油的经典组合，稳定出好状态',
      advice:'先吃蛋白质和蔬菜，主食留到最后，吃七分饱就停。',
    });
  }

  // ④ 探索卡（兜底，始终存在）
  const exploreDish = DISH_MAP['探索'][Math.floor(Math.random()*DISH_MAP['探索'].length)];
  pool.push({
    type:'explore',
    emoji:'🎲',
    badge:'探索一下',
    dish: exploreDish,
    tags:['未记录','轻食'],
    risk:'low',
    reason:'你还没记录过这个，试一次，看看身体怎么反应',
    advice:'新食物第一次不要吃太多，方便观察自己的反应。',
  });

  // 每次取3张：优先级排序后取前3
  return pool.slice(0,3);
}

function selectState(val, btn){
  todayState = val;
  document.querySelectorAll('#state-grid button').forEach(b=>{
    b.style.borderColor='var(--border)';
    b.style.background='var(--white)';
    b.style.color='var(--ink60)';
  });
  btn.style.borderColor='var(--accent)';
  btn.style.background='var(--accent-s)';
  btn.style.color='var(--accent)';
  // 选完状态后显示抽卡区域
  setTimeout(()=>{
    document.getElementById('card-area').style.display='block';
    document.getElementById('card-area').scrollIntoView({behavior:'smooth',block:'start'});
    // 根据状态调整卡池顺序
    adjustCardPoolByState();
    refreshCardsFromAIByState();
  }, 200);
}

function refreshCardsFromAIByState(){
  const sub = document.getElementById('card-back-sub');
  if(!aiReady()){
    if(sub) sub.textContent = `基于你的 ${meals.length} 餐记录`;
    return;
  }
  if(sub) sub.textContent = 'AI 正在结合状态和历史抽卡...';
  aiGenerateCards(meals, profile, todayState).then(aiCards=>{
    if(!aiCards || !aiCards.length || cardPhase==='revealed') return;
    cardPool = aiCards;
    cardIdx = 0;
    if(sub) sub.textContent = `AI 已参考 ${meals.length} 餐记录和当前状态`;
    toast('AI 已生成餐前建议卡');
  }).catch(e=>{
    console.warn('AI卡池刷新失败:', e.message);
    if(sub) sub.textContent = `基于你的 ${meals.length} 餐记录`;
  });
}

function adjustCardPoolByState(){
  // 根据今天状态重排卡池
  if(todayState==='想吃点清淡'){
    // 把安全牌提前
    const safe=cardPool.find(c=>c.type==='safe');
    if(safe){ cardPool=cardPool.filter(c=>c.type!=='safe');cardPool.unshift(safe); }
  } else if(todayState==='想吃点好的'||todayState==='心情不错'){
    // 把探索卡提前
    const exp=cardPool.find(c=>c.type==='explore');
    if(exp){ cardPool=cardPool.filter(c=>c.type!=='explore');cardPool.unshift(exp); }
  } else if(todayState==='很累很困'){
    // 把低风险的卡提前
    cardPool.sort((a,b)=>(a.risk==='low'?-1:1));
  }
}

function flipCard(){
  if(cardPhase==='revealed') return;
  cardPhase='revealed';
  drawnCard = cardPool[cardIdx];
  document.getElementById('card-inner').style.transform='rotateY(180deg)';
  const c = drawnCard;
  const tagHtml = (c.tags||[]).map(t=>`<span class="chip chip-green" style="font-size:11px">${t}</span>`).join('');
  const riskColor = c.risk==='low'?'var(--green)':c.risk==='medium'?'var(--amber)':'var(--red)';
  document.getElementById('card-front').innerHTML=`
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:24px">${c.emoji}</span>
          <span style="font-size:11px;font-weight:600;color:var(--ink60);text-transform:uppercase;letter-spacing:.06em">${c.badge}</span>
        </div>
        <span style="font-size:11px;font-weight:600;color:${riskColor}">${c.risk==='low'?'✓ 低负担':c.risk==='medium'?'⚡ 适中':'⚠ 高负担'}</span>
      </div>
      <p style="font-family:var(--serif);font-size:28px;font-weight:400;line-height:1.2;margin-bottom:10px">${c.dish}</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${tagHtml}</div>
      <div style="background:var(--cream);border-radius:var(--rs);padding:10px 12px">
        <p style="font-size:13px;color:var(--ink60);line-height:1.6">${c.reason}</p>
      </div>
    </div>
    <div style="background:var(--accent-s);border-radius:var(--rs);padding:10px 12px;margin-top:12px">
      <p style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em">吃法建议</p>
      <p style="font-size:13px;color:var(--accent);line-height:1.5">${c.advice}</p>
    </div>`;
  setTimeout(()=>{ document.getElementById('card-actions').style.display='block'; },500);
}

function rerollCard(){
  cardIdx = (cardIdx+1) % cardPool.length;
  drawnCard = cardPool[cardIdx];
  const remaining = cardPool.length - 1 - (cardIdx % cardPool.length);
  // 重新翻转回背面再翻到新正面
  const inner = document.getElementById('card-inner');
  inner.style.transition='transform .3s';
  inner.style.transform='rotateY(0deg)';
  document.getElementById('card-actions').style.display='none';
  cardPhase='draw';
  setTimeout(()=>{
    inner.style.transition='transform .6s cubic-bezier(.4,0,.2,1)';
    flipCard();
    const rb=document.getElementById('reroll-btn');
    if(rb) rb.textContent=`换一张 （还剩 ${remaining} 张）`;
    if(remaining<=0 && rb) rb.style.display='none';
  },320);
}

function guessMealType(){
  const h=new Date().getHours();
  if(h>=5&&h<10) return '早饭';
  if(h>=10&&h<14) return '午饭';
  if(h>=14&&h<17) return '加餐';
  if(h>=17&&h<21) return '晚饭';
  return '加餐';
}

  s.innerHTML=`

  <div class="score-row fade" id="meal-type-row" style="margin-bottom:20px">
    ${['早饭','午饭','晚饭','加餐'].map(t=>`<button class="score-btn${t===camMealType?' sel':''}" onclick="selectMealType('${t}')">${t}</button>`).join('')}

    <div class="uz-icon">📷</div>
    <p>拍整份餐盒 / 整桌</p>
    <p style="font-size:11px;color:var(--ink30);margin-top:4px">让食物都入镜</p>
  </div>
  <div id="analysis-area"></div>
  <button class="btn btn-ghost fade" style="margin-top:4px" onclick="mockAnalyze()">没有照片，用模拟数据试试 →</button>`;

  document.getElementById('file-wide').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const previewUrl=URL.createObjectURL(f);
    const uz=document.getElementById('uz-wide');
    uz.style.padding='0';uz.style.border='none';uz.style.borderRadius='var(--r)';uz.style.overflow='hidden';uz.style.marginBottom='0';
    uz.innerHTML=`<img src="${previewUrl}" style="width:100%;height:200px;object-fit:cover;display:block;border-radius:var(--r)">`;
    e.target.value='';
    // Read as data URL so AI gets correct media_type and blob URLs don't fail
    const reader=new FileReader();
    reader.onloadend=()=>{ wideImg=reader.result; startInlineAnalyze(); };

function selectMealType(t){
  camMealType=t;
  document.querySelectorAll('#meal-type-row .score-btn').forEach(b=>{
    b.classList.toggle('sel',b.textContent===t);
  });
}
function startInlineAnalyze(){
  renderAnalysisProgress('recognition');
  pendingMealType=camMealType;
  if(wideImg && aiReady()){
    aiAnalyzeMeal(wideImg, profile, meals, (step, data)=>{
      if(step === 'phase1' && data){
        // 阶段1完成：立刻展示核心结果，卡片区域显示骨架屏
        pendingAnalysis = data;
        showInlineResult(true);
      } else if(step === 'phase2'){
        // 阶段2后台运行，进度条静默推进
        renderAnalysisProgress('phase2');
      } else {
        renderAnalysisProgress(step);
      }
    }).then(result=>{
      if(result){
        // 阶段2完成：用真实数据替换骨架屏，无滚动跳动
        pendingAnalysis = result;
        updateAnalysisDetails(result);
        setTimeout(() => enableEditableAnalysis(), 800);
      }
    });
  } else {
    pendingAnalysis = mockAnalysis();
    setTimeout(() => {
      showInlineResult(true);
      setTimeout(() => enableEditableAnalysis(), 1600);
    }, 1600);
  }
}

function renderAnalysisProgress(step){
  const area=document.getElementById('analysis-area');
  if(!area) return;
  const steps=[
    ['recognition','识别餐图结构'],
    ['phase2','补全营养详情'],
  ];
  const idx=Math.max(0,steps.findIndex(s=>s[0]===step));
  area.innerHTML=`<div style="padding:24px 0">
    <div style="text-align:center;margin-bottom:16px">
      <div class="spin" style="font-size:32px">🔍</div>
      <p style="font-size:14px;font-weight:800;color:var(--ink);margin-top:10px">${steps[idx]?.[1]||'分析中'}</p>
      <p style="font-size:12px;color:var(--ink60);margin-top:4px">正在用真实模型快速分析这张餐图</p>
    </div>
    <div style="display:flex;gap:8px">
      ${steps.map((s,i)=>`<div style="flex:1;height:5px;border-radius:999px;background:${i<=idx?'var(--accent)':'var(--border)'}"></div>`).join('')}
    </div>
  </div>`;
}

function shortAIErrorMessage(error){
  const msg = String(error?.message || error || '真实 AI 分析暂时失败');
  if(/API error 401|unauthorized|invalid api key/i.test(msg)) return 'Key 无效或无权限，请检查 API Key。';
  if(/API error 400|model|vision|image/i.test(msg)) return '模型或图片识别参数不匹配，请换一个支持视觉的模型。';
  if(/API error 429|rate limit|quota/i.test(msg)) return '额度或并发受限，请稍后重试或换 Key。';
  if(/API error 500|unknown error|server/i.test(msg)) return '模型服务端返回异常，请重试或换一个视觉模型。';
  return msg.slice(0,120);
}

function renderAnalysisFailure(error){
  const area=document.getElementById('analysis-area');
  if(!area) return;
  const message = shortAIErrorMessage(error);
  const raw = escapeHtml(String(error?.message || error || '').slice(0,180));
  area.innerHTML=`<div class="fade" style="padding:22px 0 8px">
    <div style="background:var(--red-s);border:1px solid rgba(192,57,43,.18);border-radius:var(--r);padding:18px;text-align:left">
      <p style="font-size:15px;font-weight:800;color:var(--red);margin-bottom:6px">AI 分析失败</p>
      <p style="font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:8px">${escapeHtml(message)}</p>
      ${raw?`<p style="font-size:11px;color:var(--ink60);line-height:1.5;overflow-wrap:anywhere;margin-bottom:14px">原始错误：${raw}</p>`:''}
      <div style="display:grid;grid-template-columns:1fr;gap:9px">
        <button class="btn btn-primary" onclick="retryInlineAnalyze()">重新分析</button>
        <button class="btn" onclick="reselectMealPhoto()" style="border:1.5px solid var(--border);background:var(--white);color:var(--ink)">重新选择照片</button>

}

function retryInlineAnalyze(){
  if(!wideImg){
    reselectMealPhoto();
    return;
  }

}

function reselectMealPhoto(){

}

function mockAnalyze(){

  uz.style.padding='0';uz.style.border='2px dashed var(--border)';uz.style.borderRadius='var(--r)';uz.style.padding='28px 20px';uz.style.background='var(--cream)';

  area.innerHTML=`<div style="text-align:center;padding:28px 0">
    <div class="spin" style="font-size:32px">🔍</div>
    <p style="font-size:13px;color:var(--ink60);margin-top:10px">识别食物结构…</p>

function showInlineResult(isPartial){
  const a=normalizeMealAnalysis(pendingAnalysis);

  const area=document.getElementById('analysis-area');
  const tags=(a.tags||[]).map(t=>`<span class="chip chip-amber" style="margin-right:4px">${t}</span>`).join('');

  const n = normalizeNutritionEstimate(a.nutritionEstimate, a.foodType);
  const title = a.dish || a.recognizedFoods?.[0]?.name || '这一餐';
  const keyLine = isPartial ? (a.structure||'') : [n.calories.range, nutritionSignal(n.carbs,'碳水'), nutritionSignal(n.protein,'蛋白'), nutritionSignal(n.fat,'脂肪')].filter(Boolean).join(' · ');
  const srcBadge = a._source==='ai'
    ? `<span style="font-size:10px;font-weight:600;color:#2e7d32;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:4px;padding:2px 7px">✦ AI 识别</span>`
    : `<span style="font-size:10px;color:var(--ink30);background:var(--cream);border:1px solid var(--border);border-radius:4px;padding:2px 7px">模拟数据</span>`;
  area.innerHTML=`
  <div class="fade" style="margin-top:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      ${srcBadge}
      ${riskChip(a.risk)}
    </div>
    <div style="margin-bottom:12px">
      <p style="font-family:var(--serif);font-size:24px;line-height:1.25;margin-bottom:6px">${title}</p>
      <p style="font-size:13px;color:var(--ink60);line-height:1.55">${keyLine || a.structure}</p>
    </div>
    <div class="risk-bar risk-${a.risk}" style="margin-top:0;margin-bottom:12px"></div>
    <div style="font-size:13px;color:var(--ink60);line-height:1.6;margin-bottom:12px">${a.advice||''}</div>
    ${analysisCards}
    <div style="margin-top:10px;margin-bottom:16px">${tags}</div>
    <p style="font-size:13px;color:var(--ink60);text-align:center;margin-bottom:14px">吃完记得回来打分 🙂</p>

            <p style="font-size:11px;color:var(--ink60);margin-bottom:4px">${label}</p>

function nutritionSignal(value,label){
  if(!value || ['待确认','无法准确估算'].includes(value.level)) return '';
  return `${label}${value.level}`;
}

function nutritionFlags(n){
  const flags=[];
  if(n.vitamins && !['待确认','中等'].includes(n.vitamins.level)) flags.push(`维生素 ${n.vitamins.level} · ${n.vitamins.range}`);
  if(n.sodium && !['待确认','中等'].includes(n.sodium.level)) flags.push(`盐分 ${n.sodium.level} · ${n.sodium.range}`);
  if(n.sugar && !['待确认','不明显','较低'].includes(n.sugar.level)) flags.push(`糖 ${n.sugar.level} · ${n.sugar.range}`);
  if(n.caffeine && n.caffeine.level!=='无' && n.caffeine.level!=='待确认') flags.push(`咖啡因 ${n.caffeine.level} · ${n.caffeine.range}`);
  return flags.slice(0,4);
}

const NUTRIENT_LABELS = {
  calories:'热量',
  protein:'蛋白质',
  fat:'脂肪',
  carbs:'碳水',
  fiber:'纤维',
  sodium:'盐分',
  sugar:'糖',
  caffeine:'咖啡因',
};

function openNutritionDetail(key){
  if(!pendingAnalysis) return;
  document.querySelectorAll('[data-nutrition-sheet]').forEach(e=>e.remove());
  const foods=normalizeRecognizedFoods(pendingAnalysis.recognizedFoods,pendingAnalysis.dish);
  const n=normalizeNutritionEstimate(pendingAnalysis.nutritionEstimate,pendingAnalysis.foodType);
  const metric=n[key] || {range:'暂无法估算',level:'待确认',basis:''};
  const rows=foods.map(f=>({
    name:f.name,
    amount:f.nutritionContribution?.[key] || '暂无法估算',
    basis:`${f.quantityText}${f.estimatedWeightGrams?` / 约${f.estimatedWeightGrams}g`:''}`,
  }));
  const overlay=document.createElement('div');
  overlay.dataset.nutritionSheet='1';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(26,22,18,.38);z-index:760;display:flex;align-items:flex-end;padding:20px';
  overlay.innerHTML=`<div style="background:var(--white);border-radius:24px 24px 20px 20px;padding:22px;width:100%;max-width:420px;margin:0 auto;animation:fadeUp .25s ease">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div>
        <p style="font-family:var(--serif);font-size:22px">${NUTRIENT_LABELS[key]||key}明细</p>
        <p style="font-size:12px;color:var(--ink60);margin-top:4px">${metric.range} · ${metric.level}</p>
      </div>
      <button onclick="this.closest('[data-nutrition-sheet]').remove()" style="width:34px;height:34px;border:none;border-radius:50%;background:var(--cream);cursor:pointer;font-size:18px">×</button>
    </div>
    ${metric.basis?`<div style="background:var(--cream);border-radius:12px;padding:10px 12px;margin-bottom:10px"><p style="font-size:12px;color:var(--ink60);line-height:1.5">汇总依据：${metric.basis}</p></div>`:''}
    <div style="display:flex;flex-direction:column">
      ${rows.map((r,i)=>`<div style="display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-top:${i?'1px solid var(--border)':'none'}">
        <div>
          <p style="font-size:15px;font-weight:800;color:var(--ink)">${r.name}</p>
          <p style="font-size:12px;color:var(--ink60);margin-top:3px">${r.basis}</p>
        </div>
        <p style="font-size:13px;font-weight:800;color:var(--accent);text-align:right">${r.amount}</p>
      </div>`).join('')}
    </div>
  </div>`;
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}

function renderRecognitionEdit(a){
  const dish = a.dish || inferDishFromAnalysis(a);

  const typeRows = recognitionRowsForType(a);
  const rows=[
    ['类型',FOOD_TYPE_LABELS[foodType] || '待确认','foodType'],
    ['菜品',dish,'dish'],
    ['场景',scene,'scene'],

      </button>`).join('')}

function recognitionRowsForType(a){
  const foodType = normalizeFoodType(a.foodType);
  const fields = {...defaultTypeFields(foodType, a), ...(a.typeFields || {})};
  return (FOOD_TYPE_FIELDS[foodType] || FOOD_TYPE_FIELDS.unknown)
    .map(([key,label,fallback])=>[label, fields[key] || fallback, `typeFields.${key}`]);
}

function inferDishFromAnalysis(a){
  if(a.tags?.includes('高油')) return '麻辣香锅';
  if(a.tags?.includes('蛋白质足')) return '白切鸡饭';
  return '黄焖鸡米饭';
}

function editRecognition(key,label){
  const el=document.getElementById('rec-'+key);
  if(!el) return;
  const current=el.textContent||'';
  const next=prompt(`修改${label}`, current);
  if(!next) return;
  el.textContent=next;
  pendingAnalysis.corrections={...(pendingAnalysis.corrections||{}),[key]:next};
  if(key==='dish') pendingAnalysis.dish=next;
  if(key==='scene') pendingAnalysis.scene=next;
  if(key==='foodType'){
    const found=Object.entries(FOOD_TYPE_LABELS).find(([k,v])=>k===next||v===next);
    pendingAnalysis.foodType=found?found[0]:'unknown';
    pendingAnalysis.typeFields=defaultTypeFields(pendingAnalysis.foodType,pendingAnalysis);
    showInlineResult();
  }
  if(key.startsWith('typeFields.')){
    const field=key.split('.')[1];
    pendingAnalysis.typeFields={...(pendingAnalysis.typeFields||{}),[field]:next};
  }
}
function goFeedback(){
  mealEatingStarted=true;
  renderFeedback();
  show('feedback');
}

      {key:'fullness',label:'饱腹状态',opts:['撑','刚好','饿']},
      {key:'comfort',label:'身体感受',opts:['舒服','胀气','困倦','有精神']},
      commonPrice,
    ],
    drink:[

function feedbackQuestionsForAnalysis(analysis){
  const base = feedbackQuestionsForType(analysis?.foodType);
  const focus = normalizeEatingAdvice(analysis?.eatingAdvice, analysis?.advice).feedbackFocus;
  if(!focus.length) return base;
  const dynamic = focus.slice(0,3).map((label, idx)=>({
    key:`focus${idx+1}`,
    label,
    opts:['没有','有一点','明显'],
  }));
  const keep = base.find(q=>q.key==='price');
  return keep ? [...dynamic, keep] : dynamic;
}

function intakeRatioInfo(value){
  const map={
    '全吃完':{ratio:1,label:'全吃完'},
    '吃了3/4':{ratio:.75,label:'吃了 3/4'},
    '吃了一半':{ratio:.5,label:'吃了一半'},
    '剩很多':{ratio:.25,label:'剩很多'},
  };
  return map[value] || {ratio:1,label:'饭前估算'};
}

function renderPostMealConclusion(a, intake){
  if(!scores.actualIntake) return '';
  const risk = normalizeRisk(a.risk);
  const riskText = risk==='high'?'负担仍偏高':risk==='low'?'负担较轻':'负担中等';
  const amountText = intake.ratio >= .9 ? '这餐基本按原分析计入。'
    : intake.ratio >= .7 ? '实际摄入略低于饭前估算。'
    : intake.ratio >= .45 ? '实际摄入约减半，营养和负担会同步下调。'
    : '实际摄入较少，本餐负担明显低于饭前估算。';
  return `<div style="background:var(--white);border-radius:12px;padding:11px 12px;margin-top:10px">
    <p style="font-size:11px;font-weight:800;color:var(--ink60);margin-bottom:4px">饭后结论</p>
    <p style="font-size:13px;color:var(--ink);line-height:1.55">${amountText}${riskText}，下面的反馈会用来校验这次预测。</p>
  </div>`;
}

function updatePostMealEstimate(){

function postMealFeedbackQuestions(analysis){
  const dynamic = dynamicReactionQuestions(analysis).slice(0,2);
  return [
    {key:'actualIntake',label:'实际吃掉多少',opts:['全吃完','吃了3/4','吃了一半','剩很多']},
    {key:'fullness',label:'饱腹状态',opts:['撑','刚好','还饿']},
    {key:'comfort',label:'身体感受',opts:['舒服','胀气','困倦','有精神']},
    ...dynamic,
  ];
}

function dynamicReactionQuestions(analysis){
  const advice = normalizeEatingAdvice(analysis?.eatingAdvice, analysis?.advice);
  const reactions = advice.expectedReaction || [];
  const blocked = ['撑不撑','饱不饱','舒服吗','有精神吗'];
  const focus = toArray(advice.feedbackFocus, []).filter(label=>label && !blocked.some(k=>label.includes(k)));
  const mapped = focus.map((label,idx)=>{
    const hit = reactions.find(r=>label.includes(r.name) || r.name?.includes(label.replace(/[吗？?]/g,''))) || {};
    return {
      key:`reaction${idx+1}`,
      label,
      opts:['没有','有一点','明显'],
      prediction:{name:label, reason:hit.reason || '来自饭前分析的饭后重点观察', evidence:hit.evidence || ''},
    };
  });
  const seen=new Set();
  return mapped.filter(q=>{
    if(seen.has(q.label)) return false;
    seen.add(q.label);
    return true;
  });
}
function scoreSelect(key,val,btn){
  scores[key]=val;
  if(key==='actualIntake'){
    const info=intakeRatioInfo(val);
    scores.actualIntakeRatio=info.ratio;
    updatePostMealEstimate();
  }
  btn.closest('.score-row').querySelectorAll('.score-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  const qs=postMealFeedbackQuestions(pendingAnalysis).map(q=>q.key);
  const all=qs.every(k=>scores[k]);
  const sub=document.getElementById('fb-submit');
  sub.disabled=!all;sub.style.opacity=all?1:.4;
}
function submitFeedback(){
  if(scores.actualIntake){
    scores.intake = scores.actualIntake;
    scores.adjustedIntakeRatio = scores.actualIntakeRatio || intakeRatioInfo(scores.actualIntake).ratio;
  }
  const reactionEntries = Object.entries(scores).filter(([key])=>key.startsWith('reaction'));
  if(reactionEntries.length){
    const dynamic = dynamicReactionQuestions(pendingAnalysis);
    scores.predictionFeedback = reactionEntries.map(([key,value],idx)=>{
      const q = dynamic[idx] || {};
      return {
        key,
        question: q.label || key,
        predicted: q.prediction?.name || '',
        reason: q.prediction?.reason || '',
        evidence: q.prediction?.evidence || '',
        answer: value,
      };
    });
  }
  if(scores.comfort && !scores.fullness){
    scores.fullness = scores.satiety || scores.hungerImpact || scores.afterLoad || scores.mealImpact || '未记录';
  }
  if(!scores.intake){
    scores.intake = scores.craving || scores.mealReplacement || scores.foodPairing || '已记录';
  }
  scores.afterPhotoCalibration = leftoverImg ? 'uploaded' : 'before_photo_default';
  scores.correctionSignals = {
    afterPhotoCalibration: scores.afterPhotoCalibration,
    predictionFeedbackCount: scores.predictionFeedback?.length || 0,
  };
  const feedbackSubmittedAt=Date.now();
  const feedbackMeta={
    feedbackStartedAt: feedbackStartedAt ? new Date(feedbackStartedAt).toISOString() : null,
    feedbackSubmittedAt: new Date(feedbackSubmittedAt).toISOString(),
    feedbackDurationMs: feedbackStartedAt ? feedbackSubmittedAt - feedbackStartedAt : null,
    afterPhotoUploaded: Boolean(leftoverImg),
    changedAnyEstimate: Boolean(pendingAnalysis?.corrections && Object.keys(pendingAnalysis.corrections).length),
    correctionFields: pendingAnalysis?.corrections ? Object.keys(pendingAnalysis.corrections) : [],
  };
  const cuisine = pendingAnalysis?.cuisine
    ? {cuisine:pendingAnalysis.cuisine, province:pendingAnalysis.province||'全国'}
    : drawnCard
      ? CUISINE_MAP[drawnCard.dish]||{cuisine:drawnCard.cuisine||'家常菜',province:drawnCard.province||'全国'}
      : {cuisine:'家常菜',province:'全国'};
  const dish = pendingAnalysis?.dish || (drawnCard ? drawnCard.dish : '这一餐');
  const m={id:Date.now(),date:DAYS[meals.length%7],type:pendingMealType,dish,cuisine:cuisine.cuisine,province:cuisine.province,analysis:pendingAnalysis,analysisMeta:pendingAnalysis?.analysisMeta,feedbackMeta,fb:scores,wideImg,leftoverImg,ts:Date.now(),state:todayState};
  const wasFasting=fastingState==='fasting';
  meals.push(m);
  if(currentUser) saveUserMeals(meals); // 保存到用户账户
  justCompletedMealId=m.id;
  forceHomeRecordDefault=false;
  pendingAnalysis=null;
  drawnCard=null;
  // First-time reminder setup
  if(profile.reminderDelayMin===undefined && meals.length===1){
    setTimeout(()=>openReminderSetup(),800);
  }
  renderHome();show('home');
  if(wasFasting) setTimeout(()=>openEndFastOnMealRecord(),400);
  // 有key用AI生成洞察，否则用本地计算
  if(aiReady()){
    aiGenerateInsight(meals, profile).then(insight=>{
      if(insight) setTimeout(()=>showBodyMirrorIfReady(insight), 500);
      else toast('✓ 这餐已记录');
      renderHome(); // 刷新主页规律卡片
    }).catch(()=>{
      const insight = findBodyMirrorInsight();
      if(insight) setTimeout(()=>showBodyMirrorIfReady(insight), 500);
      else toast('✓ 这餐已记录');
    });
  } else {
    const insight = findBodyMirrorInsight();
    if(insight) setTimeout(()=>showBodyMirrorIfReady(insight), 400);
    else toast('✓ 这餐已记录');
  }
}

// ── 身体镜子引擎 ──────────────────────────────────────────────────────────────
// 核心：从用户数据里找第一个真实规律，用一句话说出来

function findBodyMirrorInsight(){
  if(meals.length < 2) return null;

  const withFb = meals.filter(m=>m.fb?.comfort);

  // 规律1：特定标签 → 困倦（最强信号）
  const sleepyMeals = withFb.filter(m=>m.fb.comfort==='困倦');
  if(sleepyMeals.length >= 2){
    // 找共同标签
    const tagCount = {};
    sleepyMeals.forEach(m=>(m.analysis?.tags||[]).forEach(t=>{
      tagCount[t]=(tagCount[t]||0)+1;
    }));
    const topTag = Object.entries(tagCount).sort((a,b)=>b[1]-a[1])[0];
    if(topTag && topTag[1] >= 2){
      const ex = sleepyMeals[sleepyMeals.length-1];
      return {
        type:'pattern_sleepy',
        headline:`你每次吃「${topTag[0]}」的东西，下午都会困`,
        body:`${ex.dish||'这类食物'}之后你感觉困倦，已经出现 ${topTag[1]} 次了。不是意志力的问题，是你的身体就是这样反应的。`,
        action:`下次试试${topTag[0]==='高油'?'清蒸或水煮的':topTag[0]==='主食偏多'?'主食减半的':'蛋白质更足的'}版本，看看下午会不会不一样。`,
        emoji:'😴',
        color:'var(--amber)',
        colorSoft:'var(--amber-s)',
      };
    }
  }

  // 规律2：特定结构 → 持续好状态
  const greatMeals = withFb.filter(m=>m.fb.comfort==='有精神');
  if(greatMeals.length >= 2){
    const tagCount = {};
    greatMeals.forEach(m=>(m.analysis?.tags||[]).forEach(t=>{
      tagCount[t]=(tagCount[t]||0)+1;
    }));
    const topTag = Object.entries(tagCount).sort((a,b)=>b[1]-a[1])[0];
    if(topTag && topTag[1] >= 2){
      const ex = greatMeals[greatMeals.length-1];
      return {
        type:'pattern_great',
        headline:`「${topTag[0]}」的餐，每次都让你状态很好`,
        body:`${ex.dish||'这类搭配'}之后你总是有精神又满足，出现了 ${topTag[1]} 次。这是你身体喜欢的方向。`,
        action:`把这个搭配作为你的基准线——不知道吃什么的时候，往这个方向选就对了。`,
        emoji:'⚡',
        color:'var(--green)',
        colorSoft:'var(--green-s)',
      };
    }
  }

  // 规律3：吃撑的场景
  const regretMeals = withFb.filter(m=>m.fb.fullness==='撑');
  if(regretMeals.length >= 2){
    const types = regretMeals.map(m=>m.type);
    const typeCount = {};
    types.forEach(t=>typeCount[t]=(typeCount[t]||0)+1);
    const topType = Object.entries(typeCount).sort((a,b)=>b[1]-a[1])[0];
    return {
      type:'pattern_overfull',
      headline:`你${topType[0]}总是吃撑`,
      body:`这已经发生了 ${regretMeals.length} 次了。不是你不自律，是${topType[0]}的场景容易让人失去分寸感。`,
      action:`${topType[0]}试试提前决定吃几分饱，吃到七分就停下来等五分钟，让身体反应过来。`,
      emoji:'😮‍💨',
      color:'var(--accent)',
      colorSoft:'var(--accent-s)',
    };
  }

  // 规律4：状态影响（压力大→身体反应差）
  const stressedBad = withFb.filter(m=>m.state==='压力有点大'&&['困倦','胀气'].includes(m.fb.comfort));
  const stressedAll = withFb.filter(m=>m.state==='压力有点大');
  if(stressedAll.length>=2 && stressedBad.length/stressedAll.length > 0.5){
    return {
      type:'pattern_stress',
      headline:`压力大的时候，你的身体对食物更敏感`,
      body:`你压力大时吃饭，有 ${Math.round(stressedBad.length/stressedAll.length*100)}% 的概率身体反应不好。情绪影响消化，这是真实的生理机制。`,
      action:`压力大时优先选清淡、熟悉的食物，不是这时候探索新口味的好时机。`,
      emoji:'🧠',
      color:'var(--green)',
      colorSoft:'var(--green-s)',
    };
  }

  return null;
}

// 打分提交后触发"身体镜子"弹窗
function showBodyMirrorIfReady(insight){
  if(!insight) return;
  // 只在新规律形成时显示（每个类型只触发一次）
  const shownKey = 'shown_'+insight.type;
  if(sessionStorage.getItem(shownKey)) return;
  sessionStorage.setItem(shownKey, '1');

  const overlay = document.createElement('div');
  overlay.style.cssText=`position:fixed;inset:0;background:rgba(26,22,18,.5);z-index:500;display:flex;align-items:flex-end;padding:20px;`;
  overlay.innerHTML=`
    <div style="background:var(--white);border-radius:24px 24px 20px 20px;padding:28px 24px 24px;width:100%;max-width:420px;margin:0 auto;animation:fadeUp .4s ease both">
      <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:16px">
        <span style="font-size:36px;flex-shrink:0">${insight.emoji}</span>
        <div>
          <p style="font-size:11px;font-weight:600;color:${insight.color};text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">我发现了一个规律</p>
          <p style="font-family:var(--serif);font-size:20px;line-height:1.3;color:var(--ink)">${insight.headline}</p>
        </div>
      </div>
      <div style="background:${insight.colorSoft};border-radius:var(--rs);padding:14px 16px;margin-bottom:14px">
        <p style="font-size:14px;color:var(--ink);line-height:1.7;margin-bottom:8px">${insight.body}</p>
        <p style="font-size:13px;color:${insight.color};line-height:1.6;font-weight:500">${insight.action}</p>
      </div>
      <p style="font-size:12px;color:var(--ink30);text-align:center;margin-bottom:14px">这是你自己身体的数据，不是通用建议</p>
      <button onclick="this.closest('[style*=fixed]').remove()" style="width:100%;padding:14px;border:none;border-radius:100px;background:var(--ink);color:#fff;font-family:var(--sans);font-size:15px;font-weight:500;cursor:pointer">知道了，好好吃饭 ✓</button>

  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

// ── 日历打卡视图 ───────────────────────────────────────────────────────────────
function renderCalendarView(container){
  const now=new Date();
  const year=now.getFullYear();
  const month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=now.getDate();

  // 把 meals 按日期分组（用 ts 时间戳）
  const mealsByDay={};
  meals.forEach(m=>{
    const d=new Date(m.ts||Date.now());
    if(d.getFullYear()===year&&d.getMonth()===month){
      const day=d.getDate();
      if(!mealsByDay[day]) mealsByDay[day]=[];
      mealsByDay[day].push(m);
    }
  });
  // seed meals 没有 ts，手动映射到本月前几天
  [1,2,3,4,5].forEach((offset,i)=>{
    const day=today-4+i;
    if(day>0&&day<=daysInMonth&&!Object.keys(mealsByDay).length){
      mealsByDay[day]=[meals[i]].filter(Boolean);
    }
  });
  // 补充 seed meals 到近几天
  if(Object.keys(mealsByDay).length===0||meals.slice(0,5).some(m=>!m.ts||m.ts<Date.now()-7*86400000)){
    meals.forEach((m,i)=>{
      const day=Math.max(1,today-4+i);
      if(!mealsByDay[day]) mealsByDay[day]=[];
      if(!mealsByDay[day].find(x=>x.id===m.id)) mealsByDay[day].push(m);
    });
  }

  const weekDays=['日','一','二','三','四','五','六'];
  const weekRow=weekDays.map(d=>`<div style="text-align:center;font-size:11px;color:var(--ink60);font-weight:600;padding:4px 0">${d}</div>`).join('');

  let cells='';
  // 补空格
  for(let i=0;i<firstDay;i++) cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const hasMeals=mealsByDay[d]&&mealsByDay[d].length>0;
    const isToday=d===today;
    const m=hasMeals?mealsByDay[d][0]:null;
    const dotColor=m?(m.fb.comfort==='有精神'||m.fb.comfort==='舒服'?'var(--green)':m.fb.comfort==='困倦'||m.fb.comfort==='胀气'?'var(--red)':'var(--amber)'):'transparent';
    cells+=`<div onclick="${hasMeals?`showDayDetail(${d},${year},${month})`:'null'}" style="
      aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      border-radius:10px;cursor:${hasMeals?'pointer':'default'};position:relative;
      background:${isToday?'var(--accent-s)':hasMeals?'var(--cream)':'transparent'};
      border:${isToday?'1.5px solid var(--accent)':'1px solid transparent'};
      transition:all .15s;">
      <span style="font-size:13px;font-weight:${isToday?700:hasMeals?600:400};color:${isToday?'var(--accent)':hasMeals?'var(--ink)':'var(--ink30)'}">${d}</span>
      ${hasMeals?`<div style="width:5px;height:5px;border-radius:50%;background:${dotColor};margin-top:2px"></div>`:'<div style="width:5px;height:5px"></div>'}
      ${hasMeals&&mealsByDay[d].length>1?`<div style="position:absolute;top:2px;right:2px;font-size:9px;background:var(--accent);color:#fff;border-radius:100px;padding:0 3px;line-height:14px">${mealsByDay[d].length}</div>`:''}
    </div>`;
  }

  // 选中日期的餐次明细
  const selDay=today;
  const selMeals=mealsByDay[selDay]||[];

  container.innerHTML=`
  <div style="margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <p style="font-family:var(--serif);font-size:20px">${year}年${month+1}月</p>
      <p style="font-size:12px;color:var(--ink60)">已打卡 ${Object.keys(mealsByDay).length} 天</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
      ${weekRow}${cells}
    </div>
  </div>
  <div id="day-detail">
    ${renderDayMeals(selDay, selMeals)}
  </div>`;

  // 绑定点击
  window.showDayDetail=function(d,y,mo){
    const dm=mealsByDay[d]||[];
    document.getElementById('day-detail').innerHTML=renderDayMeals(d,dm);
  };
}

function renderDayMeals(day, list){
  if(!list.length) return `<p style="text-align:center;color:var(--ink30);font-size:13px;padding:20px 0">${day}日 暂无记录</p>`;
  const items=list.map(m=>{
    const imgEl=m.wideImg
      ?`<img src="${m.wideImg}" style="width:60px;height:60px;object-fit:cover;border-radius:10px;flex-shrink:0">`
      :`<div style="width:60px;height:60px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0">${ava(m.analysis.risk)}</div>`;
    const feelColor=m.fb.comfort==='有精神'||m.fb.comfort==='舒服'?'var(--green)':m.fb.comfort==='困倦'||m.fb.comfort==='胀气'?'var(--red)':'var(--amber)';
    return `<div style="display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="showMealDetail(${m.id})">
      ${imgEl}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <p style="font-weight:600;font-size:14px">${m.dish||m.analysis.structure.split('，')[0]}</p>
          <span style="font-size:11px;color:${feelColor};font-weight:600">${feelEmoji(m.fb.comfort)} ${m.fb.comfort}</span>
        </div>
        <p style="font-size:12px;color:var(--ink60);margin-top:2px">${m.type} · ${m.cuisine||'家常菜'}</p>
        <p style="font-size:12px;color:var(--ink30);margin-top:2px">${m.analysis.structure}</p>
      </div>
    </div>`;
  }).join('');
  return `<div class="label">${day}日的记录</div><div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:0 16px">${items}</div>`;
}

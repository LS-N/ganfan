<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>干饭 · 好好吃饭</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF7F2;--white:#FFFEF9;--ink:#1A1612;--ink60:#7A6E66;--ink30:#C5BDB5;
  --accent:#E85D26;--accent-s:#FFF0E9;--green:#2D6A4F;--green-s:#EBF5EF;
  --amber:#D4860A;--amber-s:#FEF6E4;--red:#C0392B;--red-s:#FDECEA;
  --border:#EDE8E1;--r:16px;--rs:10px;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  --serif:Georgia,'Songti SC',serif;
}
html,body{height:100%;background:var(--cream);font-family:var(--sans);color:var(--ink)}
#app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;position:relative}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:0;z-index:100}
.nav-title{font-family:var(--serif);font-size:19px}
.nav-back{background:none;border:none;color:var(--ink60);font-size:14px;font-family:var(--sans);padding:6px 10px;border-radius:8px;cursor:pointer}
.nav-home-left{display:flex;align-items:center;gap:14px;border:none;background:transparent;padding:0;font-family:var(--sans);min-width:170px}
.nav-avatar{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:linear-gradient(135deg,var(--accent-s),var(--green-s));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(26,22,18,.06)}
.nav-home-stat{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:21px;font-weight:900;line-height:1}
.nav-home-stat .muted{color:var(--ink30)}
.home-slide{position:relative;height:58px;border-radius:999px;background:var(--cream);border:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:5px;margin:18px 0 16px;overflow:hidden}
.home-slide-thumb{position:absolute;top:5px;bottom:5px;left:calc(33.333% + 5px);width:calc(33.333% - 10px);border-radius:999px;background:var(--white);box-shadow:0 8px 22px rgba(26,22,18,.08);border:1px solid var(--border);z-index:1}
.home-slide button{position:relative;z-index:2;border:none;background:transparent;font-family:var(--sans);font-size:12px;font-weight:800;color:var(--ink60);cursor:pointer;height:48px;border-radius:999px}
.home-slide button.center{color:var(--accent);font-size:13px}

/* TABS */
.tabbar{display:flex;border-top:1px solid var(--border);background:var(--white);position:sticky;bottom:0;z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;border:none;background:none;cursor:pointer;color:var(--ink60);font-family:var(--sans);font-size:10px;font-weight:500}
.tab-btn.active{color:var(--accent)}
.tab-icon{font-size:20px;line-height:1}

/* PAGE */
.page{flex:1;overflow-y:auto;padding:20px;padding-bottom:90px}
.screen{display:none}.screen.active{display:block}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 24px;border-radius:100px;font-family:var(--sans);font-size:15px;font-weight:500;cursor:pointer;border:none;width:100%;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:#C44D1F;transform:scale(.98)}
.btn-primary:disabled{opacity:.4;cursor:default}
.btn-ghost{background:transparent;color:var(--ink60);font-size:14px;margin-top:8px}

/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px}

/* CHIPS */
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:500}
.chip-green{background:var(--green-s);color:var(--green)}
.chip-amber{background:var(--amber-s);color:var(--amber)}
.chip-red{background:var(--red-s);color:var(--red)}

/* SECTION LABEL */
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink60);margin-bottom:10px}

/* UPLOAD ZONE */
.upload-zone{border:2px dashed var(--border);border-radius:var(--r);padding:28px 20px;text-align:center;cursor:pointer;background:var(--cream);transition:border-color .2s;margin-bottom:14px}
.upload-zone:active{border-color:var(--accent);background:var(--accent-s)}
.upload-zone img{width:100%;height:160px;object-fit:cover;border-radius:var(--rs);display:block}
.upload-zone .uz-icon{font-size:30px;margin-bottom:6px}
.upload-zone p{font-size:13px;color:var(--ink60)}

/* SCORE BUTTONS */
.score-row{display:flex;gap:8px;margin-bottom:16px}
.score-btn{flex:1;padding:10px 4px;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--white);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink60);transition:all .15s;text-align:center}
.score-btn.sel{border-color:var(--accent);background:var(--accent-s);color:var(--accent)}

/* PROGRESS DOTS */
.day-dots{display:flex;gap:8px;flex-wrap:wrap}
.day-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--ink60)}
.day-dot.done{background:var(--accent);border-color:var(--accent);color:#fff}
.day-dot.today{border-color:var(--accent);color:var(--accent)}

/* RISK BAR */
.risk-bar{height:3px;border-radius:2px;margin-top:10px}
.risk-low{background:var(--green);width:33%}
.risk-medium{background:var(--amber);width:66%}
.risk-high{background:var(--red);width:100%}

/* ADVICE BOX */
.advice-box{background:var(--accent-s);border-radius:var(--rs);padding:14px;margin-top:12px}
.advice-text{font-size:14px;color:var(--accent);line-height:1.6}

/* MEAL LIST */
.meal-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.meal-item:last-child{border-bottom:none}
.meal-ava{width:42px;height:42px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.meal-meta{flex:1}
.meal-top{display:flex;align-items:center;justify-content:space-between}
.meal-name{font-size:13px;font-weight:600}
.meal-feel{font-size:12px;color:var(--ink60);margin-top:3px}

/* INSIGHT CARD */
.insight-row{display:flex;gap:10px;align-items:flex-start}
.insight-icon{font-size:22px;flex-shrink:0}
.insight-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink60);margin-bottom:4px}
.insight-val{font-size:14px;line-height:1.5}

/* ONBOARD */
.ob-progress{display:flex;gap:6px;margin-bottom:22px}
.ob-bar{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background .3s}
.ob-bar.done{background:var(--accent)}
.ob-question{font-family:var(--serif);font-size:24px;line-height:1.3;margin-bottom:20px}
.ob-opt{display:flex;align-items:center;gap:10px;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--rs);cursor:pointer;margin-bottom:10px;font-size:15px;transition:all .15s}
.ob-opt.sel{border-color:var(--accent);background:var(--accent-s);color:var(--accent)}

/* HERO */
.hero-title{font-family:var(--serif);font-size:36px;line-height:1.1;margin-top:6px}
.hero-title em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:14px;color:var(--ink60);line-height:1.6;margin-top:8px}

/* ANALYZING */
.analyzing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.spin{display:inline-block;font-size:48px;animation:spin 2s linear infinite}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:999;white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .3s ease both}
</style>
</head>
<body>
<div id="app">
  <div class="nav" id="nav" style="display:none">
    <div class="nav-back" id="nav-back" style="visibility:hidden" role="button">← 返回</div>

  <!-- ── ROADMAP ── -->

  <!-- ── VERSION PLACEHOLDER ── -->

<input type="file" accept="image/*" id="file-wide" style="display:none">

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const ANALYSES = [
  {structure:"主食偏多，蛋白质中等，蔬菜不足",
   detail:["主食约 1.5–2 碗，属偏高水平","蛋白质适中，约 1 个手掌大小","蔬菜不足半碗，建议补充"],
   advice:"先吃肉和菜，米饭少吃 1/3。汤别喝完，油脂负担偏高。",risk:"medium",tags:["主食偏多","少蔬菜"]},
  {structure:"蛋白质充足，主食适中，蔬菜良好",
   detail:["主食约 1 碗，属适中水平","蛋白质丰富，约 1.5 个手掌大小","蔬菜超过半碗，搭配均衡"],
   advice:"这顿搭配不错。按正常顺序吃，饭后精力应该比较稳定。",risk:"low",tags:["蛋白质足","搭配均衡"]},
  {structure:"高油高碳，蛋白质偏低",
   detail:["主食约 2 碗，偏多","油脂负担较高，约 2 份炸制食物","蛋白质偏少"],
   advice:"可以吃，但建议减少炸物。下午可能有困意，注意补水。",risk:"high",tags:["高油","易困倦"]},
];
const INSIGHTS = {
  comfortable:["牛肉饭 + 青菜（周一午）","鸡胸肉沙拉（周三午）","番茄鸡蛋面（周五晚）"],
  sleepy:"炸鸡饭 + 奶茶 → 下午困倦评分最高（周二午）",
  overfull:"点外卖时容易吃撑，工作日午饭场景最突出",
  bestValue:"鸡胸肉沙拉：精力反馈最好 + 价格满意度高",
  nextWeek:"午饭优先选「蛋白质足 + 主食适中 + 少油」组合",
  action:"把午饭米饭减少到半碗，先吃肉和菜",
};
let meals = [
  {id:1,date:"周一",type:"午饭",dish:"黄焖鸡米饭",cuisine:"鲁菜",province:"山东",analysis:ANALYSES[0],fb:{fullness:"刚好",comfort:"舒服",mood:"满足",price:"值"},ts:Date.now()-6*86400000,state:"随便都行"},
  {id:2,date:"周二",type:"午饭",dish:"麻辣香锅",cuisine:"川菜",province:"四川",analysis:ANALYSES[2],fb:{fullness:"撑",comfort:"困倦",mood:"后悔",price:"一般"},ts:Date.now()-5*86400000,state:"压力有点大"},
  {id:3,date:"周三",type:"午饭",dish:"白切鸡饭",cuisine:"粤菜",province:"广东",analysis:ANALYSES[1],fb:{fullness:"刚好",comfort:"有精神",mood:"满足",price:"值"},ts:Date.now()-4*86400000,state:"心情不错"},
  {id:4,date:"周四",type:"早饭",dish:"小笼包",cuisine:"沪菜",province:"上海",analysis:ANALYSES[1],fb:{fullness:"刚好",comfort:"舒服",mood:"满足",price:"值"},ts:Date.now()-3*86400000,state:"随便都行"},
  {id:5,date:"周五",type:"晚饭",dish:"夫妻肺片",cuisine:"川菜",province:"四川",analysis:ANALYSES[0],fb:{fullness:"刚好",comfort:"舒服",mood:"满足",price:"值"},ts:Date.now()-2*86400000,state:"压力有点大"},
];
let profile = {};
let pendingAnalysis = null;
let pendingMealType = "午饭";
let obStep = 0;
const obSteps = [
  {q:"你最想通过饮食改善什么？",key:"goal",opts:["下午不困","轻松减脂","消化更好","吃得更满足"]},
  {q:"有什么不能吃或不喜欢的？",key:"avoid",opts:["无限制","不吃辣","不吃海鲜","素食为主"]},
  {q:"单次外卖预算？",key:"budget",opts:["15 元以内","15–30 元","30–50 元","不在乎"]},
  {q:"饭后最常出现哪种感受？",key:"feeling",opts:["容易困倦","胀气不舒服","吃撑后悔","基本还好"]},
  {q:"吃饭对你来说更多是……",key:"eatingStyle",opts:["补充能量就好","很在乎吃得舒服","享受吃饭这件事","看心情，不固定"]},
];
let wideImg = null, closeImg = null, leftoverImg = null;
let scores = {};
let camMealType = "午饭";
let forceHomeRecordDefault = false;
const DAYS = ["周一","周二","周三","周四","周五","周六","周日"];

// ── Routing ───────────────────────────────────────────────────────────────────
let curScreen = "onboard";
let navBackTarget = "home";
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  curScreen = id;
  const nav = document.getElementById('nav');
  const tabbar = document.getElementById('tabbar');
  const back = document.getElementById('nav-back');
  const title = document.getElementById('nav-title');
  const right = document.getElementById('nav-right');
  if(id==='roadmap'){nav.style.display='none';tabbar.style.display='none';return;}
  nav.style.display='flex';
  const titles={onboard:'MVP 1.0',home:'干饭',camera:'记录这一餐',feedback:'饭后打分',history:'我的记录',insight:'身体',profile:'我的档案',productmap:'产品地图',version:'版本占位',mvp2:'计划',mvp3:'MVP 3.0',mvp4:'MVP 4.0',mvp5:'MVP 5.0'};
  title.textContent = titles[id]||'干饭';
  title.style.display = '';
  title.style.visibility = 'visible';
  back.className = 'nav-back';
  back.onclick = navBack;
  back.innerHTML = '← 返回';
  right.style.width = '88px';
  right.innerHTML = navRightAction(id);
  if(id==='home'){
    title.style.visibility = 'hidden';
    right.style.width = '0px';
    back.className = 'nav-home-left';
    back.onclick = openProfileFromHome;
    back.innerHTML = renderHomeNavLeft();
    back.style.visibility='visible';
    tabbar.style.display='flex';
  }
  else if(id==='insight'||id==='mvp2'){back.style.visibility='hidden';tabbar.style.display='flex';}
  else{back.style.visibility='visible';tabbar.style.display='none';}
  const activeTab = id==='mvp2'?'plan':id==='insight'?'body':id;
  const tabs=['home','plan','body'];
  tabs.forEach(t=>{
    const el=document.getElementById('tab-'+t);
    if(el) el.classList.toggle('active',t===activeTab);
  });
}
function navRightAction(id){
  if(id==='home') return ``;
  if(id==='camera') return ``;
  if(id==='onboard') return `<button onclick="leaveMvpToRoadmap()" style="border:1px solid var(--border);background:var(--white);border-radius:999px;padding:7px 10px;color:var(--ink60);font-family:var(--sans);font-size:12px;cursor:pointer;white-space:nowrap">路线</button>`;
  if(['version','mvp3','mvp4','mvp5'].includes(id)) return `<button onclick="renderRoadmap();show('roadmap')" style="border:1px solid var(--border);background:var(--white);border-radius:999px;padding:7px 10px;color:var(--ink60);font-family:var(--sans);font-size:12px;cursor:pointer;white-space:nowrap">路线</button>`;
  return '';
}
function renderHomeNavLeft(){
  return `<span class="nav-avatar" aria-hidden="true">🍚</span>
    <span class="nav-home-stat" onclick="event.stopPropagation();openHistoryFromHome();" style="cursor:pointer">
      <span class="muted">⚡</span><span>${meals.length}</span>
    </span>`;
}
function navBack(){
  if(navBackTarget==='roadmap'){renderRoadmap();show('roadmap');return;}
  switchTab(navBackTarget||'home');
}
function openProfileFromHome(){
  navBackTarget='home';
  renderProfile();
  show('profile');
}
function openRecordFromToday(){
  navBackTarget='home';
  renderCamera();
  show('camera');
}
function openHistoryFromRecord(){
  navBackTarget='camera';
  renderHistory();
  show('history');
}
function openHistoryFromHome(){
  navBackTarget='home';
  renderHistory();
  show('history');
}
function openProductMapFromProfile(){
  navBackTarget='profile';
  renderProductMap();
  show('productmap');
}
function switchTab(id){
  if(id==='camera'){navBackTarget='home';renderCamera();show('camera');}
  else if(id==='home'){navBackTarget='home';renderHome();show('home');}
  else if(id==='plan'){navBackTarget='home';planTab=planTab||'meal';renderMvpTwo();show('mvp2');}
  else if(id==='body'){navBackTarget='home';bodyTab=bodyTab||'puzzle';renderBody();show('insight');}
  else if(id==='history'){navBackTarget=curScreen==='insight'?'insight':'camera';renderHistory();show('history');}
  else if(id==='insight'){bodyTab='puzzle';renderBody();show('insight');}
  else if(id==='profile'){navBackTarget='home';renderProfile();show('profile');}
  else if(id==='productmap'){navBackTarget='profile';renderProductMap();show('productmap');}
}

function leaveMvpToRoadmap(){
  pendingAnalysis=null;
  mealEatingStarted=false;
  clearDoneReceipt();
  navBackTarget='roadmap';
  renderRoadmap();
  show('roadmap');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ── Roadmap ───────────────────────────────────────────────────────────────────
function renderRoadmap(){
  const s=document.getElementById('s-roadmap');
  s.innerHTML=`
  <div class="fade" style="min-height:100%;padding-top:24px">
    <p style="font-size:13px;color:var(--ink60);margin-bottom:6px">干饭产品路线</p>
    <h1 class="hero-title">好好<em>吃饭</em></h1>
    <p class="hero-sub" style="max-width:340px">干饭的使命很简单：让你吃得开心，身体也吃得舒服。所有功能都服务这个目标，从记录、计划、管理到购买履约，最终都回答“下一餐怎么吃”。</p>
  </div>
  ${renderPageConnectionMap()}
  <div style="margin-top:22px">

function togglePurchaseDay(day){

function riskChip(r){
  if(r==='low') return '<span class="chip chip-green">✓ 低风险</span>';
  if(r==='medium') return '<span class="chip chip-amber">⚡ 中等</span>';
  return '<span class="chip chip-red">⚠ 高风险</span>';
}
function feelEmoji(f){return({舒服:"😊",困倦:"😴",胀气:"😮‍💨",有精神:"⚡",反酸:"😣"})[f]||"😐";}
function ava(r){return r==='low'?'🥗':r==='medium'?'🍱':'🍟';}

// ── ONBOARD ───────────────────────────────────────────────────────────────────
function renderOnboard(){
  const s=document.getElementById('s-onboard');
  const step=obSteps[obStep];
  const sel=profile[step.key]||'';
  const bars=obSteps.map((_,i)=>`<div class="ob-bar${i<=obStep?' done':''}"></div>`).join('');
  const opts=step.opts.map(o=>`<div class="ob-opt${sel===o?' sel':''}" onclick="obSelect('${o}')">${sel===o?'● ':'○ '}${o}</div>`).join('');
  s.innerHTML=`
  <div class="fade">
    <div class="ob-progress">${bars}</div>
    <p style="font-size:12px;color:var(--ink60);margin-bottom:6px">${obStep+1} / ${obSteps.length}</p>
    <p class="ob-question">${step.q}</p>
    <div style="margin-bottom:24px">${opts}</div>
    <button class="btn btn-primary" id="ob-next" onclick="obNext()" ${sel?'':'disabled'} style="opacity:${sel?1:.4}">
      ${obStep<obSteps.length-1?'继续 →':'开始记录 →'}
    </button>
  </div>`;
}
function obSelect(val){
  profile[obSteps[obStep].key]=val;
  renderOnboard();
}
function obNext(){
  if(!profile[obSteps[obStep].key]) return;
  if(obStep<obSteps.length-1){obStep++;renderOnboard();}
  else{renderHome();show('home');}
}

  s.innerHTML=`

function getHomeScene(){
  const n=Math.min(meals.length,7);
  const scene=getCurrentMealScene();
  const todayStart=new Date();todayStart.setHours(0,0,0,0);
  const todayMeals=meals.filter(m=>(m.ts||0)>=todayStart.getTime());
  const latest=todayMeals[todayMeals.length-1];
  if(forceHomeRecordDefault){
    return renderHomeBeforeMeal(scene,n,'默认');
  }
  if(latest && latest.fb?.comfort && justCompletedMealId===latest.id){
    return renderHomeDone(latest,n);
  }
  if(pendingAnalysis && mealEatingStarted){
    return renderHomeFeedback(scene);
  }
  if(pendingAnalysis){
    return renderHomeEating(scene);
  }
  return renderHomeBeforeMeal(scene,n);
}

  return `<div class="card fade" style="animation-delay:.08s;margin-top:20px;padding:26px;border:none;background:linear-gradient(180deg,var(--white),var(--cream))">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px">

function getCurrentMealScene(){
  const h=new Date().getHours();
  if(h>=5&&h<10) return {label:'早餐',shortName:'早饭',type:'早饭'};
  if(h>=10&&h<14) return {label:'午餐',shortName:'午饭',type:'午饭'};
  if(h>=17&&h<21) return {label:'晚餐',shortName:'晚饭',type:'晚饭'};

let homeScores={};
function homeScoreSelect(key,val,btn){
  homeScores[key]=val;
  btn.closest('.score-row').querySelectorAll('.score-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  if(key==='comfort'){
    const step=document.getElementById('home-fullness-step');
    if(step) step.style.display='block';
  }
  if(key==='fullness'){
    const step=document.getElementById('home-mood-step');
    if(step) step.style.display='block';
  }
  const ready=homeScores.fullness&&homeScores.comfort&&homeScores.mood;
  const sub=document.getElementById('home-fb-submit');
  if(sub){sub.disabled=!ready;sub.style.opacity=ready?1:.4;}
}

function startHomeFeedback(){
  mealEatingStarted=true;
  homeScores={};
  renderHome();
}

function submitHomeFeedback(){
  if(!homeScores.fullness||!homeScores.comfort||!homeScores.mood) return;
  scores={fullness:homeScores.fullness,comfort:homeScores.comfort,mood:homeScores.mood,price:'一般'};
  homeScores={};
  mealEatingStarted=false;
  submitFeedback();
}

const AI_CONFIG = {

  model: 'claude-opus-4-5',
  endpoint: 'https://api.anthropic.com/v1/messages',
};

// ── 工具函数：调用 Claude API ──────────────────────────────────────
async function callClaude(systemPrompt, userContent){
  const body = {
    model: AI_CONFIG.model,
    max_tokens: 1024,
    system: systemPrompt,
    messages:[{ role:'user', content: userContent }],
  };
  const res = await fetch(AI_CONFIG.endpoint, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': AI_CONFIG.key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify(body),
  });
  if(!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  const text = data.content?.[0]?.text || '';
  // 提取 JSON
  const match = text.match(/\{[\s\S]*\}/);
  if(!match) throw new Error('No JSON in response');
  return JSON.parse(match[0]);
}

// ── 图片转 base64 ──────────────────────────────────────────────────
async function imgToBase64(url){
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onloadend = ()=> resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(blob);
  });
}

// 结构标签 → 具体菜品映射
const DISH_MAP = {
  '蛋白质足+搭配均衡': ['鸡胸肉饭','番茄鸡蛋面','清蒸鱼+米饭','牛肉炒饭'],
  '主食偏多+少蔬菜':   ['黄焖鸡米饭','红烧肉饭','排骨饭','猪脚饭'],
  '高油+易困倦':       ['炸鸡饭','麻辣烫','油炸外卖','汉堡套餐'],
  '低负担':            ['鸡胸肉沙拉','清汤面','蒸蔬菜+蛋','轻食沙拉碗'],
  '探索':              ['泰式柠檬鸡','越南春卷','日式定食','韩式拌饭'],
};
function tagsToDish(tags){
  const key = Object.keys(DISH_MAP).find(k=>tags.some(t=>k.includes(t)));
  const list = key ? DISH_MAP[key] : DISH_MAP['低负担'];
  return list[Math.floor(Math.random()*list.length)];
}

// 计算距今天数（用记录序号模拟）
function daysSince(mealIdx){
  const diff = meals.length - 1 - mealIdx;
  if(diff===0) return '今天';
  if(diff===1) return '昨天';
  return `${diff} 天前`;
}

function buildCardPool(){
  const good = meals.map((m,i)=>({...m,idx:i}))
    .filter(m=>['舒服','有精神'].includes(m.fb.comfort) && m.fb.mood==='满足');
  const bad  = meals.map((m,i)=>({...m,idx:i}))
    .filter(m=>['困倦','胀气'].includes(m.fb.comfort) || m.fb.mood==='后悔');

  const pool = [];

  // ① 好评复现卡 —— 找评价最高且最近的菜品
  if(good.length>=1){
    const best = good[good.length-1];
    const dish = tagsToDish(best.analysis.tags||[]);
    const count = good.length;
    const lastTime = daysSince(best.idx);
    const goodCount = good.filter(m=>
      (m.analysis.tags||[]).some(t=>(best.analysis.tags||[]).includes(t))
    ).length;
    pool.push({
      type:'repeat',
      emoji:'⭐',
      badge:'历史好评',
      dish,
      tags: best.analysis.tags||[],
      risk: best.analysis.risk,
      reason: `吃了 ${goodCount} 次，每次都${best.fb.comfort}，上次是${lastTime}`,
      advice: best.analysis.advice,
    });
  }

  // ② 久未出现卡 —— 好评但超过5餐没出现
  const oldGood = good.filter(m=> meals.length - 1 - m.idx >= 5);
  if(oldGood.length>=1){
    const old = oldGood[0];
    const dish = tagsToDish(old.analysis.tags||[]);
    const lastTime = daysSince(old.idx);
    pool.push({
      type:'revisit',
      emoji:'🕰️',
      badge:'许久未见',
      dish,
      tags: old.analysis.tags||[],
      risk: old.analysis.risk,
      reason: `上次吃是${lastTime}，但你吃完感觉${old.fb.comfort}，是时候再来一次了`,
      advice: old.analysis.advice,
    });
  }

  // ③ 规避差评安全牌 —— 针对最近一次差评反向推荐
  const safeDish = ['鸡胸肉饭','番茄鸡蛋面','清蒸鱼+米饭','牛肉蔬菜碗'][Math.floor(Math.random()*4)];
  if(bad.length>=1){
    const lastBad = bad[bad.length-1];
    const badDish = tagsToDish(lastBad.analysis.tags||[]);
    const lastTime = daysSince(lastBad.idx);
    pool.push({
      type:'safe',
      emoji:'🛡️',
      badge:'安全牌',
      dish: safeDish,
      tags:['蛋白质足','少油'],
      risk:'low',
      reason: `上次吃${badDish}（${lastTime}）你${lastBad.fb.comfort}了，今天换这个`,
      advice:'先吃蛋白质和蔬菜，主食留到最后，吃七分饱就停。',
    });
  } else {
    pool.push({
      type:'safe',
      emoji:'🛡️',
      badge:'安全牌',
      dish: safeDish,
      tags:['蛋白质足','少油'],
      risk:'low',
      reason:'蛋白质足+少油的经典组合，稳定出好状态',
      advice:'先吃蛋白质和蔬菜，主食留到最后，吃七分饱就停。',
    });
  }

  // ④ 探索卡（兜底，始终存在）
  const exploreDish = DISH_MAP['探索'][Math.floor(Math.random()*DISH_MAP['探索'].length)];
  pool.push({
    type:'explore',
    emoji:'🎲',
    badge:'探索一下',
    dish: exploreDish,
    tags:['未记录','轻食'],
    risk:'low',
    reason:'你还没记录过这个，试一次，看看身体怎么反应',
    advice:'新食物第一次不要吃太多，方便观察自己的反应。',
  });

  // 每次取3张：优先级排序后取前3
  return pool.slice(0,3);
}

function selectState(val, btn){
  todayState = val;
  document.querySelectorAll('#state-grid button').forEach(b=>{
    b.style.borderColor='var(--border)';

    b.style.color='var(--ink60)';
  });
  btn.style.borderColor='var(--accent)';
  btn.style.background='var(--accent-s)';
  btn.style.color='var(--accent)';
  // 选完状态后显示抽卡区域
  setTimeout(()=>{
    document.getElementById('card-area').style.display='block';
    document.getElementById('card-area').scrollIntoView({behavior:'smooth',block:'start'});
    // 根据状态调整卡池顺序
    adjustCardPoolByState();
  }, 200);
}

function adjustCardPoolByState(){
  // 根据今天状态重排卡池
  if(todayState==='想吃点清淡'){
    // 把安全牌提前
    const safe=cardPool.find(c=>c.type==='safe');
    if(safe){ cardPool=cardPool.filter(c=>c.type!=='safe');cardPool.unshift(safe); }
  } else if(todayState==='想吃点好的'||todayState==='心情不错'){
    // 把探索卡提前
    const exp=cardPool.find(c=>c.type==='explore');
    if(exp){ cardPool=cardPool.filter(c=>c.type!=='explore');cardPool.unshift(exp); }
  } else if(todayState==='很累很困'){
    // 把低风险的卡提前
    cardPool.sort((a,b)=>(a.risk==='low'?-1:1));
  }
}

function rerollCard(){
  cardIdx = (cardIdx+1) % cardPool.length;
  drawnCard = cardPool[cardIdx];
  const remaining = cardPool.length - 1 - (cardIdx % cardPool.length);
  // 重新翻转回背面再翻到新正面
  const inner = document.getElementById('card-inner');
  inner.style.transition='transform .3s';
  inner.style.transform='rotateY(0deg)';
  document.getElementById('card-actions').style.display='none';
  cardPhase='draw';
  setTimeout(()=>{
    inner.style.transition='transform .6s cubic-bezier(.4,0,.2,1)';
    flipCard();
    const rb=document.getElementById('reroll-btn');
    if(rb) rb.textContent=`换一张 （还剩 ${remaining} 张）`;
    if(remaining<=0 && rb) rb.style.display='none';
  },320);
}

// ── 身体镜子引擎 ──────────────────────────────────────────────────────────────
// 核心：从用户数据里找第一个真实规律，用一句话说出来

function findBodyMirrorInsight(){
  if(meals.length < 2) return null;

  const withFb = meals.filter(m=>m.fb?.comfort);

  // 规律1：特定标签 → 困倦（最强信号）
  const sleepyMeals = withFb.filter(m=>m.fb.comfort==='困倦');
  if(sleepyMeals.length >= 2){
    // 找共同标签
    const tagCount = {};
    sleepyMeals.forEach(m=>(m.analysis?.tags||[]).forEach(t=>{
      tagCount[t]=(tagCount[t]||0)+1;
    }));
    const topTag = Object.entries(tagCount).sort((a,b)=>b[1]-a[1])[0];
    if(topTag && topTag[1] >= 2){
      const ex = sleepyMeals[sleepyMeals.length-1];
      return {
        type:'pattern_sleepy',
        headline:`你每次吃「${topTag[0]}」的东西，下午都会困`,
        body:`${ex.dish||'这类食物'}之后你感觉困倦，已经出现 ${topTag[1]} 次了。不是意志力的问题，是你的身体就是这样反应的。`,
        action:`下次试试${topTag[0]==='高油'?'清蒸或水煮的':topTag[0]==='主食偏多'?'主食减半的':'蛋白质更足的'}版本，看看下午会不会不一样。`,
        emoji:'😴',
        color:'var(--amber)',
        colorSoft:'var(--amber-s)',
      };
    }
  }

  // 规律2：特定结构 → 持续好状态
  const greatMeals = withFb.filter(m=>m.fb.comfort==='有精神'&&m.fb.mood==='满足');
  if(greatMeals.length >= 2){
    const tagCount = {};
    greatMeals.forEach(m=>(m.analysis?.tags||[]).forEach(t=>{
      tagCount[t]=(tagCount[t]||0)+1;
    }));
    const topTag = Object.entries(tagCount).sort((a,b)=>b[1]-a[1])[0];
    if(topTag && topTag[1] >= 2){
      const ex = greatMeals[greatMeals.length-1];
      return {
        type:'pattern_great',
        headline:`「${topTag[0]}」的餐，每次都让你状态很好`,
        body:`${ex.dish||'这类搭配'}之后你总是有精神又满足，出现了 ${topTag[1]} 次。这是你身体喜欢的方向。`,
        action:`把这个搭配作为你的基准线——不知道吃什么的时候，往这个方向选就对了。`,
        emoji:'⚡',
        color:'var(--green)',
        colorSoft:'var(--green-s)',
      };
    }
  }

  // 规律3：撑了又后悔的场景
  const regretMeals = withFb.filter(m=>m.fb.fullness==='撑'&&m.fb.mood==='后悔');
  if(regretMeals.length >= 2){
    const types = regretMeals.map(m=>m.type);
    const typeCount = {};
    types.forEach(t=>typeCount[t]=(typeCount[t]||0)+1);
    const topType = Object.entries(typeCount).sort((a,b)=>b[1]-a[1])[0];
    return {
      type:'pattern_overfull',
      headline:`你${topType[0]}总是吃撑，然后后悔`,
      body:`这已经发生了 ${regretMeals.length} 次了。不是你不自律，是${topType[0]}的场景容易让人失去分寸感。`,
      action:`${topType[0]}试试提前决定吃几分饱，吃到七分就停下来等五分钟，让身体反应过来。`,
      emoji:'😮‍💨',
      color:'var(--accent)',
      colorSoft:'var(--accent-s)',
    };
  }

  // 规律4：状态影响（压力大→身体反应差）
  const stressedBad = withFb.filter(m=>m.state==='压力有点大'&&['困倦','胀气'].includes(m.fb.comfort));
  const stressedAll = withFb.filter(m=>m.state==='压力有点大');
  if(stressedAll.length>=2 && stressedBad.length/stressedAll.length > 0.5){
    return {
      type:'pattern_stress',
      headline:`压力大的时候，你的身体对食物更敏感`,
      body:`你压力大时吃饭，有 ${Math.round(stressedBad.length/stressedAll.length*100)}% 的概率身体反应不好。情绪影响消化，这是真实的生理机制。`,
      action:`压力大时优先选清淡、熟悉的食物，不是这时候探索新口味的好时机。`,
      emoji:'🧠',
      color:'var(--green)',
      colorSoft:'var(--green-s)',
    };
  }

  return null;
}

// 打分提交后触发"身体镜子"弹窗
function showBodyMirrorIfReady(insight){
  if(!insight) return;
  // 只在新规律形成时显示（每个类型只触发一次）
  const shownKey = 'shown_'+insight.type;
  if(sessionStorage.getItem(shownKey)) return;

// ── 日历打卡视图 ───────────────────────────────────────────────────────────────
function renderCalendarView(container){
  const now=new Date();
  const year=now.getFullYear();
  const month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=now.getDate();

  // 把 meals 按日期分组（用 ts 时间戳）
  const mealsByDay={};
  meals.forEach(m=>{
    const d=new Date(m.ts||Date.now());
    if(d.getFullYear()===year&&d.getMonth()===month){
      const day=d.getDate();
      if(!mealsByDay[day]) mealsByDay[day]=[];
      mealsByDay[day].push(m);
    }
  });
  // seed meals 没有 ts，手动映射到本月前几天
  [1,2,3,4,5].forEach((offset,i)=>{
    const day=today-4+i;
    if(day>0&&day<=daysInMonth&&!Object.keys(mealsByDay).length){
      mealsByDay[day]=[meals[i]].filter(Boolean);
    }
  });
  // 补充 seed meals 到近几天
  if(Object.keys(mealsByDay).length===0||meals.slice(0,5).some(m=>!m.ts||m.ts<Date.now()-7*86400000)){
    meals.forEach((m,i)=>{
      const day=Math.max(1,today-4+i);
      if(!mealsByDay[day]) mealsByDay[day]=[];
      if(!mealsByDay[day].find(x=>x.id===m.id)) mealsByDay[day].push(m);
    });
  }

  const weekDays=['日','一','二','三','四','五','六'];
  const weekRow=weekDays.map(d=>`<div style="text-align:center;font-size:11px;color:var(--ink60);font-weight:600;padding:4px 0">${d}</div>`).join('');

  let cells='';
  // 补空格
  for(let i=0;i<firstDay;i++) cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const hasMeals=mealsByDay[d]&&mealsByDay[d].length>0;
    const isToday=d===today;
    const m=hasMeals?mealsByDay[d][0]:null;
    const dotColor=m?(m.fb.comfort==='有精神'||m.fb.comfort==='舒服'?'var(--green)':m.fb.comfort==='困倦'||m.fb.comfort==='胀气'?'var(--red)':'var(--amber)'):'transparent';
    cells+=`<div onclick="${hasMeals?`showDayDetail(${d},${year},${month})`:'null'}" style="
      aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      border-radius:10px;cursor:${hasMeals?'pointer':'default'};position:relative;
      background:${isToday?'var(--accent-s)':hasMeals?'var(--cream)':'transparent'};
      border:${isToday?'1.5px solid var(--accent)':'1px solid transparent'};
      transition:all .15s;">
      <span style="font-size:13px;font-weight:${isToday?700:hasMeals?600:400};color:${isToday?'var(--accent)':hasMeals?'var(--ink)':'var(--ink30)'}">${d}</span>
      ${hasMeals?`<div style="width:5px;height:5px;border-radius:50%;background:${dotColor};margin-top:2px"></div>`:'<div style="width:5px;height:5px"></div>'}
      ${hasMeals&&mealsByDay[d].length>1?`<div style="position:absolute;top:2px;right:2px;font-size:9px;background:var(--accent);color:#fff;border-radius:100px;padding:0 3px;line-height:14px">${mealsByDay[d].length}</div>`:''}
    </div>`;
  }

  // 选中日期的餐次明细
  const selDay=today;
  const selMeals=mealsByDay[selDay]||[];

  container.innerHTML=`
  <div style="margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <p style="font-family:var(--serif);font-size:20px">${year}年${month+1}月</p>
      <p style="font-size:12px;color:var(--ink60)">已打卡 ${Object.keys(mealsByDay).length} 天</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
      ${weekRow}${cells}
    </div>
  </div>
  <div id="day-detail">
    ${renderDayMeals(selDay, selMeals)}
  </div>`;

  // 绑定点击
  window.showDayDetail=function(d,y,mo){
    const dm=mealsByDay[d]||[];
    document.getElementById('day-detail').innerHTML=renderDayMeals(d,dm);
  };
}

function renderDayMeals(day, list){
  if(!list.length) return `<p style="text-align:center;color:var(--ink30);font-size:13px;padding:20px 0">${day}日 暂无记录</p>`;
  const items=list.map(m=>{
    const imgEl=m.wideImg
      ?`<img src="${m.wideImg}" style="width:60px;height:60px;object-fit:cover;border-radius:10px;flex-shrink:0">`
      :`<div style="width:60px;height:60px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0">${ava(m.analysis.risk)}</div>`;
    const feelColor=m.fb.comfort==='有精神'||m.fb.comfort==='舒服'?'var(--green)':m.fb.comfort==='困倦'||m.fb.comfort==='胀气'?'var(--red)':'var(--amber)';
    return `<div style="display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="showMealDetail(${m.id})">
      ${imgEl}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <p style="font-weight:600;font-size:14px">${m.dish||m.analysis.structure.split('，')[0]}</p>
          <span style="font-size:11px;color:${feelColor};font-weight:600">${feelEmoji(m.fb.comfort)} ${m.fb.comfort}</span>
        </div>
        <p style="font-size:12px;color:var(--ink60);margin-top:2px">${m.type} · ${m.cuisine||'家常菜'}</p>
        <p style="font-size:12px;color:var(--ink30);margin-top:2px">${m.analysis.structure}</p>
      </div>
    </div>`;
  }).join('');
  return `<div class="label">${day}日的记录</div><div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:0 16px">${items}</div>`;
}

// ── 菜系地图视图 ───────────────────────────────────────────────────────────────
function renderMapView(container){
  // 统计已解锁的省份
  const unlocked={};
  meals.forEach(m=>{
    if(m.province&&m.province!=='全国'&&m.province!=='境外'){
      if(!unlocked[m.province]) unlocked[m.province]={count:0,meals:[],cuisine:m.cuisine};
      unlocked[m.province].count++;
      unlocked[m.province].meals.push(m);
    }
  });
  const total=PROVINCES.filter(p=>p.id!=='全国'&&p.id!=='境外').length;
  const unlockedCount=Object.keys(unlocked).length;

  // 绘制 SVG 地图
  const svgProvinces=PROVINCES.map(p=>{
    const isUnlocked=unlocked[p.id];
    const fill=isUnlocked?'var(--accent)':'var(--border)';
    const opacity=isUnlocked?1:0.5;
    return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"
      rx="4" ry="4" fill="${fill}" opacity="${opacity}"
      style="cursor:${isUnlocked?'pointer':'default'};transition:all .2s"
      onclick="${isUnlocked?`showProvinceDetail('${p.id}')`:''}"
    />
    <text x="${p.x+p.w/2}" y="${p.y+p.h/2+1}" text-anchor="middle" dominant-baseline="middle"
      style="font-size:${p.w>50?'9':'7'}px;fill:${isUnlocked?'#fff':'var(--ink30)'};pointer-events:none;font-family:var(--sans);font-weight:${isUnlocked?600:400}">
      ${p.w>40?p.id:''}
    </text>
    ${isUnlocked?`<text x="${p.x+p.w/2}" y="${p.y+p.h/2+10}" text-anchor="middle" dominant-baseline="middle"
      style="font-size:10px;fill:#fff;pointer-events:none">${p.emoji}</text>`:''}`;
  }).join('');

  // 解锁列表
  const unlockedList=Object.entries(unlocked).map(([province,data])=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="showProvinceDetail('${province}')">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--accent-s);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">
        ${PROVINCES.find(p=>p.id===province)?.emoji||'🍽️'}
      </div>
      <div style="flex:1">
        <p style="font-weight:600;font-size:14px">${data.cuisine}</p>
        <p style="font-size:12px;color:var(--ink60)">${province} · 记录了 ${data.count} 餐</p>
      </div>
      <span style="font-size:12px;color:var(--ink30)">→</span>
    </div>`).join('');

  container.innerHTML=`
  <div style="text-align:center;margin-bottom:16px">
    <p style="font-family:var(--serif);font-size:22px">美食版图</p>
    <p style="font-size:13px;color:var(--ink60);margin-top:4px">已解锁 <strong style="color:var(--accent)">${unlockedCount}</strong> / ${total} 个省份菜系</p>
  </div>

  <div style="background:var(--cream);border-radius:var(--r);padding:12px;margin-bottom:16px;overflow:hidden">
    <svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
      ${svgProvinces}
    </svg>
    <p style="text-align:center;font-size:11px;color:var(--ink30);margin-top:4px">点击橙色省份查看详情</p>
  </div>

  <div style="display:flex;gap:12px;margin-bottom:16px">
    <div style="flex:1;background:var(--accent-s);border-radius:var(--rs);padding:12px;text-align:center">
      <p style="font-size:24px;font-weight:700;color:var(--accent)">${unlockedCount}</p>
      <p style="font-size:11px;color:var(--ink60)">已解锁菜系</p>
    </div>
    <div style="flex:1;background:var(--cream);border-radius:var(--rs);padding:12px;text-align:center">
      <p style="font-size:24px;font-weight:700;color:var(--ink)">${total-unlockedCount}</p>
      <p style="font-size:11px;color:var(--ink60)">待探索</p>
    </div>
    <div style="flex:1;background:var(--green-s);border-radius:var(--rs);padding:12px;text-align:center">
      <p style="font-size:24px;font-weight:700;color:var(--green)">${meals.length}</p>
      <p style="font-size:11px;color:var(--ink60)">总记录餐</p>

  ${unlockedCount>0?`<div class="label">已解锁菜系</div>
  <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:0 16px">
    ${unlockedList}

  <div id="province-detail"></div>`;

  window.showProvinceDetail=function(province){
    const data=unlocked[province];if(!data)return;

      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)" onclick="showMealDetail(${m.id})">

          </div>
        </div>
        ${mealItems}
      </div>`;
    document.getElementById('province-detail').scrollIntoView({behavior:'smooth',block:'start'});
  };
}

function computeInsights(){
  const good = meals.filter(m=>['舒服','有精神'].includes(m.fb?.comfort) && m.fb?.mood==='满足');
  const bad  = meals.filter(m=>['困倦','胀气'].includes(m.fb?.comfort));
  const overfull = meals.filter(m=>m.fb?.fullness==='撑');
  const regret = meals.filter(m=>m.fb?.mood==='后悔');

  // 最舒服的餐：取好评餐里出现的菜品/结构
  const bestMeals = good.slice(-3).map(m=>`${m.dish||m.analysis.structure.split('，')[0]}（${m.date}${m.type}）`);

  // 最容易困：找差评且有困倦的餐，找共同标签
  const sleepyMeals = bad.filter(m=>m.fb?.comfort==='困倦');
  let sleepyStr = '暂无足够数据';
  if(sleepyMeals.length>=1){
    const tags = sleepyMeals.flatMap(m=>m.analysis?.tags||[]);
    const freq = {};tags.forEach(t=>freq[t]=(freq[t]||0)+1);
    const topTag = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
    const ex = sleepyMeals[sleepyMeals.length-1];
    sleepyStr = topTag
      ? `${ex.dish||'高油高碳的餐'} → 饭后困倦，共出现 ${sleepyMeals.length} 次，多和「${topTag[0]}」有关`
      : `${ex.dish||'重口味的餐'} → 饭后困倦，共出现 ${sleepyMeals.length} 次`;
  }

  // 最容易撑：场景分析
  let overfullStr = '暂无足够数据';
  if(overfull.length>=1){
    const types = overfull.map(m=>m.type);
    const freq = {};types.forEach(t=>freq[t]=(freq[t]||0)+1);
    const topType = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
    overfullStr = `${topType[0]}最容易吃撑，共 ${overfull.length} 次，${regret.length>0?'其中 '+regret.length+' 次后悔了':''}`;
  }

  // 性价比最高：值 + 舒服/有精神
  const goodValue = meals.filter(m=>m.fb?.price==='值'&&['舒服','有精神'].includes(m.fb?.comfort));
  let bestValue = '暂无足够数据';
  if(goodValue.length>=1){
    const ex = goodValue[goodValue.length-1];
    bestValue = `${ex.dish||'这顿'}：你觉得价格值，身体感受也好`;
  }

  // 状态 → 身体反应关联
  const stressedMeals = meals.filter(m=>m.state==='压力有点大'&&m.fb?.comfort);
  let stateInsight = null;
  if(stressedMeals.length>=2){
    const badStress = stressedMeals.filter(m=>['困倦','胀气'].includes(m.fb?.comfort));
    if(badStress.length/stressedMeals.length>0.5){
      stateInsight = `你压力大时吃饭，${Math.round(badStress.length/stressedMeals.length*100)}% 的概率身体反应不好，下次试试先休息 10 分钟再吃`;
    }
  }

  // 最值得调整的一件事
  let action = '再记录几餐，规律就会浮现';
  if(sleepyMeals.length>=2){
    const ex=sleepyMeals[sleepyMeals.length-1];
    const tag=(ex.analysis?.tags||[])[0]||'重口味';
    action=`减少「${tag}」的频率，你有 ${sleepyMeals.length} 次饭后困倦和它有关`;
  } else if(overfull.length>=2){
    action=`${overfull[overfull.length-1].type}少点一份，你已经撑了 ${overfull.length} 次了`;
  } else if(good.length>=1){
    const ex=good[good.length-1];
    action=`多吃「${ex.dish||'让你舒服的那类餐'}」，这是你目前身体反应最好的方向`;
  }

  // 生成结论句
  let conclusion = '';
  if(sleepyMeals.length>=1&&good.length>=1){
    const badEx=sleepyMeals[sleepyMeals.length-1];
    const goodEx=good[good.length-1];
    conclusion=`你${badEx.date}吃了${badEx.dish||'重口味的东西'}，饭后困倦；${goodEx.date}吃了${goodEx.dish||'蛋白质足的搭配'}，感觉${goodEx.fb?.comfort}。身体在告诉你区别在哪里。`;
  } else if(good.length>=2){
    conclusion=`这周吃得最好的是${good.slice(-2).map(m=>m.dish||'那顿').join('和')}，身体反应都不错。继续这个方向。`;
  } else if(meals.length>=3){
    conclusion=`记录了 ${meals.length} 餐，规律正在浮现。再记几天，洞察会更准确。`;
  }

  return {bestMeals, sleepyStr, overfullStr, bestValue, stateInsight, action, conclusion};
}

function renderInsight(){
  const s=document.getElementById('s-insight');
  const n=meals.length;
  const phase=n<3?0:n<8?1:n<21?2:3;

  // ── 阶段0：还没数据 ───────────────────────────────────────────
  if(phase===0){
    s.innerHTML=`
    <div style="min-height:70vh;display:flex;flex-direction:column;justify-content:center">
      <p style="font-size:13px;color:var(--ink60);margin-bottom:8px">你的身体拼图</p>
      <h1 style="font-family:var(--serif);font-size:32px;line-height:1.2;margin-bottom:16px">
        还差 <em style="color:var(--accent);font-style:italic">${3-n}</em> 餐<br>第一块就出来了
      </h1>
      <p style="font-size:15px;color:var(--ink60);line-height:1.7;margin-bottom:32px">每一餐都是一块拼图。<br>吃完打个分，身体的秘密慢慢浮现。</p>
      <button class="btn btn-primary" onclick="switchTab('camera')">📷 去记录这一餐</button>
    </div>`;
    return;
  }

  // ── 计算四块拼图 ──────────────────────────────────────────────
  const ins=computeInsights();
  const good=meals.filter(m=>['舒服','有精神'].includes(m.fb?.comfort)&&m.fb?.mood==='满足');
  const bad=meals.filter(m=>['困倦','胀气'].includes(m.fb?.comfort));
  const overfull=meals.filter(m=>m.fb?.fullness==='撑');
  const cuisines=[...new Set(meals.map(m=>m.cuisine).filter(c=>c&&c!=='家常菜'))];
  const recent7=meals.slice(-7);
  const early7=meals.slice(0,7);
  const recentRate=recent7.filter(m=>['舒服','有精神'].includes(m.fb?.comfort)).length/Math.max(recent7.length,1);
  const earlyRate=early7.filter(m=>['舒服','有精神'].includes(m.fb?.comfort)).length/Math.max(early7.length,1);
  const improving=recentRate>earlyRate+0.1;

  // 每块拼图的数据
  const wow2tags=(()=>{
    const tc={};
    good.forEach(m=>(m.analysis?.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
    return Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,2);
  })();

  const pieces=[
    // 块0：喜欢吃这个
    {
      unlocked:good.length>=1,
      emoji:'😋',label:'喜欢吃这个',
      color:'var(--green)',colorSoft:'var(--green-s)',
      headline:'原来我喜欢吃这个',
      body: good.length>=1 ? good.slice(-3).map(m=>
        `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:22px;flex-shrink:0">${feelEmoji(m.fb.comfort)}</span>
          <div>
            <p style="font-size:15px;font-weight:600">${m.dish||m.analysis.structure.split('，')[0]}</p>
            <p style="font-size:12px;color:var(--green);margin-top:2px">${m.fb.comfort} · ${m.date} ${m.type}</p>
          </div>
        </div>`).join('')+
        `<p style="font-size:13px;color:var(--ink60);padding-top:12px">吃了 ${good.length} 次让你舒服的餐，方向越来越清晰</p>`
      : '',
      hint:'再打几次好评，这块拼图就出来了',
    },
    // 块1：该这么吃
    {
      unlocked:wow2tags.length>=1,
      emoji:'🥢',label:'该这么吃',
      color:'var(--accent)',colorSoft:'var(--accent-s)',
      headline:'我该这么吃',
      body: wow2tags.length>=1 ? [
        wow2tags[0]?`<div style="padding:12px 0;border-bottom:1px solid var(--border)"><p style="font-size:15px">✓ &nbsp;${wow2tags[0][0]}的搭配，让你有精神的概率最高</p></div>`:null,
        bad.length>=1?`<div style="padding:12px 0;border-bottom:1px solid var(--border)"><p style="font-size:15px">↓ &nbsp;${(bad[bad.length-1].analysis?.tags||['重口味'])[0]}之后你容易不舒服</p></div>`:null,
        overfull.length>=2?`<div style="padding:12px 0"><p style="font-size:15px">○ &nbsp;你的合适饭量比你想的小一点</p></div>`:null,
      ].filter(Boolean).join('')+
      `<p style="font-size:13px;color:var(--ink60);padding-top:12px">这是你的专属吃法，不是通用建议</p>`
      : '',
      hint:'好评和差评各积累几次，规律就算出来了',
    },
    // 块2：口味探索
    {
      unlocked:cuisines.length>=2,
      emoji:'🗺️',label:'口味探索',
      color:'var(--amber)',colorSoft:'var(--amber-s)',
      headline:'这个口味也不错',
      body: cuisines.length>=2 ? cuisines.map(c=>{
        const cms=meals.filter(m=>m.cuisine===c);
        const g=cms.filter(m=>['舒服','有精神'].includes(m.fb?.comfort));
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">
          <p style="font-size:15px">${c}</p>
          <p style="font-size:13px;color:${g.length>0?'var(--green)':'var(--ink60)'}">${g.length>0?`${g.length}次感觉不错`:`试了${cms.length}次`}</p>
        </div>`;
      }).join('')+
      `<button onclick="document.getElementById('wow-sheet').remove();switchTab('history');setTimeout(()=>switchHistoryView('map'),100)"
        style="margin-top:14px;width:100%;padding:11px;border:1.5px solid var(--amber);border-radius:100px;background:transparent;color:var(--amber);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer">
        看我的美食地图 →
      </button>`
      : '',
      hint:`再探索 ${Math.max(0,2-cuisines.length)} 种新菜系解锁`,
    },
    // 块3：越来越舒服
    {
      unlocked:n>=10,
      emoji:'✨',label:'越来越舒服',
      color:'var(--green)',colorSoft:'var(--green-s)',
      headline:'我的身体越来越舒服了',
      body: n>=10 ?
        `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
          <div style="background:${improving?'var(--green)':'var(--cream)'};border-radius:var(--rs);padding:16px;text-align:center">
            <p style="font-size:26px;font-weight:700;color:${improving?'#fff':'var(--ink)'}">${Math.round(recentRate*100)}%</p>
            <p style="font-size:11px;color:${improving?'rgba(255,255,255,.75)':'var(--ink60)'};margin-top:3px">近期舒服率</p>
          </div>
          <div style="background:var(--cream);border-radius:var(--rs);padding:16px;text-align:center">
            <p style="font-size:26px;font-weight:700;color:var(--ink)">${n}</p>
            <p style="font-size:11px;color:var(--ink60);margin-top:3px">累计记录</p>
          </div>
        </div>
        <p style="font-size:14px;color:var(--ink60);line-height:1.7">${improving?`比刚开始提高了 ${Math.round((recentRate-earlyRate)*100)}%。不是因为自律，是因为你越来越了解自己了。`:'规律在积累，数据会越来越准。'}</p>`
      : '',
      hint:`记录到 10 餐后解锁（还差 ${10-n} 餐）`,
    },
  ];

  const unlockedCount=pieces.filter(p=>p.unlocked).length;

  // ── 拼图格子 ─────────────────────────────────────────────────
  const grid=pieces.map((p,i)=>`
    <div onclick="${p.unlocked?`showWowSheet(${i})`:'null'}" style="
      aspect-ratio:1;border-radius:16px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:6px;cursor:${p.unlocked?'pointer':'default'};
      background:${p.unlocked?p.color:'var(--cream)'};
      border:${p.unlocked?'none':'2px dashed var(--border)'};
      transition:transform .15s;user-select:none"
      onpointerdown="${p.unlocked?'this.style.transform="scale(.95)"':''}"
      onpointerup="${p.unlocked?'this.style.transform="scale(1)"':''}">
      <span style="font-size:${p.unlocked?32:26}px">${p.emoji}</span>
      <p style="font-size:11px;font-weight:600;
        color:${p.unlocked?'#fff':'var(--ink30)'};
        text-align:center;line-height:1.3;padding:0 6px">${p.unlocked?p.label:'?'}</p>
    </div>`).join('');

  // ── 结论句 ────────────────────────────────────────────────────
  const conclusion=ins.conclusion?`
    <div style="background:var(--accent);border-radius:var(--r);padding:18px;margin-bottom:20px">
      <p style="font-size:11px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px">你的身体说</p>
      <p style="font-family:var(--serif);font-size:17px;color:#fff;line-height:1.7">"${ins.conclusion}"</p>
    </div>`:'';

  s.innerHTML=`
    <p style="font-size:13px;color:var(--ink60);margin-bottom:6px">你的身体拼图</p>
    <h1 style="font-family:var(--serif);font-size:28px;margin-bottom:20px">
      已拼上 <em style="color:var(--accent);font-style:normal">${unlockedCount}</em><span style="font-size:18px;color:var(--ink30)"> / 4</span>
    </h1>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px">
      ${grid}
    </div>
    ${conclusion}
    <p style="font-size:12px;color:var(--ink30);text-align:center;padding-bottom:8px">
      基于你的 ${n} 餐真实数据 · 不是通用建议
    </p>`;

  // ── Bottom sheet：点击拼图弹出 ───────────────────────────────
  window.showWowSheet=function(i){
    const p=pieces[i];
    // 移除旧的
    document.getElementById('wow-sheet')?.remove();
    const sheet=document.createElement('div');
    sheet.id='wow-sheet';
    sheet.style.cssText=`position:fixed;inset:0;z-index:600;display:flex;flex-direction:column;justify-content:flex-end`;
    sheet.innerHTML=`
      <div onclick="document.getElementById('wow-sheet').remove()"
        style="flex:1;background:rgba(26,22,18,.3)"></div>
      <div style="background:var(--white);border-radius:24px 24px 0 0;padding:0 20px 40px;
        max-height:80vh;overflow-y:auto;animation:fadeUp .35s ease">
        <!-- 把手 -->
        <div style="display:flex;justify-content:center;padding:12px 0 4px">
          <div style="width:36px;height:4px;border-radius:2px;background:var(--border)"></div>
        </div>
        <!-- 头部 -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 0 20px;border-bottom:1px solid var(--border);margin-bottom:4px">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:28px">${p.emoji}</span>
            <div>
              <p style="font-size:11px;font-weight:600;color:${p.color};text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">哇</p>
              <p style="font-family:var(--serif);font-size:20px">${p.headline}</p>
            </div>
          </div>
          <button onclick="document.getElementById('wow-sheet').remove()"
            style="background:var(--cream);border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--ink60);display:flex;align-items:center;justify-content:center">✕</button>
        </div>
        <!-- 内容 -->
        <div style="padding-top:4px">${p.body}</div>
      </div>`;
    document.body.appendChild(sheet);
    sheet.querySelector('div[onclick]').addEventListener('click',e=>{
      if(e.target===sheet.querySelector('div[onclick]')) sheet.remove();
    });
  };
}

// ── PROFILE / ARCHIVES ───────────────────────────────────────────────────────
function renderProfile(){
  const budget = profile.budget || '15–30 元';
  const goal = profile.goal || '下午不困';
  const avoid = profile.avoid || '无限制';
  const feeling = profile.feeling || '容易困倦';
  const eatingStyle = profile.eatingStyle || '很在乎吃得舒服';
  const tasteStats = computeTasteStats();
  const safeMeals = meals.filter(m=>['舒服','有精神'].includes(m.fb?.comfort)&&m.fb?.mood==='满足').slice(-3);
  const riskMeals = meals.filter(m=>['困倦','胀气'].includes(m.fb?.comfort)||m.fb?.mood==='后悔').slice(-3);
  const s=document.getElementById('s-profile');
  s.innerHTML=`
  <div class="fade" style="margin-bottom:20px">
    <p style="font-size:13px;color:var(--ink60)">我的档案</p>
    <h1 style="font-family:var(--serif);font-size:28px;margin-top:4px">身体和餐饮上下文</h1>
    <p style="font-size:14px;color:var(--ink60);line-height:1.6;margin-top:8px">档案只服务身体拼图和餐前建议，不做医疗诊断。</p>
  </div>

  <div class="card fade">
    <div class="label">身体档案</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${profileStat('目标',goal)}
      ${profileStat('常见饭后感受',feeling)}
      ${profileStat('吃饭风格',eatingStyle)}
      ${profileStat('数据阶段',meals.length<8?'看见阶段':meals.length<21?'行动阶段':'成就阶段')}
    </div>
  </div>

  <div class="card fade" style="animation-delay:.06s">
    <div class="label">餐饮档案</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${profileStat('忌口',avoid)}
      ${profileStat('预算',budget)}
      ${profileStat('偏好菜系',tasteStats.topCuisine)}
      ${profileStat('已探索菜系',tasteStats.cuisineCount+' 种')}
    </div>
  </div>

  <div class="card fade" style="animation-delay:.12s">
    <div class="label">安全食物</div>
    ${safeMeals.length?safeMeals.map(m=>profileMealRow(m,'var(--green)')).join(''):'<p style="font-size:14px;color:var(--ink60)">继续记录，安全食物会从好反馈里浮现。</p>'}
  </div>

  <div class="card fade" style="animation-delay:.18s">
    <div class="label">风险组合</div>
    ${riskMeals.length?riskMeals.map(m=>profileMealRow(m,'var(--amber)')).join(''):'<p style="font-size:14px;color:var(--ink60)">目前还没有明显风险组合。</p>'}
  </div>

  <div class="card fade" style="animation-delay:.24s;background:var(--cream);border-style:dashed">
    <div class="label">隐私与边界</div>
    <p style="font-size:14px;color:var(--ink60);line-height:1.7">不收体检报告，不接硬件，不输出医学结论。AI 只做饮食结构、身体反馈和下一餐建议的辅助判断。</p>
  </div>

  <button onclick="openProductMapFromProfile()" style="width:100%;border:none;background:transparent;color:var(--ink30);font-family:var(--sans);font-size:12px;padding:8px 0 2px;cursor:pointer">查看产品地图 →</button>`;
}

function profileStat(label,value){
  return `<div style="background:var(--cream);border-radius:var(--rs);padding:12px">
    <p style="font-size:11px;color:var(--ink60);margin-bottom:4px">${label}</p>
    <p style="font-size:14px;font-weight:600;color:var(--ink);line-height:1.4">${value}</p>
  </div>`;
}

function profileMealRow(m,color){
  return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
    <div style="width:36px;height:36px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center">${ava(m.analysis.risk)}</div>
    <div style="flex:1">
      <p style="font-size:14px;font-weight:600">${m.dish||m.analysis.structure.split('，')[0]}</p>
      <p style="font-size:12px;color:${color};margin-top:2px">${m.fb?.comfort||'未反馈'} · ${m.date}${m.type}</p>
    </div>
  </div>`;
}

function computeTasteStats(){
  const cuisines=meals.map(m=>m.cuisine).filter(Boolean);
  const freq={};cuisines.forEach(c=>freq[c]=(freq[c]||0)+1);
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  return {topCuisine:top?top[0]:'暂无', cuisineCount:new Set(cuisines).size};
}

// ── PRODUCT MAP ──────────────────────────────────────────────────────────────
function renderProductMap(){
  const s=document.getElementById('s-productmap');
  s.innerHTML=`
  <div class="fade" style="margin-bottom:20px">
    <p style="font-size:13px;color:var(--ink60)">干饭产品地图</p>
    <h1 style="font-family:var(--serif);font-size:30px;line-height:1.2;margin-top:4px">先有地图，再开工</h1>
    <p style="font-size:14px;color:var(--ink60);line-height:1.7;margin-top:10px">这张地图把 5 个 MVP 串成一条线：先让用户愿意记录，再让数据变成建议，最后帮用户真正吃到适合自己的饭。</p>
  </div>

  ${mapSection('产品主线','所有阶段都回答同一个问题：下一餐怎么吃，才能开心，也让身体舒服',[
    ['1','记录真实一餐','照片、餐次、场景、菜品、饭前状态和饭后感受进入系统'],
    ['2','理解身体反应','把“困、撑、胀、舒服、有精神”变成个人规律'],
    ['3','生成餐饮计划','用目标、口味、预算、身体反馈生成日餐和周餐'],
    ['4','看懂身体结构','血糖、睡眠、心率、运动和饭后反馈形成身体结构，只做解释不生成菜单'],
    ['5','完成吃饭动作','食材清单、购买渠道、定制配餐承接建议']
  ])}

  ${mapSection('MVP 关系','不是五个独立功能，而是五层能力逐步叠加',[
    ['1.0','基础功能开发','基础信息收集、记录分析、7 天拼图、餐前抽卡、个人饮食地图、趋势行动、账号'],
    ['2.0','餐饮助手','接住 1.0 的档案和反馈，生成日餐、周餐、食材分量、营养和预算方案'],
    ['3.0','目标约束','智能算法基于目标、历史餐饮和身体记录，给出体重与进食节奏建议，用户选择后才同步'],
    ['4.0','身体结构','分层采集 App、手机、穿戴和专业设备数据；未授权或采不到的数据不进身体结构判断'],
    ['5.0','计划履约','把餐饮计划转成购物清单、商超跳转、定制配餐和履约反馈']
  ])}

  ${mapSection('核心数据对象','原型之后的架构设计要围绕这些对象展开',[
    ['Profile','用户档案','目标、预算、忌口、常见感受、吃饭风格、账号状态'],
    ['Goal','目标','越来越舒服、减重、维持体重、控糖、睡眠、心情、进食节奏'],
    ['Meal','单餐','餐次、时间、菜品、菜系、照片、状态'],
    ['Analysis','分析','结构、份量、油脂、风险、标签、建议'],
    ['Feedback','反馈','实际吃了多少、饱腹、身体、情绪、价格、口味'],
    ['Insight','身体镜子','规律类型、证据、行动建议、触发条件'],
    ['DrawCard','抽卡','推荐菜、来源、风险、采纳/跳过'],
    ['Puzzle','身体拼图','四块拼图、解锁条件、阶段状态'],
    ['MealPlan','餐饮计划','日餐、周餐、餐次、食材、分量、营养、预算、替换理由'],
    ['BodySignal','身体信号','血糖、睡眠、心率、运动、体重、进食窗口、来源、授权状态和可信度'],
    ['Fulfillment','履约','食材清单、渠道、价格、替换、购买结果、配餐反馈']
  ])}

  ${mapSection('算法接力','算法不是一次性大模型，而是随阶段逐步增强',[
    ['1.0','识别和规律','识别菜品结构，结合饭后反馈找出个人身体镜子'],
    ['2.0','计划生成','按目标、口味、预算、忌口和反馈给餐饮计划排序'],
    ['3.0','目标约束','把减重、进食节奏、控糖、睡眠等目标转成餐次规则'],
    ['4.0','结构解释','只用已授权和已采集的数据解释身体结构；缺失数据自动降级'],
    ['5.0','履约匹配','把餐饮计划拆成可买食材，按价格、库存、渠道和替换方案匹配']

  <div class="card fade" style="animation-delay:.18s;background:var(--accent);border:none">

  ${stageCard('MVP 1.0','基础功能开发','先拿到可信数据：档案、记录、分析、饭后反馈、身体拼图、饮食地图和账号。')}

  ${stageCard('MVP 5.0','计划履约','把餐饮计划接到履约：一键买食材、商超跳转、定制配餐和商业闭环。')}`;
}

function mapSection(title,desc,items){
  return `<div class="card fade">
    <div class="label">${title}</div>
    <p style="font-size:14px;color:var(--ink60);line-height:1.6;margin-bottom:12px">${desc}</p>
    ${items.map(([a,b,c])=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:32px;height:32px;border-radius:50%;background:var(--accent-s);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${a}</div>
      <div>
        <p style="font-size:14px;font-weight:700;color:var(--ink)">${b}</p>
        <p style="font-size:12px;color:var(--ink60);line-height:1.5;margin-top:2px">${c}</p>
      </div>
    </div>`).join('')}
  </div>`;
}

function stageCard(version,title,scope){
  return `<div class="card fade">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px">
      <span class="chip chip-amber">${version}</span>
      <span style="font-size:12px;color:var(--ink30)">阶段</span>
    </div>
    <p style="font-family:var(--serif);font-size:20px;margin-bottom:6px">${title}</p>
    <p style="font-size:13px;color:var(--ink60);line-height:1.6">${scope}</p>
  </div>`;
}

renderRoadmap();
show('roadmap');
